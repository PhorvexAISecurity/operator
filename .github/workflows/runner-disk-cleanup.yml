name: Self-hosted runner disk cleanup

# Request exact completed-run builder reclaim through the installed scoped helper.
# The idle-gated timer owns deletion; this job never prunes Docker or its workspace.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: runner-disk-cleanup
  cancel-in-progress: false
  queue: max

jobs:
  cleanup:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Refresh completed runner build leases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper=/usr/local/libexec/phvx-disk-hygiene
          if [ ! -x "$helper" ]; then
            echo '::error::Scoped runner hygiene helper is not installed.' >&2
            exit 1
          fi
          "$helper" refresh --repository "$GITHUB_REPOSITORY"

      - name: Inventory scoped runner hygiene
        run: /usr/local/libexec/phvx-disk-hygiene report

      - name: Request idle-gated completed-run builder reclaim
        run: /usr/local/libexec/phvx-disk-hygiene request

      - name: Report pending scoped runner hygiene
        run: /usr/local/libexec/phvx-disk-hygiene report
