name: LiteLLM gateway metrics source checks

on:
  pull_request:
    paths:
      - 'build/test-harness/fixtures/litellm-live/**'
      - 'build/integrations/litellm-gateway-runtime/**'
      - '.github/workflows/litellm-gateway-metrics.yml'
  push:
    branches: [main]
    paths:
      - 'build/test-harness/fixtures/litellm-live/**'
      - 'build/integrations/litellm-gateway-runtime/**'
      - '.github/workflows/litellm-gateway-metrics.yml'

permissions:
  contents: read

concurrency:
  group: >-
    litellm-metrics-source-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || format('{0}-{1}-{2}', github.event_name, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Provision pinned Python 3.11 (SHA256-verified, relocatable)
        run: |
          bin="$(bash tools/provision-python.sh 3.11 "$RUNNER_TEMP/python")"
          echo "$bin" >> "$GITHUB_PATH"
      # The guard and metrics-preparation suites read YAML renders.
      - run: python -m pip install PyYAML==6.0.2
      - name: Standard-library source and runtime recipe contract
        run: python3 -B build/integrations/litellm-gateway-runtime/verify_reuse.py
      - name: Gateway terminal accounting, enforcement and opt-in rendering
        run: python3 -B -m unittest discover -s build/test-harness/fixtures/litellm-live -p 'test_*.py' -v
      - name: Actual gateway process default-off and metrics opt-in
        run: python3 -B build/integrations/litellm-gateway-runtime/test_entrypoint.py -v
      - name: Check source inputs stayed unchanged
        run: git diff --exit-code
