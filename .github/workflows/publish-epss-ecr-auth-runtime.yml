name: EPSS ECR auth runtime tests and publication

on:
  pull_request:
    paths:
      - 'build/integrations/epss-ecr-auth-runtime/**'
      - 'phorvex/internal/epssfeed/**'
      - 'phorvex/charts/phorvex/**'
      - 'deploy/helm/phorvex-stack/charts/phorvex-*.tgz'
      - 'tools/test_epss_irsa_chart.py'
      - 'deploy/eks/epss/**'
      - '.github/workflows/publish-epss-ecr-auth-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'build/integrations/epss-ecr-auth-runtime/**'
      - 'phorvex/internal/epssfeed/**'
      - 'phorvex/charts/phorvex/**'
      - 'tools/test_epss_irsa_chart.py'
      - 'deploy/eks/epss/**'
      - '.github/workflows/publish-epss-ecr-auth-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    epss-ecr-auth-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || format('{0}-{1}-{2}', github.event_name, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RECIPE: build/integrations/epss-ecr-auth-runtime

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: |
            build/integrations/epss-ecr-auth-runtime/go.sum
            phorvex/go.sum
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static recipe and chart checks
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 "$RECIPE/verify_recipe.py"
          python3 -m unittest discover -s "$RECIPE" -p test_publication.py -v
          python3 tools/test_epss_irsa_chart.py
          python3 -m unittest discover -s deploy/eks/epss -p test_verify_dry_run.py -v
          bash tools/check-vendored-chart.sh
      - name: Require unchanged tracked sources
        run: git diff --exit-code

  isolated-tests:
    needs: test
    # Reserved for an owner-provisioned isolated AWS executor. Never the shared
    # phorvex gateway/runner. No capacity or runner registration happens here.
    runs-on: [self-hosted, linux, x64, phorvex-isolated-aws]
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: |
            build/integrations/epss-ecr-auth-runtime/go.sum
            phorvex/go.sum
      - name: Standalone helper race tests and vet
        working-directory: build/integrations/epss-ecr-auth-runtime
        run: |
          go mod verify
          go test -mod=readonly -race -count=1 ./...
          go vet -mod=readonly ./...
      - name: Existing feed auth, expiry, timeout and strict partial regressions
        working-directory: phorvex
        run: go test -mod=readonly -race -count=1 ./internal/epssfeed
      - name: Real helper writer and unchanged loader under UID 65532
        run: |
          set -euo pipefail
          fixture="$(mktemp -d /tmp/epss-auth-ci.XXXXXX)"
          trap 'sudo rm -rf -- "$fixture"' EXIT
          (cd "$RECIPE" && go test -mod=readonly -c -o "$fixture/helper-tests" .)
          (cd phorvex && go test -mod=readonly -c -o "$fixture/loader-tests" ./internal/epssfeed)
          sudo chown -R 65532:65532 "$fixture"
          sudo -u '#65532' -g '#65532' env TMPDIR="$fixture" \
            "$fixture/helper-tests" -test.v -test.run='^TestWriterFilesystem$'
          sudo -u '#65532' -g '#65532' env TMPDIR="$fixture" EPSS_AUTH_TEST_BINARY="$fixture/helper-tests" \
            "$fixture/loader-tests" -test.v -test.run='^TestHelperOutputWithUnchangedLoader$'
      - name: Require unchanged tracked sources
        run: git diff --exit-code

  publish:
    concurrency:
      group: epss-ecr-auth-publish-${{ github.sha }}
      cancel-in-progress: false
      queue: max
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [test, isolated-tests]
    runs-on: [self-hosted, linux, x64, phorvex-isolated-aws]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require exact reviewed main source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 "$RECIPE/verify_recipe.py"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - name: Gate existing repository lifecycle and immutable source tag
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$REGISTRY" = 753556437180.dkr.ecr.us-east-2.amazonaws.com
          tag="epss-ecr-auth-$SOURCE_SHA"
          checks="$(mktemp -d)"
          trap 'rm -rf -- "$checks"' EXIT
          aws ecr get-lifecycle-policy --repository-name phorvex --output json > "$checks/lifecycle.json"
          python3 "$RECIPE/verify_recipe.py" lifecycle "$checks/lifecycle.json" "$tag"
          aws ecr batch-get-image --repository-name phorvex --image-ids "imageTag=$tag" --output json > "$checks/tag.json"
          python3 "$RECIPE/verify_recipe.py" tag-absent "$checks/tag.json" "$tag"
          echo "image=$REGISTRY/phorvex:$tag" >> "$GITHUB_OUTPUT"
      - name: Build pinned standalone helper and publish durable tag
        id: build
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          metadata="$(mktemp)"
          trap 'rm -f -- "$metadata"' EXIT
          docker buildx build --platform linux/amd64 --pull --push --tag "$IMAGE" \
            --metadata-file "$metadata" --file "$RECIPE/Dockerfile" "$RECIPE"
          METADATA="$metadata" python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          digest = json.loads(Path(os.environ['METADATA']).read_text()).get('containerimage.digest')
          if not isinstance(digest, str) or not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('invalid published digest')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('digest=' + digest + '\n')
          PY
      - name: Verify remote digest and record publication evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" | grep -Eq "^Digest:[[:space:]]+$DIGEST$"
          docker pull "$IMAGE"
          failure="$(mktemp)"
          trap 'rm -f -- "$failure"' EXIT
          set +e
          docker run --rm --read-only --network=none --cap-drop=ALL \
            --security-opt=no-new-privileges --user=65532:65532 "$IMAGE" > "$failure" 2>&1
          result=$?
          set -e
          test "$result" = 1
          python3 - "$failure" <<'PYTEST'
          from pathlib import Path
          import sys
          if Path(sys.argv[1]).read_bytes() != b'EPSS registry authentication initialization failed\n':
              raise SystemExit('published image did not fail safely without web identity')
          PYTEST
          python3 "$RECIPE/write_publish_receipt.py"
      - uses: actions/upload-artifact@v4
        with:
          name: epss-ecr-auth-publication-${{ github.sha }}
          path: epss-ecr-auth-publish-receipt.json
          if-no-files-found: error
