name: Monitoring A1 alerting checks

on:
  pull_request:
    paths:
      - deploy/monitoring/**
      - .github/workflows/monitoring-alerting.yml
  push:
    branches: [main]
    paths:
      - deploy/monitoring/**
      - .github/workflows/monitoring-alerting.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoring-alerting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-alerting:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KUBECONFIG: /dev/null
      ALERTMANAGER_VERSION: 0.34.0
      PROMETHEUS_VERSION: 3.14.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Provision pinned Python 3.12 (SHA256-verified, relocatable)
        run: |
          bin="$(bash tools/provision-python.sh 3.12 "$RUNNER_TEMP/python")"
          echo "$bin" >> "$GITHUB_PATH"
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: python -m pip install PyYAML==6.0.2
      - name: Offline Python and source contracts (dummy data only)
        run: |
          python3 -B -m unittest discover -s deploy/monitoring/tests -p 'test_*.py' -v
          python3 -B deploy/monitoring/render-values.py --check
      - name: Download pinned upstream tools and verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/a1-monitoring-tools"
          mkdir -p "$tools_dir/alertmanager" "$tools_dir/prometheus"
          for project in alertmanager prometheus; do
            if [ "$project" = alertmanager ]; then version="$ALERTMANAGER_VERSION"; else version="$PROMETHEUS_VERSION"; fi
            package="$project-$version.linux-amd64"
            release="https://github.com/prometheus/$project/releases/download/v$version"
            curl --fail --silent --show-error --location --retry 3 "$release/$package.tar.gz" -o "$tools_dir/$project/$package.tar.gz"
            curl --fail --silent --show-error --location --retry 3 "$release/sha256sums.txt" -o "$tools_dir/$project/sha256sums.txt"
            (cd "$tools_dir/$project" && sha256sum --check --ignore-missing sha256sums.txt)
            if [ "$project" = alertmanager ]; then
              tar -xzf "$tools_dir/$project/$package.tar.gz" -C "$tools_dir/$project" --strip-components=1 "$package/amtool" "$package/alertmanager"
            else
              tar -xzf "$tools_dir/$project/$package.tar.gz" -C "$tools_dir/$project" --strip-components=1 "$package/promtool"
            fi
          done
      - name: Render only the opt-in overlay with chart 88.5.3 (no cluster)
        shell: bash
        run: |
          set -euo pipefail
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm template kube-prom-stack prometheus-community/kube-prometheus-stack --version 88.5.3 \
            --namespace monitoring --kube-version 1.36.0 \
            -f deploy/monitoring/kube-prom-stack/values-alerting.yaml > "$RUNNER_TEMP/a1-helm-render.yaml"
      - name: Pinned schema, rules, templates, routing and isolated inhibition
        shell: bash
        run: |
          set -euo pipefail
          python3 -B deploy/monitoring/tests/check-tools.py \
            --amtool "$RUNNER_TEMP/a1-monitoring-tools/alertmanager/amtool" \
            --alertmanager "$RUNNER_TEMP/a1-monitoring-tools/alertmanager/alertmanager" \
            --promtool "$RUNNER_TEMP/a1-monitoring-tools/prometheus/promtool" \
            --helm-render "$RUNNER_TEMP/a1-helm-render.yaml"
