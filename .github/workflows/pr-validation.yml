name: PR source validation

on:
  # The base can be main OR another feature branch. No paths filter: the stable
  # aggregate check must be emitted for every revision, including draft/fork PRs.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: python -m pip install PyYAML==6.0.2
      - name: Current chart consistency and render
        run: |
          diff -u phorvex/config/crd/bases/phorvex.ai_phorvexpolicies.yaml phorvex/charts/phorvex/crds/phorvex.ai_phorvexpolicies.yaml
          bash tools/check-vendored-chart.sh
          helm template phorvex deploy/helm/phorvex-stack -n phorvex-system -f deploy/helm/phorvex-stack/values.yaml -f deploy/helm/phorvex-stack/values-eks.yaml --api-versions monitoring.coreos.com/v1/PodMonitor --include-crds > /dev/null
          python tools/check-claim-language.py
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python -m unittest discover -s deploy/detectors/adapter-inventory -p 'test_*.py' -v

  go-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # This job tests candidate source, never an existing cluster. Local-API and
      # controller-manager-backed tests skip here BY DESIGN; the
      # separate required go-envtest job below executes them against local
      # kube-apiserver/etcd binaries and fails if any of them skips.
      KUBECONFIG: /dev/null
      KUBEBUILDER_ASSETS: ''
      USE_EXISTING_CLUSTER: 'false'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          # The HIGHEST `go` directive of the modules this job tests. phorvex and
          # build/metricvalidity declare 1.26.1, build/test-harness declares
          # 1.26.3, and the job pins GOTOOLCHAIN=local — so installing the
          # phorvex version would make the harness step fail outright with
          # "go.mod requires go >= 1.26.3". One toolchain that satisfies all
          # three is simpler than per-step toolchain juggling, and avoids a
          # network toolchain download that `local` exists to prevent.
          go-version-file: build/test-harness/go.mod
          cache-dependency-path: |
            phorvex/go.sum
            build/phoenix-extended/go.sum
            build/falco-integrator-extended/go.sum
            build/prometheus-integrator-extended/go.sum
            build/metricvalidity/go.sum
            build/test-harness/go.sum
      # auditguard tests evaluate CEL from actual Helm renders, never a mocked verdict.
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Phorvex unit tests (not live E2E or envtest)
        run: go -C phorvex test -mod=readonly -count=1 -timeout=15m ./...

      # build/metricvalidity and build/test-harness are SEPARATE modules, so the
      # phorvex run above compiles them as dependencies without ever executing
      # their tests. That left the measurement-validity contract — the rules that
      # decide what counts as a measurement — and the harness that produces the
      # metric stream with no test coverage on a PR at all. Both are candidate
      # source, and neither touches a cluster: the shared module is stdlib-only,
      # and the harness suite runs against fake clients under the same
      # KUBECONFIG=/dev/null, USE_EXISTING_CLUSTER=false environment as above.
      - name: Shared measurement-validity contract unit tests (stdlib only, no cluster)
        run: go -C build/metricvalidity test -mod=readonly -count=1 -timeout=5m ./...
      - name: Attack-harness unit tests (fake clients, not live E2E or envtest)
        run: go -C build/test-harness test -mod=readonly -count=1 -timeout=15m ./...

      # The extended Phoenix operator and the two detector integrators are ALSO
      # separate modules (phorvex and the integrators `replace` phoenix locally).
      # Compiling them as a dependency executes none of their tests, so until now
      # a PR could break the Phoenix CR controllers or an integrator's event
      # translation without any check running. These are unit suites with fake
      # clients and local fixtures: no live webhook, no grants, no image build.
      # The Phoenix controller package's Ginkgo envtest suite declares zero
      # specs, so its BeforeSuite never starts an API server here.
      - name: Extended Phoenix operator module unit tests (fake clients, no cluster)
        run: go -C build/phoenix-extended test -mod=readonly -count=1 -timeout=15m ./...
      - name: Falco integrator module unit tests (fake clients, no live webhook)
        run: go -C build/falco-integrator-extended test -mod=readonly -count=1 -timeout=10m ./...
      - name: Prometheus integrator module unit tests (fake clients, no live webhook)
        run: go -C build/prometheus-integrator-extended test -mod=readonly -count=1 -timeout=10m ./...

  # Local API/controller proof. tools/envtest_gate.py runs the COMPLETE test suites of
  # API, actuator, runner, authz, startupauthz, console and cmd packages (no -run filter)
  # with local kube-apiserver/etcd/controller-manager binaries, so every
  # envtest-backed test in those
  # packages executes whatever helper performs its setup, and requires at least
  # the named M1/M52/M168 controls plus the original eight: actuator preconditions,
  # conditional detach, quarantine lifecycle/RBAC, restricted-role authorization,
  # coverage readback, leader handoff and the real event sink, against genuine API
  # semantics (admission, RBAC, conflicts, owner references and ReplicaSet controller behavior).
  # Every observed test/subtest must run and
  # pass; any skip fails, so every prerequisite those packages need (envtest
  # assets, ReplicaSet controller and helm for chart tests) is provisioned here.
  # They are NOT a cluster: this has no kubelet, CNI, garbage collector, cloud API or AI serving
  # backend, and nothing here mitigates a physical attack. Everything else in
  # go-unit is a unit test with mocks.
  go-envtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Isolated local control plane only. The job downloads pinned binaries
      # and must never attach to an existing cluster or fall back to a blank
      # assets path (the gate refuses to run without KUBEBUILDER_ASSETS).
      KUBECONFIG: /dev/null
      USE_EXISTING_CLUSTER: 'false'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          # Same highest-module selection as go-unit (1.26.3, GOTOOLCHAIN=local).
          go-version-file: build/test-harness/go.mod
          cache-dependency-path: |
            phorvex/go.sum
            build/phoenix-extended/go.sum
            build/metricvalidity/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The actuator package's chart tests render the real Helm chart and skip
      # without helm; a skip fails the gate, so the same pinned Helm as go-unit.
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      # envtest-v1.34.0 linux-amd64 from kubernetes-sigs/controller-tools, matching
      # k8s.io/api v0.34.0. The script pins URL and SHA256, verifies the digest
      # before extraction and proves `kube-apiserver --version` is v1.34.0.
      - name: Provision pinned envtest v1.34.0 binaries (SHA256-verified)
        run: |
          assets="$(bash tools/provision-envtest.sh "$RUNNER_TEMP/envtest")"
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"
      # The ReplicaSet controller controls real replacement behavior in M52/M66.
      # Pin the official v1.34.0 binary independently and expose its exact path;
      # the gate refuses an absent/non-executable value before starting Go.
      - name: Provision pinned kube-controller-manager v1.34.0 (SHA256-verified)
        run: |
          controller_manager="$(bash tools/provision-kube-controller-manager.sh "$RUNNER_TEMP/kubernetes")"
          echo "KUBE_CONTROLLER_MANAGER=$controller_manager" >> "$GITHUB_ENV"
      # go test -json is started directly by the gate (no shell pipe, exit
      # preserved); the verbatim stream is retained and the verdict is computed
      # from it. Skipped, missing, failed, malformed or empty output fails.
      - name: Local API/controller test packages (seven complete suites; required controls)
        run: python3 tools/envtest_gate.py run --raw-output envtest-evidence/go-test.jsonl --summary envtest-evidence/summary.json --timeout 10m
      - name: Retain raw envtest JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envtest-evidence
          path: envtest-evidence/
          if-no-files-found: error
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: dashboard-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json
      - run: npm ci
      - run: npx --no-install tsc --noEmit --incremental false
      - run: npm run build

  pr-validation:
    name: PR validation
    if: always()
    needs: [charts, go-unit, go-envtest, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every source check to succeed
        env:
          CHARTS: ${{ needs.charts.result }}
          GO_UNIT: ${{ needs.go-unit.result }}
          GO_ENVTEST: ${{ needs.go-envtest.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          test "$CHARTS" = success
          test "$GO_UNIT" = success
          test "$GO_ENVTEST" = success
          test "$FRONTEND" = success
