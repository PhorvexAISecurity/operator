name: PR source validation

on:
  # The base can be main OR another feature branch. No paths filter: the stable
  # aggregate check must be emitted for every revision, including draft/fork PRs.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: python -m pip install PyYAML==6.0.2
      - name: Current chart consistency and render
        run: |
          diff -u phorvex/config/crd/bases/phorvex.ai_phorvexpolicies.yaml phorvex/charts/phorvex/crds/phorvex.ai_phorvexpolicies.yaml
          bash tools/check-vendored-chart.sh
          helm template phorvex deploy/helm/phorvex-stack -n phorvex-system -f deploy/helm/phorvex-stack/values.yaml -f deploy/helm/phorvex-stack/values-eks.yaml --include-crds > /dev/null
          python tools/check-claim-language.py
      - run: python -m unittest discover -s tools -p 'test_*.py' -v

  go-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # This job tests candidate source, never an existing cluster. Optional
      # API-server integration tests explicitly skip without local envtest assets.
      KUBECONFIG: /dev/null
      KUBEBUILDER_ASSETS: ''
      USE_EXISTING_CLUSTER: 'false'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          # The HIGHEST `go` directive of the modules this job tests. phorvex and
          # build/metricvalidity declare 1.26.1, build/test-harness declares
          # 1.26.3, and the job pins GOTOOLCHAIN=local — so installing the
          # phorvex version would make the harness step fail outright with
          # "go.mod requires go >= 1.26.3". One toolchain that satisfies all
          # three is simpler than per-step toolchain juggling, and avoids a
          # network toolchain download that `local` exists to prevent.
          go-version-file: build/test-harness/go.mod
          cache-dependency-path: |
            phorvex/go.sum
            build/phoenix-extended/go.sum
            build/test-harness/go.sum
      # auditguard tests evaluate CEL from actual Helm renders, never a mocked verdict.
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Phorvex unit tests (not live E2E or envtest)
        run: go -C phorvex test -mod=readonly -count=1 -timeout=15m ./...

      # build/metricvalidity and build/test-harness are SEPARATE modules, so the
      # phorvex run above compiles them as dependencies without ever executing
      # their tests. That left the measurement-validity contract — the rules that
      # decide what counts as a measurement — and the harness that produces the
      # metric stream with no test coverage on a PR at all. Both are candidate
      # source, and neither touches a cluster: the shared module is stdlib-only,
      # and the harness suite runs against fake clients under the same
      # KUBECONFIG=/dev/null, USE_EXISTING_CLUSTER=false environment as above.
      - name: Shared measurement-validity contract unit tests (stdlib only, no cluster)
        run: go -C build/metricvalidity test -mod=readonly -count=1 -timeout=5m ./...
      - name: Attack-harness unit tests (fake clients, not live E2E or envtest)
        run: go -C build/test-harness test -mod=readonly -count=1 -timeout=15m ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: dashboard-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json
      - run: npm ci
      - run: npx --no-install tsc --noEmit --incremental false
      - run: npm run build

  pr-validation:
    name: PR validation
    if: always()
    needs: [charts, go-unit, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every source check to succeed
        env:
          CHARTS: ${{ needs.charts.result }}
          GO_UNIT: ${{ needs.go-unit.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          test "$CHARTS" = success
          test "$GO_UNIT" = success
          test "$FRONTEND" = success
