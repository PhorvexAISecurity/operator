name: Release
# ADR-0001: each service is released on its own (docs/services/releasing.md).
#
# On every push to main the release PR (branch release/next) is brought up to date:
# the next version and changelog of each service a merged change affects. Merging
# that PR publishes those releases: each image is built from the merge commit,
# pushed to ECR and tagged <service>-v<version>, and staging is pinned to its digest
# by a commit to main, which Argo CD syncs.
#
# The only workflow here that writes: tools/test_pr_validation.py holds it to
# exactly this shape. AWS is reached only from the publish job, through GitHub
# OIDC and the role in the repository variable PHORVEX_RELEASE_ROLE_ARN, inside the
# `release` environment.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  AWS_REGION: us-east-2
  ENVIRONMENT: staging

jobs:
  pending:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      releases: ${{ steps.pending.outputs.releases }}
      source: ${{ steps.pending.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: build/test-harness/go.mod
          cache: false
      - name: Persist and validate the prepared batch source
        id: pending
        run: |
          set -euo pipefail
          # The current-main helper may locate only the minimal schema/source
          # pointer. Component authority begins with the helper built at source.
          go -C phorvex build -o "$RUNNER_TEMP/bootstrap-servicerelease" ./tools/servicerelease
          source="$("$RUNNER_TEMP/bootstrap-servicerelease" bootstrap-source)"
          record_head="$(git rev-parse HEAD)"
          if git show "$source:phorvex/tools/servicerelease/batch.go" 2>/dev/null | grep -F 'batchSchema = 2' >/dev/null; then
            git switch --detach "$source"
            tools/verify-git-build-identity.sh "$source" > /dev/null
            go -C phorvex build -o "$RUNNER_TEMP/pinned-servicerelease" ./tools/servicerelease
            git switch --force-create release-record "$record_head"
            tool="$RUNNER_TEMP/pinned-servicerelease"
            "$tool" batch --environment "$ENVIRONMENT" >/dev/null
          else
            # One historical, already-complete six-tag release predates batch.go.
            # This command refuses missing/partial/mixed tags or pins and cannot
            # produce pending work, so current-main metadata never builds/pushes.
            tool="$RUNNER_TEMP/bootstrap-servicerelease"
            if [ ! -e release/batch.json ]; then
              "$tool" import-terminal-batch --environment "$ENVIRONMENT" >/dev/null
            fi
          fi
          if [ -n "$(git status --porcelain -- release/batch.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add release/batch.json
            git commit -m "release: pin batch source ${source:0:12}"
            if ! git push origin HEAD:main; then
              # A concurrent creator may win only with the byte-identical batch.
              git fetch --tags --force origin main
              git show FETCH_HEAD:release/batch.json > "$RUNNER_TEMP/remote-batch.json"
              cmp release/batch.json "$RUNNER_TEMP/remote-batch.json"
              git switch --force-create release-record FETCH_HEAD
            fi
          fi
          source="$("$tool" batch-source)"
          "$tool" pending --json | tee "$RUNNER_TEMP/pending.json"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "releases=$(jq 'length' "$RUNNER_TEMP/pending.json")" >> "$GITHUB_OUTPUT"

  publish:
    needs: pending
    if: needs.pending.outputs.releases != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    env:
      BATCH_SOURCE_SHA: ${{ needs.pending.outputs.source }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: build/test-harness/go.mod
          cache: false
      - name: Load the record and checkout its exact clean source
        run: |
          set -euo pipefail
          go -C phorvex build -o "$RUNNER_TEMP/bootstrap-servicerelease" ./tools/servicerelease
          [ "$("$RUNNER_TEMP/bootstrap-servicerelease" bootstrap-source)" = "$BATCH_SOURCE_SHA" ]
          git switch --detach "$BATCH_SOURCE_SHA"
          tools/verify-git-build-identity.sh "$BATCH_SOURCE_SHA" > /dev/null
          go -C phorvex build -o "$RUNNER_TEMP/pinned-servicerelease" ./tools/servicerelease
          git fetch --tags --force origin main
          git switch --force-create release-record origin/main
          git rev-parse HEAD > "$RUNNER_TEMP/record-head"
          tool="$RUNNER_TEMP/pinned-servicerelease"
          [ "$("$tool" batch-source)" = "$BATCH_SOURCE_SHA" ]
          "$tool" pending --json > "$RUNNER_TEMP/pending.json"
          git switch --detach "$BATCH_SOURCE_SHA"
      - name: Rebuild each fixture twice and compare complete OCI identities
        run: python3 tools/verify_fixture_reproducibility.py --source-date-epoch 0
      - name: Require the release role
        env:
          ROLE: ${{ vars.PHORVEX_RELEASE_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "$ROLE" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]] || { echo "::error::set the repository variable PHORVEX_RELEASE_ROLE_ARN"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.PHORVEX_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        id: ecr
      - name: Build, push, tag and pin each release
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          while IFS= read -r release; do
            component="$(jq -er '.component' <<< "$release")"
            service="$(jq -er '.identity.service' <<< "$release")"
            command="$(jq -er '.identity.command' <<< "$release")"
            source="$(jq -er '.source' <<< "$release")"
            version="$(jq -er '.version' <<< "$release")"
            dockerfile="$(jq -er '.build.dockerfile' <<< "$release")"
            context="$(jq -er '.build.context' <<< "$release")"
            target="$(jq -er '.build.target' <<< "$release")"
            registry="$(jq -er '.image.registry' <<< "$release")"
            repository="$(jq -er '.image.repository' <<< "$release")"
            tag="$(jq -er '.image.tag' <<< "$release")"
            git_tag="$(jq -er '.record.gitTag' <<< "$release")"
            [ "$source" = "$BATCH_SOURCE_SHA" ]
            [ "$version" = "$tag" ]
            [ "$registry" = "$REGISTRY" ]
            image="$registry/$repository:$tag"
            docker_args=()
            while IFS= read -r arg; do docker_args+=(--build-arg "$arg"); done < <(jq -er '.build.args[]' <<< "$release")
            [ -z "$target" ] || docker_args+=(--target "$target")
            docker build --file "$dockerfile" "${docker_args[@]}" --tag "$image" "$context" < /dev/null
            python3 tools/verify_service_image_identity.py --image "$image" --service "$service" --entrypoint "$command" --git-sha "$source" --version "$version"
            docker push "$image" < /dev/null
            registry_id="${registry%%.*}"
            [[ "$registry_id" =~ ^[0-9]{12}$ ]]
            digest=''
            for attempt in 1 2 3 4 5 6; do
              if digest="$(aws ecr describe-images --registry-id "$registry_id" --repository-name "$repository" \
                --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null)" \
                && [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                break
              fi
              digest=''
              sleep 5
            done
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker pull "$image" < /dev/null
            python3 tools/verify_service_image_identity.py --image "$image" --service "$service" --entrypoint "$command" \
              --git-sha "$source" --version "$version" --expected-repository "$registry/$repository" \
              --expected-tag "$tag" --expected-digest "$digest"
            docker image rm "$image"
            printf '%s\t%s\t%s\t%s\t%s\n' "$component" "$version" "$registry/$repository" "$digest" "$git_tag" >> "$RUNNER_TEMP/released"
          done < <(jq -c '.[]' "$RUNNER_TEMP/pending.json")
      - name: Record the releases
        if: always()
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/released" ] || exit 0
          tool="$RUNNER_TEMP/pinned-servicerelease"
          git switch --force-create release-record "$(cat "$RUNNER_TEMP/record-head")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          refs=()
          while IFS=$'\t' read -r component version repository digest git_tag; do
            git tag "$git_tag" "$BATCH_SOURCE_SHA"
            "$tool" record --environment "$ENVIRONMENT" --component "$component" --repository "$repository" \
              --tag "$version" --digest "$digest" --source "$BATCH_SOURCE_SHA"
            refs+=("refs/tags/$git_tag")
          done < "$RUNNER_TEMP/released"
          git add release/batch.json deploy/environments
          git commit -m "deploy($ENVIRONMENT): $(cut -f1,2 "$RUNNER_TEMP/released" | tr '\t' ' ' | paste -sd, | sed 's/,/, /g')"
          pushed=false
          for attempt in 1 2 3; do
            if git push --atomic origin HEAD:main "${refs[@]}"; then pushed=true; break; fi
            git fetch --tags --force origin main
            git rebase origin/main
            "$tool" pending --json > /dev/null
          done
          [ "$pushed" = true ]

  release-pr:
    needs: [pending, publish]
    if: always() && needs.pending.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.publish.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # To start CI on the release PR, which GitHub does not do for its token's pushes.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: build/test-harness/go.mod
          cache: false
      - name: Bring the release PR up to date
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # From main as the publish job left it: its tags and the staging pins.
          git fetch --tags --force origin main
          git switch --force-create release/next FETCH_HEAD
          # Current main can locate the pointer, but only the source-built helper
          # may decide whether a nonterminal batch still has component work.
          go -C phorvex build -o "$RUNNER_TEMP/bootstrap-servicerelease" ./tools/servicerelease
          source="$("$RUNNER_TEMP/bootstrap-servicerelease" bootstrap-source)"
          record_head="$(git rev-parse HEAD)"
          batch_tool="$RUNNER_TEMP/bootstrap-servicerelease"
          if git show "$source:phorvex/tools/servicerelease/batch.go" 2>/dev/null | grep -F 'batchSchema = 2' >/dev/null; then
            git switch --detach "$source"
            tools/verify-git-build-identity.sh "$source" > /dev/null
            go -C phorvex build -o "$RUNNER_TEMP/pinned-servicerelease" ./tools/servicerelease
            git switch --force-create release/next "$record_head"
            batch_tool="$RUNNER_TEMP/pinned-servicerelease"
          fi
          # A newer merge of the release PR is still to publish; its own run brings
          # the PR up to date afterwards. Preparing now would release it again.
          if [ "$("$batch_tool" pending --json | jq 'length')" -ne 0 ]; then
            echo "A merged release is still to publish; its run brings the release PR up to date." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The prior batch is terminal, so the current-main helper may plan the
          # next release. A built binary preserves prepare's distinct exit 3.
          go -C phorvex build -o "$RUNNER_TEMP/servicerelease" ./tools/servicerelease
          tool="$RUNNER_TEMP/servicerelease"
          status=0
          "$tool" prepare --title-file "$RUNNER_TEMP/title" --body-file "$RUNNER_TEMP/body.md" || status=$?
          if [ "$status" -eq 3 ]; then
            "$tool" close-pull-request --head release/next --base main | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$status" -eq 0 ]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release
          git commit -F "$RUNNER_TEMP/title"
          git push --force origin release/next
          "$tool" pull-request --head release/next --base main \
            --title-file "$RUNNER_TEMP/title" --body-file "$RUNNER_TEMP/body.md" | tee -a "$GITHUB_STEP_SUMMARY"
          "$tool" dispatch --ref release/next --workflows pr-validation.yml,e2e-contract.yml,native-rbac.yml
