name: Native RBAC contract
on:
  pull_request:
  push:
    branches: [main]
  # Started by the release workflow on the release PR (see pr-validation.yml).
  workflow_dispatch: {}
concurrency:
  group: >-
    native-rbac-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || format('{0}-{1}-{2}', github.event_name, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: phorvex/go.mod
          cache-dependency-path: phorvex/go.sum
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: ./tools/check-native-rbac.sh
