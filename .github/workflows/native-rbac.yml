name: Native RBAC contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: phorvex/go.mod
          cache-dependency-path: phorvex/go.sum
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: ./tools/check-native-rbac.sh
