name: Verify published LiteLLM gateway runtime reuse

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: litellm-gateway-runtime-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      AWS_REGION: us-east-2
      IMAGE: 753556437180.dkr.ecr.us-east-2.amazonaws.com/phorvex@sha256:91cd4812dcb808d0498ddd0f7f768d64c34e86d05229cec25250abdd1402db32
      EXPECTED_SOURCE_SHA: 4bf046ce690c280da4b4f0f613ac52d2b4511285454f18c25b2e144b574d5cc1
    steps:
      - name: Require reviewed main
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify source, pinned recipe and local protocol
        run: |
          set -euo pipefail
          test "$(sha256sum build/test-harness/fixtures/litellm-live/gateway.py | cut -d' ' -f1)" = "$EXPECTED_SOURCE_SHA"
          python3 build/integrations/litellm-gateway-runtime/verify_reuse.py
          python3 -m unittest discover -s build/test-harness/fixtures/litellm-live -p 'test_*gateway.py' -v
          python3 -m unittest -v build/integrations/litellm-gateway-runtime/test_entrypoint.py
          test "$(git status --porcelain --untracked-files=no)" = ''

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Read exact published image and verify nonroot source-free identity
        run: |
          set -euo pipefail
          available_kib="$(df -Pk . | awk 'NR==2 {print $4}')"
          [[ "$available_kib" =~ ^[0-9]+$ ]]
          test "$available_kib" -ge $((15 * 1024 * 1024))
          docker buildx imagetools inspect "$IMAGE" | grep -Eq '^Digest:[[:space:]]+sha256:91cd4812dcb808d0498ddd0f7f768d64c34e86d05229cec25250abdd1402db32$'
          docker pull --platform linux/amd64 "$IMAGE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/amd64
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = 10001:10001

      - name: Run actual image with read-only mounted gateway source and local-only protocol
        run: |
          set -euo pipefail
          common=(--rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges
            --pids-limit 128 --memory 512m --cpus 2 --user 10001:10001
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,uid=10001,gid=10001
            --mount "type=bind,source=$PWD/build,target=/workspace/build,readonly"
            --entrypoint python3)
          docker run "${common[@]}" "$IMAGE" -B -m unittest discover \
            -s /workspace/build/test-harness/fixtures/litellm-live -p 'test_*gateway.py' -v
          docker run "${common[@]}" "$IMAGE" -B -m unittest -v \
            /workspace/build/integrations/litellm-gateway-runtime/test_entrypoint.py

      - name: Record immutable image and source verification
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          contract_path = Path('build/integrations/litellm-gateway-runtime/image-contract.json')
          contract = json.loads(contract_path.read_text())
          if contract['imageByDigest'] != os.environ['IMAGE'] or contract['gatewaySourceSHA256'] != os.environ['EXPECTED_SOURCE_SHA']:
              raise SystemExit('published image/source identity changed before receipt')
          receipt = {'schema': 'phorvex-litellm-gateway-runtime-reuse-receipt-v1',
                     'sourceCommit': os.environ['SOURCE_SHA'], 'githubRunID': os.environ['RUN_ID'],
                     'githubRunAttempt': os.environ['RUN_ATTEMPT'],
                     'imageByDigest': os.environ['IMAGE'],
                     'gatewaySourceSHA256': os.environ['EXPECTED_SOURCE_SHA'],
                     'contractSHA256': hashlib.sha256(contract_path.read_bytes()).hexdigest(),
                     'publishedProxyReceiptSHA256': contract['publishedReceiptSHA256'],
                     'result': 'pass-local-and-published-image-protocol'}
          Path('litellm-gateway-runtime-reuse-receipt.json').write_text(json.dumps(receipt, sort_keys=True, separators=(',', ':')) + '\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: litellm-gateway-runtime-reuse-${{ github.sha }}
          path: litellm-gateway-runtime-reuse-receipt.json
          if-no-files-found: error
