name: Benchmark dashboard
on:
  pull_request:
    paths: ['benchmark/**', '.github/workflows/benchmark-dashboard.yml']
  push:
    branches: [main]
    paths: ['benchmark/**', '.github/workflows/benchmark-dashboard.yml']
concurrency:
  group: >-
    benchmark-dashboard-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || format('{0}-{1}-{2}', github.event_name, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: |
            benchmark/apps/api/package-lock.json
            benchmark/apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r benchmark/worker/requirements.txt
      - run: npm --prefix benchmark run install:apps
      - run: npm --prefix benchmark run test:api
      - run: npm --prefix benchmark run typecheck
      - run: npm --prefix benchmark run build
      - run: python -m unittest discover -s benchmark/worker -p 'test_*.py'
