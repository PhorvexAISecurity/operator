name: Benchmark dashboard
on:
  pull_request:
    paths: ['benchmark/**', '.github/workflows/benchmark-dashboard.yml']
  push:
    branches: [main]
    paths: ['benchmark/**', '.github/workflows/benchmark-dashboard.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: |
            benchmark/apps/api/package-lock.json
            benchmark/apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r benchmark/worker/requirements.txt
      - run: npm --prefix benchmark run install:apps
      - run: npm --prefix benchmark run test:api
      - run: npm --prefix benchmark run typecheck
      - run: npm --prefix benchmark run build
      - run: python -m unittest discover -s benchmark/worker -p 'test_*.py'
