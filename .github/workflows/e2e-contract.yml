name: E2E harness contracts

on:
  # No base-branch filter: stacked PRs must also validate their own harness/config.
  pull_request:
  push:
    branches: [main]
  # Started by the release workflow on the release PR (see pr-validation.yml).
  workflow_dispatch: {}

concurrency:
  group: >-
    e2e-contract-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || format('{0}-{1}-{2}', github.event_name, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e-contract:
    # These are isolated regression tests, not a live-cluster E2E verdict.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Evidence tests resolve reviewed release commits through git history.
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: build/test-harness/go.mod
          cache-dependency-path: build/test-harness/go.sum
      - name: Provision pinned Python 3.12 (SHA256-verified, relocatable)
        run: |
          bin="$(bash tools/provision-python.sh 3.12 "$RUNNER_TEMP/python")"
          echo "$bin" >> "$GITHUB_PATH"
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install test dependencies
        run: python -m pip install PyYAML==6.0.2 -r tools/benchmark-test-requirements.txt
      - name: Harness regressions and production-law mapping
        run: python -m unittest discover -s End-to-End/pipeline -p 'test_*.py' -v
      - name: Chart isolation, detector permissions and workflow regressions
        run: python -m unittest discover -s tools -p 'test_*.py' -v
