# GP13 — serving cost-harvest load-abuse target.
# Ported from phvx-actuator-costharvest-20261019. Scoped to a dedicated staging namespace.
#
# Attack: authorized-but-abusive load harvests serving compute through the admission
# proxy. Actuator it should trigger: throttle — apply a cap while the load is active and
# release it when traffic goes quiet.
#
# The real harness fronts this target with a `cost-admission` proxy sidecar and drives two
# reference clients (one abusive, one legitimate) so the serving-rate budget observes the
# load; here the Service points at the target directly for a self-contained shape.
#
# STAGING WIRING: add `phorvex-staging-cost` to policyNamespaces/actuatorNamespaces.
# PREREQS (operator-refactored): throttle is not in the action vocabulary (model.Action +
# the PhorvexPolicy CRD actions enum) and the trusted cost-load observer (serving-rate
# budget) is not wired. The intended defense policy is in defense-policy.prereq.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: phorvex-staging-cost
  labels:
    phorvex.ai/environment: staging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-target
  namespace: phorvex-staging-cost
  labels: {app: cost-target}
spec:
  replicas: 1
  selector: {matchLabels: {app: cost-target}}
  template:
    metadata: {labels: {app: cost-target}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: svc
        image: docker.io/hashicorp/http-echo:1.0.0
        args: ["-text=ok", "-listen=:8080"]
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata: {name: cost-target, namespace: phorvex-staging-cost}
spec:
  selector: {app: cost-target}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: cost-target, namespace: phorvex-staging-cost}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: cost-target}
  minReplicas: 1
  maxReplicas: 5
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}}]
