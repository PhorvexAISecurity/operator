  - "ai2-agent-excessive-agency"
  - "ai2-agent-injection-to-persistence"
  - "ai2-agent-memory-contamination"
  - "ai2-agent-rogue-tool-persistence"
  - "ai2-data-model-poisoning"
  - "ai2-embedding-store-tampering"
  - "ai2-embedding-vector-weakness"
  - "ai2-excessive-agency"
  - "ai2-malicious-model-artifact"
  - "ai2-mcp-rogue-server"
