context: "kind-amtd-test"
namespace: "amtd-ai-test"
ownedAck: true
trialsPerArm: 20
masterSeed: 1337
phoenixSrcDir: "../phoenix-extended"
outDir: "out-ai-bench"
scenarioFilter:
