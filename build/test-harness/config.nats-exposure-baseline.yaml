# Server-owned, no-signal synthetic NATS configuration baseline.
# Installation must replace every placeholder value with reviewed current source
# and image pins before the named console suite is authorized for launch.
# The console alone replaces nonce, runID and outDir for each run.
kubeconfig: ""
context: "__SET_LOGICAL_CLUSTER_TARGET__"
namespace: "phorvex-nats-exposure-fixture"
ownedAck: true
trialsPerArm: 1
masterSeed: 1337
outDir: "out-nats-exposure-baseline"
defenderFilter: [d-nomtd]
scenarioFilter: [c2-nats-uncredentialed-exposure]
natsExposureFixture:
  runID: run-1
  nonce: "000000000000000000000000"
  transport: in-cluster
  clusterUID: "__SET_REVIEWED_KUBE_SYSTEM_UID__"
  configSHA256: "__SET_REVIEWED_NATS_CONFIG_SHA256__"
  nodeName: "__SET_REVIEWED_HEALTHY_NODE_NAME__"
  observerImage: "__SET_INSTALLED_CONSOLE_IMAGE_DIGEST__"
  brokerImageID: "__SET_REVIEWED_NATS_IMAGE_ID_DIGEST__"
  brokerVersion: "2.10.29"
  maxRunSeconds: 600
