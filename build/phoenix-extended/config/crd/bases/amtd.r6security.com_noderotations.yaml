---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: noderotations.amtd.r6security.com
spec:
  group: amtd.r6security.com
  names:
    kind: NodeRotation
    listKind: NodeRotationList
    plural: noderotations
    shortNames:
    - nrot
    singular: noderotation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.sourceNode
      name: Source
      type: string
    - jsonPath: .status.targetCleanNode
      name: CleanNode
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          NodeRotation is the Schema for the noderotations API (cap#7, D25g/D26).
          CLUSTER-scoped; models a restart-safe in-flight node drain; class-(B) continuation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NodeRotationSpec is the desired state of a single in-flight node rotation
              (arch §2.4 item 2, §3 cap#7). It is created by a matched NodeRotate action
              (post-D26-gate) and reconciled to completion by the NodeRotationReconciler.
            properties:
              drainPolicy:
                description: |-
                  DrainPolicy opts into Eviction-API co-tenant draining (PDB-honoring). nil =>
                  relocate the targeted pod only, no co-tenant drain (D25g3). REUSES the existing
                  DrainPolicy type.
                properties:
                  drainCoTenants:
                    description: |-
                      DrainCoTenants opts into Eviction-API draining of co-resident pods
                      (PDB-honoring). Default false.
                    type: boolean
                  gracePeriodSeconds:
                    description: GracePeriodSeconds is the eviction grace period;
                      nil reuses the NIM 30s grace.
                    format: int64
                    type: integer
                type: object
              maxConcurrentNodes:
                description: |-
                  MaxConcurrentNodes is the no-mass-eviction ceiling carried from the AMTD's
                  NodeRotationPolicy (D25g3). nil => unlimited (today's behavior); the reconciler
                  counts in-flight NodeRotations past Cordoning before cordoning a new source.
                type: integer
              sourceNode:
                description: |-
                  SourceNode is the node the targeted pod currently runs on (cordon/taint/delete
                  target after relocation).
                type: string
              stagger:
                description: Stagger spaces successive cordons (D25g3). nil => no
                  inter-cordon spacing.
                type: string
              strategy:
                description: |-
                  Strategy is the source-node disposition (D25g2). CODE default Cordon via
                  EffectiveStrategy() (not a CRD-default marker, mirroring the Effective*()
                  discipline). Delete additionally requires the D26 human-approval at action time.
                enum:
                - Cordon
                - Taint
                - Delete
                type: string
              targetNodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  TargetNodeSelector selects the clean-pool nodes. CODE default
                  {r6security.com/clean-pool:true} via EffectiveCleanSelector() (D25g4).
                type: object
              targetPods:
                description: |-
                  TargetPods are the in-selector targeted inference pods to relocate (D25g3/g4).
                  Default targeted-pod-only: only these are evicted unless DrainPolicy opts into
                  a co-tenant drain.
                items:
                  description: NamespacedPodRef is a namespace/name reference to a
                    pod to relocate.
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              triggerProvenance:
                description: TriggerProvenance records the authorizing event (audit
                  / D26).
                properties:
                  eventName:
                    description: EventName is the triggering SecurityEvent's name
                      (idempotence/audit).
                    type: string
                  source:
                    description: Source is the triggering SecurityEvent's Rule.Source
                      (e.g. KubeArmorIntegrator).
                    type: string
                  threatLevel:
                    description: ThreatLevel is the triggering event's Rule.ThreatLevel.
                    type: string
                type: object
            required:
            - sourceNode
            type: object
          status:
            description: |-
              NodeRotationStatus is the cap#7 observability + restart-safe progress surface.
              The durable phase ALSO lives in an annotation (the single source of truth);
              Status.Phase is the best-effort mirror.
            properties:
              completionTime:
                description: CompletionTime is when the rotation reached Completed.
                format: date-time
                type: string
              conditions:
                description: Conditions carries NodeRotationThrottled, NoCleanTarget,
                  NodeRotationRolledBack.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              evictedCoTenants:
                description: |-
                  EvictedCoTenants counts co-resident pods evicted when DrainPolicy.DrainCoTenants
                  was set (D25g3). 0 in the targeted-pod-only default.
                type: integer
              noCleanTargetReason:
                description: |-
                  NoCleanTargetReason is set when Phase==NoCleanTarget
                  (CleanPoolExhausted|PVCTopologyBound|NoMatchingGPU).
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation the Status
                  reflects.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase mirrors the durable annotation phase {Cordoning;Draining;Rescheduling;
                  Pinning;Completed;RolledBack;NoCleanTarget}.
                type: string
              relocatedPods:
                description: RelocatedPods are the pods that were relocated (pinned-recreated/evicted).
                items:
                  description: NamespacedPodRef is a namespace/name reference to a
                    pod to relocate.
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              sourceNode:
                description: SourceNode echoes Spec.SourceNode.
                type: string
              startTime:
                description: |-
                  StartTime is when the rotation started (first cordon). Node-rotation MTTR =
                  CompletionTime-StartTime is REAL-NODE/GPU-PENDING (never measured on kind).
                format: date-time
                type: string
              targetCleanNode:
                description: TargetCleanNode is the selected clean-pool node the targeted
                  pod is pinned to.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
