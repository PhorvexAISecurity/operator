---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: adaptivemovingtargetdefenses.amtd.r6security.com
spec:
  group: amtd.r6security.com
  names:
    kind: AdaptiveMovingTargetDefense
    listKind: AdaptiveMovingTargetDefenseList
    plural: adaptivemovingtargetdefenses
    singular: adaptivemovingtargetdefense
  scope: Namespaced
  versions:
  - name: v1beta1
    schema:
      openAPIV3Schema:
        description: AdaptiveMovingTargetDefense is the Schema for the adaptivemovingtargetdefenses
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AdaptiveMovingTargetDefenseSpec defines the desired state
              of AdaptiveMovingTargetDefense
            properties:
              baseline:
                description: |-
                  Baseline is the embedded (Phase 5) cap#6 signed-baseline digest-pin block
                  (D1 HYBRID, arch §2.4 item 3 / §2.4 BaselineSpec, D6/D6g). It carries
                  REFERENCES only (pinned ImageDigests[], the SignaturePolicy refs, an optional
                  PodSpecSnapshotRef + a DriftPolicy) — never trust-root secret material. Its
                  Baseline.BaselineRef may point at a standalone WorkloadBaseline that is then
                  the source of truth for the pins/SignaturePolicy. nil ⇒ no baseline drift
                  self-heal for this AMTD. A matched Regenerate action resolves its
                  RegenerateAction.BaselineRef to a WorkloadBaseline; this embedded block is the
                  in-AMTD alternative policy home (D1 precedence: a referenced CR wins).
                properties:
                  baselineRef:
                    description: |-
                      BaselineRef points the embedded block at a standalone WorkloadBaseline (by
                      name). When set on the embedded AMTDSpec.Baseline, the standalone CRD is the
                      source of truth for the pinned digests + SignaturePolicy (references only); the
                      embedded block then carries policy knobs (DriftPolicy). On a standalone
                      WorkloadBaseline this is unused.
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  driftPolicy:
                    description: DriftPolicy controls detection cadence + default
                      response (D6g (d)).
                    properties:
                      admissionEnforce:
                        description: |-
                          AdmissionEnforce gates whether the baselineAdmission webhook denies
                          unsigned/unverifiable/un-pinned images (fail-CLOSED) for this baseline. Code
                          default TRUE via EffectiveAdmissionEnforce() (D6g). nil => true.
                        type: boolean
                      detectInterval:
                        description: |-
                          DetectInterval is the OPTIONAL periodic re-verify/re-detect poll period. nil/0
                          => poll disabled (off by default, D6g); detection then rides admission + Falco
                          drift events. When set, the reconciler requeues after this interval.
                        type: string
                      onDrift:
                        description: |-
                          OnDrift is the DEFAULT response preference (Regenerate|Quarantine|AlertOnly|
                          Block). Code default Quarantine via EffectiveOnDrift() (D6g: auto-Regenerate is
                          restart-loop-DoS-weaponizable). The actual action is still a Strategy[] rule.
                        enum:
                        - Regenerate
                        - Quarantine
                        - AlertOnly
                        - Block
                        type: string
                      resetHardeningProfile:
                        description: |-
                          ResetHardeningProfile bounds a Regenerate's hardening reset
                          (PodProfileOnly|IncludeRBAC). Code default PodProfileOnly via
                          EffectiveResetHardeningProfile() (D6g (e)).
                        enum:
                        - PodProfileOnly
                        - IncludeRBAC
                        type: string
                    type: object
                  imageDigests:
                    description: ImageDigests is the per-container pinned golden Repository@Digest
                      set (D6g (a)).
                    items:
                      description: |-
                        ImageDigest pins one container's golden image to an immutable Repository@Digest
                        (D6g (a)). It is a REFERENCE into the external signed registry; no image bytes
                        or key material are stored.
                      properties:
                        containerName:
                          description: |-
                            ContainerName is the container the pin applies to (matches the running pod's
                            container name and the owner template).
                          type: string
                        digest:
                          description: |-
                            Digest is the pinned content digest (e.g. sha256:abc...). The golden reference
                            is Repository@Digest. The drift surface compares the running image digest to
                            this (D6 digest+allowlist surface, NOT full PodSpec).
                          type: string
                        repository:
                          description: Repository is the immutable image repository
                            (e.g. nvcr.io/nim/secure-nim).
                          type: string
                        signature:
                          description: |-
                            Signature is the detached signature over the Digest the kind key-based verifier
                            checks against the SignaturePolicy PublicKeyRef. Faithful to cosign key-based
                            (a signature over the image digest), but carried inline on the pin so kind can
                            verify WITHOUT a registry/Rekor. Base64-encoded (std encoding). Empty => the
                            image is unsigned (RequireSignature rejects it).
                          type: string
                      required:
                      - containerName
                      - digest
                      - repository
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  podSpecSnapshotRef:
                    description: |-
                      PodSpecSnapshotRef references a Phoenix-owned PodSpec snapshot (e.g. a ConfigMap)
                      used to restore curated non-image fields (D6g (b)). Reference only; the kind
                      restorer restores the pinned image (the primary golden state).
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  signature:
                    description: |-
                      Signature is the verification policy (cosign key-based default, D6). nil => no
                      signature enforcement (digest-allowlist-only; the DigestUnpinnedWarning/benignity
                      caveats still apply).
                    properties:
                      keylessIdentity:
                        description: KeylessIdentity reserves the cosign keyless (OIDC)
                          production seam (see type).
                        properties:
                          issuer:
                            description: Issuer is the expected OIDC issuer (e.g.
                              https://token.actions.githubusercontent.com).
                            type: string
                          subjectRegexp:
                            description: SubjectRegexp is the expected certificate-identity
                              SAN regexp.
                            type: string
                        type: object
                      publicKeyRef:
                        description: |-
                          PublicKeyRef references the verification public key (Secret/ConfigMap/inline
                          PEM). nil + RequireSignature=true => verification is UNAVAILABLE (the kind
                          verifier cannot key-verify without a key) and the baseline is treated
                          fail-to-cached-last-good with a VerificationUnavailable condition.
                        properties:
                          configMapRef:
                            description: |-
                              ConfigMapRef names a ConfigMap (namespace/name) whose Key entry holds the PEM
                              public key.
                            properties:
                              key:
                                description: Key is the data key holding the PEM (default
                                  "cosign.pub").
                                type: string
                              name:
                                type: string
                              namespace:
                                type: string
                            required:
                            - name
                            type: object
                          inlinePEM:
                            description: |-
                              InlinePEM is a PEM-encoded public key carried inline. This is a PUBLIC key
                              (verification only), so inlining it does NOT embed trust-root secret material;
                              it is the offline/air-gapped/test-friendly form. Takes precedence when set.
                            type: string
                          secretRef:
                            description: |-
                              SecretRef names a Secret (namespace/name) whose Key entry holds the PEM
                              public key. Namespace empty => the operator namespace at resolve time.
                            properties:
                              key:
                                description: Key is the data key holding the PEM (default
                                  "cosign.pub").
                                type: string
                              name:
                                type: string
                              namespace:
                                type: string
                            required:
                            - name
                            type: object
                        type: object
                      rekorURL:
                        description: |-
                          RekorURL is the transparency-log URL for keyless/online verification
                          (production extension; the kind key-based path does not contact Rekor).
                        type: string
                      requireSignature:
                        description: |-
                          RequireSignature, when true, REJECTS an unsigned/unverifiable image (admission
                          fail-CLOSED; verify-before-recreate refuses). Code default TRUE via
                          EffectiveRequireSignature() (D6). nil => true.
                        type: boolean
                    type: object
                type: object
              inferenceRotation:
                description: |-
                  InferenceRotation is the embedded (Phase 1) rotation mutation overlay +
                  rotation/adaptive policy block (D1 HYBRID, arch §2.4). nil ⇒ today's
                  behavior (a Rotate degrades to a pure cold reschedule). It is the policy
                  surface that RotateAction.PolicyRef resolves to.
                properties:
                  adaptiveRotation:
                    description: |-
                      AdaptiveRotation carries the crash-loop failure ceiling
                      (MaxFailedRotations). Phase 1 uses only MaxFailedRotations.
                    properties:
                      consecutiveHighSamples:
                        description: |-
                          ConsecutiveHighSamples is N: a panic requires Status.ConsecutiveHighCount >= N
                          (D22 anti-flap; a single spike does NOT panic). nil defaults to 3 in code
                          (effectiveConsecutiveHighSamples). (Phase 3.)
                        type: integer
                      ewmaAlpha:
                        description: |-
                          EWMAAlpha is the EWMA smoothing factor in (0,1] for
                          SmoothedScore = alpha*score + (1-alpha)*prevSmoothed (D22 anti-flap). A larger
                          alpha tracks the raw score faster (less smoothing). nil defaults to "0.3" in
                          code (effectiveEWMAAlpha). (Phase 3.)
                        type: string
                      maxFailedRotations:
                        description: |-
                          MaxFailedRotations is the crash-loop backoff/rollback threshold: when
                          Status.FailedRotationCount exceeds it, BackoffUntil is set (exponential) and
                          the rotation rolls back to LastKnownGoodRef. nil defaults to 3 in code
                          (effectiveMaxFailedRotations). (Phase 1.)
                        type: integer
                      panicThreshold:
                        description: |-
                          PanicThreshold is the decimal-string score in [0,1] at/above which the
                          SmoothedScore is treated as a panic candidate: when SmoothedScore >=
                          PanicThreshold AND ConsecutiveHighCount >= ConsecutiveHighSamples the executor
                          PANICS, bypassing ONLY the G3 min-interval floor (NEVER readiness / backoff /
                          max-concurrent — D25/arch L330 LOCKED). nil defaults to "0.85" in code
                          (effectivePanicThreshold), a FLAGGED proposal — never a paper value. (Phase 3.)
                        type: string
                      scoringPolicy:
                        description: |-
                          ScoringPolicy optionally selects the opt-in WeightedScorer over Spec.Metrics.
                          nil => the default PassthroughScorer (consumes Spec.AnomalyScore as-is, no
                          invented math; D20). There are NO default weights: the scorer is INERT unless
                          ScoringPolicy is set with a non-empty Weights map (the illustrative {0.5,0.3,
                          0.2} weights never ship). (Phase 3.)
                        properties:
                          normalization:
                            description: |-
                              Normalization is one of minmax|zscore|clamp (D20). Empty defaults to clamp
                              (clamp the weighted sum into [0,1]). (Phase 3.)
                            enum:
                            - minmax
                            - zscore
                            - clamp
                            type: string
                          weights:
                            additionalProperties:
                              type: string
                            description: |-
                              Weights maps a Spec.Metrics key to its decimal-string weight. REQUIRED if
                              ScoringPolicy is used (there is no default): an empty/nil map => inert.
                            type: object
                        type: object
                      stalenessWindow:
                        description: |-
                          StalenessWindow decays a score to 0 once the SecurityEvent age exceeds it
                          (D25/D26g): a stale score neither accelerates nor suppresses rotation. nil (or
                          0) defaults to DISABLED in code (effectiveStalenessWindow), i.e. no staleness
                          decay — today's behavior. (Phase 3.)
                        type: string
                    type: object
                  containerName:
                    description: |-
                      ContainerName selects the target container for the image/env/gpu overlay.
                      Empty selects the first (or only) container. (Phase 1.)
                    type: string
                  envPatch:
                    description: |-
                      EnvPatch sets/overwrites environment variables on the target container by
                      Name (e.g. RUNTIME_MODE=SECURE). (Phase 1.)
                    items:
                      description: EnvVar represents an environment variable present
                        in a Container.
                      properties:
                        name:
                          description: |-
                            Name of the environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        value:
                          description: |-
                            Variable references $(VAR_NAME) are expanded
                            using the previously defined environment variables in the container and
                            any service environment variables. If a variable cannot be resolved,
                            the reference in the input string will be unchanged. Double $$ are reduced
                            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                            Escaped references will never be expanded, regardless of whether the variable
                            exists or not.
                            Defaults to "".
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: The key to select.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: |-
                                Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: |-
                                FileKeyRef selects a key of the env file.
                                Requires the EnvFiles feature gate to be enabled.
                              properties:
                                key:
                                  description: |-
                                    The key within the env file. An invalid key will prevent the pod from starting.
                                    The keys defined within a source may consist of any printable ASCII characters except '='.
                                    During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                  type: string
                                optional:
                                  default: false
                                  description: |-
                                    Specify whether the file or its key must be defined. If the file or key
                                    does not exist, then the env var is not published.
                                    If optional is set to true and the specified key does not exist,
                                    the environment variable will not be set in the Pod's containers.

                                    If optional is set to false and the specified key does not exist,
                                    an error will be returned during Pod creation.
                                  type: boolean
                                path:
                                  description: |-
                                    The path within the volume from which to select the file.
                                    Must be relative and may not contain the '..' path or start with '..'.
                                  type: string
                                volumeName:
                                  description: The name of the volume mount containing
                                    the env file.
                                  type: string
                              required:
                              - key
                              - path
                              - volumeName
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              description: |-
                                Selects a resource of the container: only resources limits and requests
                                (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                              properties:
                                containerName:
                                  description: 'Container name: required for volumes,
                                    optional for env vars'
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Specifies the output format of the
                                    exposed resources, defaults to "1"
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  description: 'Required: resource to select'
                                  type: string
                              required:
                              - resource
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              description: Selects a key of a secret in the pod's
                                namespace
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  goldenImage:
                    description: |-
                      GoldenImage is the image digest/ref to rotate the target container to
                      (verbatim values trace ADA Listing 1, e.g. nvcr.io/nim/secure-nim:latest).
                      (Phase 1.)
                    type: string
                  gpuResource:
                    description: |-
                      GPUResource is the nvidia.com/gpu limit quantity as a string ("0" =
                      DropToZero quarantine). The resource name is fixed to nvidia.com/gpu in
                      Phase 1 (GPUShufflePolicy.ResourceName override is Phase 3). (Phase 1.)
                    type: string
                  rotationPolicy:
                    description: |-
                      RotationPolicy carries the cadence FLOOR (MinInterval) and the
                      concurrency cap. Phase 1 uses only MinInterval (and declares
                      MaxConcurrentRotations; enforcement is Phase 2).
                    properties:
                      baseInterval:
                        description: |-
                          BaseInterval is the cadence PERIOD R (the mean rotation interval the single
                          cadence owner emits on, D9). nil defaults to 60m in code
                          (effectiveBaseInterval, the AMTD-AI §3.2 verbatim default), keeping nil ==
                          today's behavior without a CRD-default round-trip. A HARD FLOOR of 5m (D9, a
                          flagged design proposal) is enforced in effectiveBaseInterval: a sub-5m value
                          is clamped UP to 5m and a BaseIntervalFloored Status condition is recorded
                          (availability-safe clamp + honest/observable condition). The 5m floor is NOT a
                          CEL rule because metav1.Duration serializes as a Go duration string (not a
                          number) and is not portably comparable in CEL. (Phase 2.)
                        type: string
                      entropySource:
                        description: |-
                          EntropySource selects the RNG backing the jitter draw (D13). "Crypto" (the
                          default; crypto/rand, unforgeable cadence) or "PseudoRandom" (seeded math/rand,
                          permitted only for test determinism — selecting it on a live AMTD records an
                          EntropyWarning Status condition because a leaked PRNG seed makes every future
                          rotation forecastable). Empty defaults to Crypto in code. Enum is declared on
                          the EntropySource type. (Phase 2.)
                        enum:
                        - Crypto
                        - PseudoRandom
                        type: string
                      jitterDistribution:
                        description: |-
                          JitterDistribution selects the shape used to draw the jitter magnitude within
                          the band (D12g). "Uniform" (the default; max Shannon entropy over the bounded
                          band) or "TruncatedNormal" (an honestly-flagged lower-entropy opt-in,
                          mean=(min+max)/2, stddev=(max-min)/4, resampled until in-band). Empty defaults
                          to Uniform in code. Enum is declared on the JitterDistribution type. (Phase 2.)
                        enum:
                        - Uniform
                        - TruncatedNormal
                        type: string
                      jitterMaxPercent:
                        description: |-
                          JitterMaxPercent is the UPPER endpoint of the symmetric +/- jitter band as a
                          percentage of BaseInterval (D10). nil defaults to 30 in code (the paper band
                          upper endpoint). It bounds the maximum instance lifetime to
                          BaseInterval*(1+JitterMaxPercent/100) (the exposure-window upper bound).
                          (Phase 2.)
                        type: integer
                      jitterMinPercent:
                        description: |-
                          JitterMinPercent is the LOWER endpoint of the symmetric +/- jitter band as a
                          percentage of BaseInterval (D10, the paper "10-30%" band). nil defaults to 10
                          in code. Per cycle the scheduler draws a magnitude m in
                          [JitterMinPercent,JitterMaxPercent]/100 and a symmetric sign, so the effective
                          interval = BaseInterval*(1 +/- m). JitterMin==JitterMax==0 (or both nil)
                          reproduces today's deterministic cadence bit-for-bit. Apiserver-validated
                          bounds: 0<=JitterMinPercent<=JitterMaxPercent<=100 (CEL rule on the struct).
                          (Phase 2.)
                        type: integer
                      maxConcurrentRotations:
                        description: |-
                          MaxConcurrentRotations bounds concurrent rotations under this AMTD; nil means
                          unlimited (today's behavior). DECLARED in Phase 1; ENFORCED in Phase 2: the
                          Rotate executor counts pods carrying the in-progress annotation for this
                          AMTD's PodSelector and DEFERS (skip + RotationThrottled condition) a rotation
                          that would exceed the cap (D24). (Phase 2.)
                        type: integer
                      minInterval:
                        description: |-
                          MinInterval is the anti-flap FLOOR: a rotation is skipped if it would fire
                          sooner than MinInterval after Status.LastRotationTime. nil defaults to 60s
                          in code (effectiveMinInterval), keeping nil == today's behavior and
                          avoiding a CRD-default round-trip. (Phase 1.) This is the storm guard, NOT
                          the cadence period (see BaseInterval).
                        type: string
                      staggerMode:
                        description: |-
                          StaggerMode selects the per-key de-sync layered on top of the crypto jitter
                          (D14). "PerPodPhaseOffset" (the default; a deterministic per-key phase offset =
                          hash(seed||key) mod BaseInterval that de-syncs the fleet and is restart-safe
                          from the persisted seed), "Independent" (jitter only, no fixed offset), or
                          "None" (no offset). Empty defaults to PerPodPhaseOffset in code. The hard
                          availability cap is the separate MaxConcurrentRotations budget (D24), not the
                          stagger. Enum is declared on the StaggerMode type. (Phase 2.)
                        enum:
                        - PerPodPhaseOffset
                        - Independent
                        - None
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: jitter bounds must satisfy 0<=jitterMinPercent<=jitterMaxPercent<=100
                      rule: '!has(self.jitterMinPercent) || !has(self.jitterMaxPercent)
                        || (self.jitterMinPercent >= 0 && self.jitterMaxPercent <=
                        100 && self.jitterMinPercent <= self.jitterMaxPercent)'
                type: object
              matcherMode:
                default: Exact
                description: |-
                  MatcherMode gates the relaxed (scored) matcher. In "Exact" (the default) any
                  Rule.Match / Rule.ScoreThreshold clause is IGNORED — preserving today's exact
                  {Type,ThreatLevel,Source} behavior byte-for-byte — and a MatcherModeWarning
                  Status condition warns that scored clauses are inert. In "Scored" the matcher
                  additionally evaluates Match / ScoreThreshold against the SecurityEvent spec.
                  Enum (Exact;Scored) is declared on the MatcherMode type.
                enum:
                - Exact
                - Scored
                type: string
              nodeRotateTrust:
                description: |-
                  NodeRotateTrust is the per-AMTD D26 trust gate for the NodeRotate action (the
                  cluster-DoS lever): a trusted-Source allowlist + a ThreatLevel floor +
                  human-approval-for-Delete. nil ⇒ the code defaults apply (allowlist
                  {KubeArmorIntegrator,FalcoIntegrator}; floor {high,critical}; Delete needs
                  approval) — the gate is ALWAYS on, never silently bypassed (D26).
                properties:
                  allowDeleteWithoutApproval:
                    description: |-
                      AllowDeleteWithoutApproval, when true, is the explicit admin opt-in that lets
                      Strategy=Delete (irreversible node termination) proceed (D26 (c)). Default false
                      => Delete requires the per-event approval annotation. This is the human-approval
                      gate; absent approval, Delete is denied (NOT auto-degraded).
                    type: boolean
                  allowedSources:
                    description: |-
                      AllowedSources is the trusted-Source allowlist (D26 (a)). Empty => the code
                      default {KubeArmorIntegrator,FalcoIntegrator}.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  threatLevelFloor:
                    description: |-
                      ThreatLevelFloor is the set of at/above-floor ThreatLevels (D26 (b)). Empty =>
                      the code default {high,critical}.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              nodeRotationPolicy:
                description: |-
                  NodeRotationPolicy is the embedded (Phase 6) cap#7 SCHEDULED node-rotation
                  cadence block (arch §2.4, D25g). DEFAULT-OFF: nil ⇒ panic/event-driven node
                  rotation only (no scheduled cadence), because node rotation is far costlier than
                  pod rotation. Per Rule #1 it is NOT a hidden timer — it only tunes cadence; the
                  scheduled rotation is still a {Type:'timed',Source:'TimeBasedTrigger'} event
                  matched to a NodeRotate action. It also carries the MaxConcurrentNodes+Stagger
                  no-mass-eviction ceiling the NodeRotationReconciler honors.
                properties:
                  enabled:
                    description: |-
                      Enabled gates the scheduled node-rotation cadence. false (the default) =>
                      panic/event-driven only.
                    type: boolean
                  interval:
                    description: |-
                      Interval is the scheduled node-rotation period (inherits the D9 cadence floor
                      via the single time-based-trigger owner). nil => no scheduled cadence.
                    type: string
                  jitter:
                    description: Jitter is the +/- band applied to Interval (D10).
                    type: string
                  maxConcurrentNodes:
                    description: |-
                      MaxConcurrentNodes is the HARD no-mass-eviction ceiling: never cordon/drain more
