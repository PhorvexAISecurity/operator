---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: securityevents.amtd.r6security.com
spec:
  group: amtd.r6security.com
  names:
    kind: SecurityEvent
    listKind: SecurityEventList
    plural: securityevents
    singular: securityevent
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targets[*]
      name: Target
      type: string
    - jsonPath: .spec.rule.source
      name: Source
      type: string
    - jsonPath: .spec.rule.type
      name: Type
      type: string
    - jsonPath: .spec.rule.threatLevel
      name: Level
      type: string
    - jsonPath: .spec.description
      name: Description
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: SecurityEvent is the Schema for the securityevents API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SecurityEventSpec defines the desired state of SecurityEvent
            properties:
              anomalyScore:
                description: |-
                  AnomalyScore is a decimal string in [0,1] (e.g. "0.85"); cap #5. It lives on
                  the SPEC (NOT on Rule) so Rule stays a pure match key and the exact matcher
                  fast path is preserved. nil means unscored = today's behavior. It is
                  authoritative only because this CR is cluster-scoped and RBAC-gated to
                  trusted integrator ServiceAccounts (D26g).
                type: string
              description:
                description: Description of the security threat
                type: string
              evidence:
                description: 'Evidence carries drift evidence (observed vs expected
                  digest + detail); cap #6.'
                properties:
                  detail:
                    type: string
                  expectedDigest:
                    type: string
                  observedDigest:
                    type: string
                type: object
              metrics:
                additionalProperties:
                  type: string
                description: |-
                  Metrics carries the raw component signals (GPU entropy / query deviation /
                  cache misses) for in-operator recompute/audit. Read by the scored matcher as
                  metrics.<k>.
                type: object
              rule:
                properties:
                  match:
                    description: |-
                      Match is a set of computed-score / metric predicates (matcher-side ONLY).
                      Emitters never set this on events. Evaluated only when Spec.MatcherMode=Scored;
                      nil (together with a nil ScoreThreshold) selects the exact fast path that is
                      outcome-identical to today's reflect.DeepEqual.
                    items:
                      description: |-
                        MatchExpression is a single predicate evaluated against a SecurityEvent spec
                        in the scored matcher path. Field selects the projected value; numeric ops
                        parse the value as a decimal.
                      properties:
                        field:
                          description: 'Field is the projected value: ''type''|''threatLevel''|''source''|''anomalyScore''|''metrics.<k>''.'
                          type: string
                        op:
                          description: Op is the comparison operator.
                          enum:
                          - Eq
                          - NotEq
                          - In
                          - NotIn
                          - Gte
                          - Gt
                          - Lte
                          - Lt
                          - Exists
                          type: string
                        value:
                          description: |-
                            Value is a scalar or comma-separated list; numeric ops (Gte/Gt/Lte/Lt) parse
                            it as a decimal. Ignored by the Exists op.
                          type: string
                      required:
                      - field
                      - op
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  scoreThreshold:
                    description: |-
                      ScoreThreshold is sugar for a single Match{Field:"anomalyScore",Op:"Gte",Value:X}
                      clause (decimal string in [0,1]). Matcher-side ONLY; evaluated only when
                      Spec.MatcherMode=Scored.
                    type: string
                  source:
                    description: Source field value of the SecurityEvent that arrives
                    type: string
                  threatLevel:
                    description: ThreatLevel field value of the SecurityEvent that
                      arrives
                    type: string
                  type:
                    description: Type field value of the SecurityEvent that arrives
                    type: string
                type: object
              targets:
                description: Targets contains the list of affected pods, each item
                  in the form of "namespace/name" or "/name"
                items:
                  type: string
                type: array
            required:
            - description
            - rule
            - targets
            type: object
          status:
            description: |-
              SecurityEventStatus is the per-event OUTCOME on the trigger object. The
              subresource is already enabled. All fields are optional.
            properties:
              appliedAction:
                description: AppliedAction is the matched action that fired (e.g.
                  delete|rotate|quarantine).
                type: string
              computedInterval:
                type: string
              observedScore:
                description: ObservedScore is the decimal-string anomaly score at
                  processing time.
                type: string
              processedAt:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
