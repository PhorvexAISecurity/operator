                      enum:
                      - ContainerImageUpdate
                      - ResourceAdjustment
                      - EnvPatch
                      type: string
                  required:
                  - type
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              selector:
                description: |-
                  Selector matches the pods this policy targets (ADA Listing 1 selector.matchLabels,
                  e.g. {app: nim-inference}). nil selects nothing (the reconciler records 0 pods).
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              triggers:
                description: Triggers declares the telemetry sources that drive this
                  policy's mutations.
                properties:
                  telemetrySources:
                    description: TelemetrySources is the list of telemetry signals
                      that drive this policy.
                    items:
                      description: |-
                        TelemetrySource is one trigger leg of a ContextMutationPolicy (ADA Listing 1
                        triggers.telemetrySources[]). It declares the telemetry signal whose arrival
                        (as a routed SecurityEvent) should drive the mutation set.
                      properties:
                        constraint:
                          description: |-
                            Constraint is the GatekeeperViolation constraint name (e.g.
                            "disallowed-hostpath"). It is the value a FUTURE gatekeeper emitter would encode
                            in SecurityEvent.Spec.Metrics["gatekeeper.constraint"] (see the receiver
                            convention). Meaningless for a PrometheusAlert.
                          type: string
                        name:
                          description: |-
                            Name is the alert/signal name (e.g. "high_gpu_usage" for a PrometheusAlert). It
                            is the key the prometheus-integrator surfaces in SecurityEvent.Spec.Metrics.
                          type: string
                        type:
                          description: Type is the telemetry-source kind (PrometheusAlert
                            | GatekeeperViolation).
                          enum:
                          - PrometheusAlert
                          - GatekeeperViolation
                          type: string
                      required:
                      - type
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
            type: object
          status:
            description: ContextMutationPolicyStatus is the thin reconciler's observability
              surface.
            properties:
              conditions:
                description: Conditions carries the advisory conditions, notably GatekeeperViolationUnsupported.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation the Status
                  reflects.
                format: int64
                type: integer
              resolvedMutationSummary:
                description: |-
                  ResolvedMutationSummary is a one-line summary of the projected mutation set
                  (e.g. "image=nvcr.io/nim/secure-nim:latest; gpu=0; env=RUNTIME_MODE"), computed
                  with the SAME projection the MutationApplier uses, plus any not-applied note.
                type: string
              selectedPodCount:
                description: SelectedPodCount is the number of pods currently matched
                  by Spec.Selector.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
