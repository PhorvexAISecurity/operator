# Dedicated measured-study fixture. Apply only after reviewing the stage scope.
# Cleanup: delete this file's four namespaced resources after stopping observation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stage-bench-api
  namespace: phorvex-staging-demo
  labels: {app.kubernetes.io/part-of: stage-brain-benchmark}
spec:
  replicas: 3
  selector:
    matchLabels: {app.kubernetes.io/name: stage-bench-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stage-bench-api
        data-class: public
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: web
        image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
        ports: [{name: http, containerPort: 8080}]
        readinessProbe:
          httpGet: {path: /, port: http}
          initialDelaySeconds: 1
          periodSeconds: 2
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {memory: 96Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 16Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: stage-bench-api
  namespace: phorvex-staging-demo
  labels: {app.kubernetes.io/part-of: stage-brain-benchmark}
spec:
  selector: {app.kubernetes.io/name: stage-bench-api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stage-bench-api
  namespace: phorvex-staging-demo
  labels: {app.kubernetes.io/part-of: stage-brain-benchmark}
spec:
  minAvailable: 2
  selector:
    matchLabels: {app.kubernetes.io/name: stage-bench-api}
---
apiVersion: phorvex.ai/v1alpha1
kind: PhorvexPolicy
metadata:
  name: stage-bench-defense
  namespace: phorvex-staging-demo
  labels: {app.kubernetes.io/part-of: stage-brain-benchmark}
spec:
  tenant: stage-brain-benchmark
  selector:
    matchLabels: {app.kubernetes.io/name: stage-bench-api}
  mode: dryRun
  actions: {enabled: [rotate]}
  budget:
    maxMovesPerTick: 1
    tickInterval: 5s
    proactiveFloor: 60s
    antiOverRotationWindow: 30s
    maxGracePeriodSeconds: 30
  objective:
    lambda: "0"
    disruptionAversion: "1"
    costWeights: {flowDisruption: "0.6", normSparsity: "0.4"}
  slo: {costCeiling: "1.2", minAvailableReplicas: 2}
  assetValue:
    weightSecrets: "0.8"
    blastRadiusFromGraph: true
    fromLabels:
      data-class: {public: "0.1", internal: "0.4", restricted: "1.0"}
  triggers:
    eventDriven: true
    eventAgeHorizon: 1h
    reactiveOnly: false
