# Source: phorvex/templates/rbac.yaml
# LEAST-PRIVILEGE ClusterRole (NFR4): read-only ingest of the K8s graph; write ONLY
# Phorvex's own CRDs + Phoenix SecurityEvent/AMTD + policy warning Events. NEVER writes pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codeexec-phorvex-manager-role
  labels:
    app.kubernetes.io/name: phorvex
    app.kubernetes.io/instance: codeexec
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
rules:
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations"]
  verbs: ["get", "list"]
- apiGroups: ["admissionregistration.k8s.io"]
  # M-6 runtime capability check: GET-by-resourceName ONLY of the two named code-exec admission
  # objects, so the operator can VERIFY (never modify) that its own deny-policy is in force before
  # it offers or dispatches an ephemeral-container injection. Read-only, scoped to exactly these two
  # object names; no list/watch (informer), no create/update/delete. This is NOT an injection grant.
  resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
  resourceNames: ["phorvex-codeexec-ephemeral"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods", "namespaces", "nodes", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "clusterroles", "rolebindings", "clusterrolebindings"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["authorization.k8s.io"]
  # T1-E capability gate: the operator reviews its OWN permissions (SelfSubjectAccessReview,
  # "can I?") before offering an action, so an unpermitted move is excluded pre-scoring
  # (no-rbac) instead of ranked and failing at actuation. Creating a SelfSubjectAccessReview
  # grants no cluster power — it only asks the apiserver what this ServiceAccount may already do.
  resources: ["selfsubjectaccessreviews"]
  verbs: ["create"]
- apiGroups: ["amtd.r6security.com"]
  resources: ["securityevents"]
  verbs: ["get", "list", "watch", "create"]
- apiGroups: ["amtd.r6security.com"]
  resources: ["adaptivemovingtargetdefenses"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["phorvex.ai"]
  resources: ["phorvexpolicies"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["phorvex.ai"]
  resources: ["phorvexpolicies/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["phorvex.ai"]
  resources: ["phorvexpolicies/finalizers"]
  verbs: ["update"]
