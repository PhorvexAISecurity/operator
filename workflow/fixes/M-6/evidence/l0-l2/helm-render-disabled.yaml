# Source: phorvex/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeexec-phorvex
  namespace: default
  labels:
    app.kubernetes.io/name: phorvex
    app.kubernetes.io/instance: codeexec
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: phorvex
      app.kubernetes.io/instance: codeexec
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phorvex
        app.kubernetes.io/instance: codeexec
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: phorvex
    spec:
      serviceAccountName: codeexec-phorvex-manager
      securityContext:
        runAsNonRoot: true
        # Both containers run as non-root with different images; fsGroup makes the mounted
        # audit volume group-writable and lets the manager read its 0440 webhook key.
        fsGroup: 65532
      containers:
      - name: manager
        image: "phorvex/phorvex:0.1.0-p0"
        imagePullPolicy: IfNotPresent
        args:
        - --base-interval=10s
        - --actions-supported-debounce=3
        - --calibration-shadow=true
        - --calibration-sample=5m
        - --calibration-refresh=30m
        - --calibration-lookback=168h
        - --calibration-export-dir=/var/run/phorvex-calibration
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        - --leader-elect=true
        - --admission-webhook=true
        - --webhook-port=9443
        - --webhook-cert-dir=/tmp/k8s-webhook-server/serving-certs
        - --gpu-envelope-max=0.2925
        - --pcie-class-table={"Tesla T4":{"gen":3,"width":16}}
        - --trusted-detectors=vllm/detector-kv-canary,vllm/detector-adapter-inv,phorvex-system/operator-controller-manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PHORVEX_BRAIN_IMAGE
          value: "phorvex/phorvex:0.1.0-p0"
        ports:
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        - name: webhook-server
          containerPort: 9443
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - name: calibration-evidence
          mountPath: /var/run/phorvex-calibration
        - name: webhook-cert
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      volumes:
      - name: calibration-evidence
        emptyDir: {}
      - name: webhook-cert
        secret:
          secretName: codeexec-phorvex-webhook-cert
          defaultMode: 0440
---
# Source: phorvex/templates/admission-webhook.yaml
# M-94: bind every SecurityEvent to the identity that created it. The authenticated user is
# known only to the API server, so the stamp has to happen at admission; ingest then allowlists
# that identity instead of the self-declared spec.rule.source.
#
# failurePolicy is Ignore ON PURPOSE: Phorvex must never be able to block the cluster's
# security-event flow. An unstamped event is untrusted at ingest, so the failure direction is
# closed on the belief side rather than on the API server.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: codeexec-phorvex-securityevent-stamp
  labels:
    app.kubernetes.io/name: phorvex
    app.kubernetes.io/instance: codeexec
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
webhooks:
- name: stamp-securityevent.phorvex.ai
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Ignore
  matchPolicy: Equivalent
  reinvocationPolicy: IfNeeded
  timeoutSeconds: 5
  clientConfig:
    caBundle: ""
    service:
      name: codeexec-phorvex-webhook
      namespace: default
      port: 443
      path: /stamp-amtd-r6security-com-v1beta1-securityevent
  rules:
  - apiGroups: ["amtd.r6security.com"]
    apiVersions: ["v1beta1"]
    operations: ["CREATE", "UPDATE"]
    resources: ["securityevents"]
    scope: Cluster
---
# Source: phorvex/templates/admission-webhook.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: codeexec-phorvex-protected-outcomes-stamp
  labels:
    app.kubernetes.io/name: phorvex
    app.kubernetes.io/instance: codeexec
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
webhooks:
# M99 outcome-bearing events must never preserve a forged stamp on webhook failure.
# The general M94 event-flow hook above retains its existing availability policy.
- name: stamp-protected-outcomes.phorvex.ai
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Fail
  matchPolicy: Equivalent
  reinvocationPolicy: IfNeeded
  timeoutSeconds: 5
  matchConditions:
  - name: protected-outcomes
    expression: "has(object.metadata.annotations) && 'phorvex.ai/protected-outcomes-v1' in object.metadata.annotations"
  clientConfig:
    caBundle: ""
    service:
      name: codeexec-phorvex-webhook
      namespace: default
      port: 443
      path: /stamp-amtd-r6security-com-v1beta1-securityevent
  rules:
  - apiGroups: ["amtd.r6security.com"]
    apiVersions: ["v1beta1"]
    operations: ["CREATE", "UPDATE"]
    resources: ["securityevents"]
    scope: Cluster
---
