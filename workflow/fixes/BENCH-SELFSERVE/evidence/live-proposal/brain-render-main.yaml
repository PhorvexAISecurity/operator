apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: staging-brain
  namespace: phorvex-staging
  labels:
    app.kubernetes.io/name: phorvex-brain
    app.kubernetes.io/instance: staging
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
    app.kubernetes.io/component: brain
    app.kubernetes.io/version: 0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: phorvex-brain
      app.kubernetes.io/instance: staging
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: phorvex-staging
      podSelector:
        matchLabels:
          app.kubernetes.io/component: manager
          app.kubernetes.io/name: phorvex
    ports:
    - port: grpc
  - ports:
    - port: health
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: metrics
  egress: []
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: staging-brain
  namespace: phorvex-staging
  labels:
    app.kubernetes.io/name: phorvex-brain
    app.kubernetes.io/instance: staging
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
    app.kubernetes.io/component: brain
    app.kubernetes.io/version: 0.1.0
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: staging-brain
  namespace: phorvex-staging
  labels:
    app.kubernetes.io/name: phorvex-brain
    app.kubernetes.io/instance: staging
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
    app.kubernetes.io/component: brain
    app.kubernetes.io/version: 0.1.0
spec:
  selector:
    app.kubernetes.io/name: phorvex-brain
    app.kubernetes.io/instance: staging
  ports:
  - name: grpc
    port: 9090
    targetPort: grpc
  - name: metrics
    port: 8080
    targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-brain
  namespace: phorvex-staging
  labels:
    app.kubernetes.io/name: phorvex-brain
    app.kubernetes.io/instance: staging
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
    app.kubernetes.io/component: brain
    app.kubernetes.io/version: 0.1.0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: phorvex-brain
      app.kubernetes.io/instance: staging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phorvex-brain
        app.kubernetes.io/instance: staging
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: phorvex
        app.kubernetes.io/component: brain
        app.kubernetes.io/version: 0.1.0
    spec:
      serviceAccountName: staging-brain
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: brain
        image: 753556437180.dkr.ecr.us-east-2.amazonaws.com/phorvex/staging/brain:staging-0.10.0-git-61e83673b8d4f143fca67e17b8a54dc4712f9b28@sha256:ebb6d245afc52528155eee999e130972c1aa78f14f03a19b86118508acefd1bf
        imagePullPolicy: IfNotPresent
        env:
        - name: PHORVEX_BRAIN_IMAGE
          value: 753556437180.dkr.ecr.us-east-2.amazonaws.com/phorvex/staging/brain:staging-0.10.0-git-61e83673b8d4f143fca67e17b8a54dc4712f9b28@sha256:ebb6d245afc52528155eee999e130972c1aa78f14f03a19b86118508acefd1bf
        args:
        - --listen=:9090
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        - --gpu-envelope-max=0.2925
        - --shutdown-grace=20s
        - --log-level=info
        - --log-format=json
        - --grpc-tls-cert=/etc/phorvex/grpc-tls/tls.crt
        - --grpc-tls-key=/etc/phorvex/grpc-tls/tls.key
        - --grpc-tls-ca=/etc/phorvex/grpc-tls/ca.crt
        - --grpc-tls-peer=staging-dispatcher.phorvex-staging.svc
        ports:
        - name: grpc
          containerPort: 9090
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: grpc-tls
          mountPath: /etc/phorvex/grpc-tls
          readOnly: true
      volumes:
      - name: grpc-tls
        secret:
          secretName: staging-brain-grpc-tls
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: staging-brain
  namespace: phorvex-staging
  labels:
    app.kubernetes.io/name: phorvex-brain
    app.kubernetes.io/instance: staging
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
    app.kubernetes.io/component: brain
    app.kubernetes.io/version: 0.1.0
spec:
  namespaceSelector:
    matchNames:
    - phorvex-staging
  selector:
    matchLabels:
      app.kubernetes.io/name: phorvex-brain
      app.kubernetes.io/instance: staging
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    honorLabels: true
    relabelings:
    - action: replace
      sourceLabels:
      - __meta_kubernetes_pod_name
      targetLabel: instance
    - action: replace
      targetLabel: environment
      replacement: staging
    metricRelabelings:
    - action: replace
      regex: phorvex_cost_nan_unactionable_total
      replacement: phorvex_staging_cost_nan_unactionable_total
      sourceLabels:
      - __name__
      targetLabel: __name__
