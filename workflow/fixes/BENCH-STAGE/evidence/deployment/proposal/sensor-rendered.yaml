# Source: phorvex-sensor/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-sensor
  namespace: phorvex-staging
  labels:
    app.kubernetes.io/name: phorvex-sensor
    app.kubernetes.io/instance: staging
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
    app.kubernetes.io/component: sensor
    app.kubernetes.io/version: "0.1.0"
spec:
  # One sensor: the telemetry source derives rates from its own previous samples,
  # so two would each compute them over the wrong interval. Recreate never runs
  # two at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: phorvex-sensor
      app.kubernetes.io/instance: staging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phorvex-sensor
        app.kubernetes.io/instance: staging
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: phorvex
        app.kubernetes.io/component: sensor
        app.kubernetes.io/version: "0.1.0"
    spec:
      serviceAccountName: staging-sensor
      # The sensor reads the cluster with its own read-only access (rbac.yaml).
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: sensor
        image: "753556437180.dkr.ecr.us-east-2.amazonaws.com/phorvex/staging/sensor:staging-0.11.0-git-9b5a3eb0e9b1b5a033290cee1302aa6b5059cf40@sha256:39c0f3e8c8d223f7ed4daf18a33ffb794d32c35ab1827b1506705f9c546f6093"
        imagePullPolicy: IfNotPresent
        args:
        - --listen=:9090
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        - --shutdown-grace=20s
        - --log-level=info
        - --log-format=json
        - --prometheus-url=http://kube-prom-stack-kube-prome-prometheus.monitoring.svc.cluster.local:9090
        - --pcie-class-table={"Tesla T4":{"gen":3,"width":16}}
        - --policy-namespaces=phorvex-staging-demo,console-identity-shared,p6-demo
        - --trusted-detectors=phorvex-staging/staging-attacks,p6/p6-attacks
        - --persistence-observer-identity=
        - --persistence-observer-namespaces=
        - --grpc-tls-cert=/etc/phorvex/grpc-tls/tls.crt
        - --grpc-tls-key=/etc/phorvex/grpc-tls/tls.key
        - --grpc-tls-ca=/etc/phorvex/grpc-tls/ca.crt
        - --grpc-tls-peer=staging-dispatcher.phorvex-staging.svc
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PHORVEX_INJECTOR_IDENTITY
          value: "phorvex-staging/staging-attacks"
        - name: PHORVEX_EVENT_IDENTITY_POLICY
          value: "phorvex-system-phorvex-phorvex-se-creator-8acf73b8d0"
        # The identity-rotate fixture profile the observation builder reads.
        - name: PHORVEX_CONSOLE_IDENTITY_FIXTURE
          value: /etc/phorvex/identity-fixture/profile.json
        ports:
        - name: grpc
          containerPort: 9090
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: identity-fixture
          mountPath: /etc/phorvex/identity-fixture
          readOnly: true
        - name: grpc-tls
          mountPath: /etc/phorvex/grpc-tls
          readOnly: true
      volumes:
      # The identity-rotate fixture profile ConfigMap this chart renders beside the pod.
      - name: identity-fixture
        configMap:
          name: staging-sensor-identity-fixture
      - name: grpc-tls
        secret:
          secretName: staging-sensor-grpc-tls
