---
# Source: phorvex-sensor/templates/networkpolicy.yaml
# Only the manager reaches the sensor (ADR-0001). The gRPC connection is
# plaintext until mTLS, so this policy is its only access control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: staging-sensor
  namespace: phorvex-staging
  labels:
    app.kubernetes.io/name: phorvex-sensor
    app.kubernetes.io/instance: staging
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
    app.kubernetes.io/component: sensor
    app.kubernetes.io/version: "0.1.0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: phorvex-sensor
      app.kubernetes.io/instance: staging
  # Egress stays open: the sensor reads the API server and Prometheus, whose
  # addresses depend on the cluster.
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: phorvex-staging
      podSelector:
        matchLabels:
          app.kubernetes.io/component: manager
          app.kubernetes.io/name: phorvex
    ports:
    - port: grpc
  # Kubelet probes arrive from the node, outside any namespace; the health port
  # answers readiness only.
  - ports:
    - port: health
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: metrics
---
