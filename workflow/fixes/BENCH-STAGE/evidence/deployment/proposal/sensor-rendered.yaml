# Source: phorvex-sensor/templates/podmonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: staging-sensor
  namespace: phorvex-staging
  labels:
    app.kubernetes.io/name: phorvex-sensor
    app.kubernetes.io/instance: staging
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
    app.kubernetes.io/component: sensor
    app.kubernetes.io/version: "0.1.0"
spec:
  namespaceSelector:
    matchNames: ["phorvex-staging"]
  selector:
    matchLabels:
      app.kubernetes.io/name: phorvex-sensor
      app.kubernetes.io/instance: staging
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    # The services' own namespace labels (a policy's tenant) stay theirs.
    honorLabels: true
    relabelings:
    - action: replace
      sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: instance
    - action: replace
      targetLabel: environment
      replacement: "staging"
    metricRelabelings:
      - action: replace
        regex: phorvex_cost_nan_unactionable_total
        replacement: phorvex_staging_cost_nan_unactionable_total
        sourceLabels:
        - __name__
        targetLabel: __name__
