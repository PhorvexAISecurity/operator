# Source: phorvex-console/templates/console-e2e-identity.yaml
# The End-to-End pipeline's console identity (docs/CONSOLE-AUTH.md, "DevOps handoff").
# The cluster's own OIDC issuer is the bearer IdP: CI mints a short-lived projected token
# for THIS ServiceAccount with the console audience (`kubectl create token --audience`), the
# console verifies it against the issuer's public JWKS, and the grant table maps the subject
#   system:serviceaccount:phorvex-staging:staging-phorvex-console-e2e
# to exactly the tenants the pipeline attacks. The account carries no RBAC at all — its token
# is a console credential, not a Kubernetes one — and no permanent token is ever created.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: staging-phorvex-console-e2e
  namespace: phorvex-staging
  labels:
    app.kubernetes.io/name: phorvex
    app.kubernetes.io/instance: staging
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
automountServiceAccountToken: false
---
# Source: phorvex-console/templates/console-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: staging-phorvex-console
  namespace: phorvex-staging
  labels:
    app.kubernetes.io/name: phorvex
    app.kubernetes.io/instance: staging
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
    app.kubernetes.io/component: console
---
# Source: phorvex-console/templates/console-rbac.yaml
# The delete-only cleanup identity. The attacks service impersonates it (resourceName-pinned,
# above) ONLY to remove actuator-created quarantine artifacts during exact cleanup. It holds no
# create/isolate/evict grant, so it can never itself remediate; the per-lane Roles below bound it
# to delete pods / delete networkpolicies / update configmaps in each attack namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: staging-attacks-cleanup
  namespace: phorvex-staging
  labels:
    app.kubernetes.io/name: phorvex
    app.kubernetes.io/instance: staging
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
    app.kubernetes.io/component: attacks-cleanup
---
# Source: phorvex-console/templates/console-grants.yaml
# ── console subject grants (M-136) ────────────────────────────────────────────
# The console's authorization policy: which VERIFIED issuer+subject holds which role, over which
# tenants and cluster targets. This is DevOps policy, not something the console can infer.
#
# Rendering it here is a convenience for GitOps. The console never invents an entry: no binding
# means the subject is authenticated and authorized for nothing, which is the correct state until
# a human decides who the operators are. Do NOT bind a subject because an identity provider let
# them log in, because their email looks internal, or to "unblock" a demo — a wildcard tenant
# grant on the operator role is full cluster control through the console's ServiceAccount.
#
# Subjects are the Cognito user-pool `sub` (a UUID), not an email address.
apiVersion: v1
kind: ConfigMap
metadata:
  name: staging-phorvex-console-grants
  labels:
    app.kubernetes.io/name: phorvex
    app.kubernetes.io/instance: staging
    app.kubernetes.io/component: console-auth
data:
  grants.json: |
    {
      "version": 1,
      "subjects": [
        {
          "issuer": "https://cognito-idp.us-east-2.amazonaws.com/us-east-2_JfwlBPRbB",
          "subject": "71fb8550-3041-702a-5735-a33baf8836c8",
          "roles": [
            "operator"
          ],
          "tenants": [
            "p6-demo"
          ],
          "targets": [
            "default"
          ],
          "note": "The production console's operator, confined to staging's demo tenant."
        },
        {
          "issuer": "https://oidc.eks.us-east-2.amazonaws.com/id/B4E80A6F4AB1E51169435AFFDC706401",
          "subject": "system:serviceaccount:phorvex-staging:staging-phorvex-console-e2e",
          "roles": [
            "operator"
          ],
          "tenants": [
            "p6-demo"
          ],
          "targets": [
            "default"
          ],
          "note": "Staging End-to-End runs against the demo tenant; token minted per run, never stored."
        },
        {
          "issuer": "https://oidc.eks.us-east-2.amazonaws.com/id/B4E80A6F4AB1E51169435AFFDC706401",
          "subject": "system:serviceaccount:phorvex-staging:staging-brain-benchmark",
          "roles": [
            "investor"
          ],
          "tenants": [
            "phorvex-staging-demo"
          ],
          "targets": [
            "default"
          ],
          "note": "Read-only source-pinned stage brain benchmark snapshot collection."
        }
      ]
    }
