# Source: phorvex/templates/audit-pvc.yaml
# The decision audit the console streams from.
#
# ReadWriteOnce is deliberate and sufficient: the only two readers/writers are the operator
# and the console, and they run as containers in the SAME pod, so the volume is attached to
# exactly one node. Sharing it between two Deployments would have required an RWX
# filesystem (EFS) for what is a single append-only file.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: staging-phorvex-audit
  namespace: phorvex-staging
  labels:
    app.kubernetes.io/name: phorvex
    app.kubernetes.io/instance: staging
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp2-csi
  resources:
    requests:
      storage: 5Gi
---
