# Source: phorvex/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-phorvex
  namespace: phorvex-staging
  labels:
    app.kubernetes.io/name: phorvex
    app.kubernetes.io/instance: staging
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
spec:
  replicas: 1
  # A ReadWriteOnce volume can only be attached to one node at a time, so a RollingUpdate
  # would deadlock: the new pod cannot mount the PVC until the old pod releases it, and the
  # old pod is not terminated until the new one is Ready.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: phorvex
      app.kubernetes.io/instance: staging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phorvex
        app.kubernetes.io/instance: staging
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: phorvex
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: staging-phorvex-manager
      securityContext:
        runAsNonRoot: true
        # Containers run as non-root; fsGroup makes configured durable volumes
        # group-writable and lets the manager read its 0440 webhook key.
        fsGroup: 65532
        # Avoid recursively widening process-private parameter material after
        # the manager has restored it to 0700/0600 at startup.
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: manager
        image: "753556437180.dkr.ecr.us-east-2.amazonaws.com/phorvex/staging/manager:staging-0.16.0-git-9b5a3eb0e9b1b5a033290cee1302aa6b5059cf40@sha256:85dc01f3afa9448a4a41fc4a39ad928653cf49a294ae56bec8f2e38839c799a7"
        imagePullPolicy: IfNotPresent
        args:
        - --base-interval=10s
        - --actions-supported-debounce=3
        - --calibration-shadow=true
        - --calibration-sample=5m
        - --calibration-refresh=30m
        - --calibration-lookback=168h
        - --calibration-export-dir=/var/run/phorvex-calibration
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        - --leader-elect=true
        - --brain-endpoint=staging-brain:9090
        - --sensor-endpoint=staging-sensor:9090
        - --actuator-endpoint=staging-actuator:9090
        - --grpc-tls-cert=/etc/phorvex/grpc-tls/tls.crt
        - --grpc-tls-key=/etc/phorvex/grpc-tls/tls.key
        - --grpc-tls-ca=/etc/phorvex/grpc-tls/ca.crt
        - --prometheus-url=http://kube-prom-stack-kube-prome-prometheus.monitoring.svc.cluster.local:9090
        - --policy-namespaces=phorvex-staging-demo,console-identity-shared,p6-demo
        - --max-retained-quarantines-per-namespace=1
        - --serving-security-mode=secure-required
        - --gpu-envelope-max=0.2925
        - --pcie-class-table={"Tesla T4":{"gen":3,"width":16}}
        - --trusted-detectors=phorvex-staging/staging-attacks,p6/p6-attacks
        - --persistence-observer-identity=
        - --persistence-observer-namespaces=
        - --audit-json=/audit/live.jsonl
        - --audit-max-bytes=268435456
        - --audit-max-backups=4
        - --audit-source-addr=:8445
        - --audit-source-cert=/etc/audit-server/tls.crt
        - --audit-source-key=/etc/audit-server/tls.key
        - --audit-source-ca=/etc/audit-server/ca.crt
        - --audit-source-client-dns=staging-phorvex-console.phorvex-staging.svc
        - --math-lab-capture-cost-evidence=true
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PHORVEX_BRAIN_IMAGE
