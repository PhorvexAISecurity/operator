# Source: phorvex/templates/services-rules.yaml
# Alerts on this environment's services. Severity info: Prometheus and Grafana show
# them, and the cluster's Alertmanager pages no one for them.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: staging-phorvex-services
  namespace: phorvex-staging
  labels:
    app.kubernetes.io/name: phorvex
    app.kubernetes.io/instance: staging
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
spec:
  groups:
  - name: phorvex-services-staging
    rules:
    - alert: PhorvexServiceDown
      expr: max by (job, instance) (up{environment="staging"}) == 0
      for: 5m
      labels: {severity: info, environment: "staging"}
      annotations:
        summary: A Phorvex service of staging is not scraped.
    - alert: PhorvexServiceCallsFailing
      expr: >-
        sum by (grpc_service, grpc_method) (rate(phorvex_grpc_server_handled_total{environment="staging",grpc_code!="OK"}[10m]))
        / clamp_min(sum by (grpc_service, grpc_method) (rate(phorvex_grpc_server_handled_total{environment="staging"}[10m])), 1e-9) > 0.05
      for: 10m
      labels: {severity: info, environment: "staging"}
      annotations:
        summary: More than 5% of a service's gRPC calls in staging fail.
    - alert: PhorvexManagerTicksIncomplete
      expr: >-
        sum(increase(phorvex_manager_tick_duration_seconds_count{environment="staging"}[15m])) > 0
        and sum(increase(phorvex_manager_tick_duration_seconds_count{environment="staging",outcome="finished-full-snapshot"}[15m])) == 0
      for: 15m
      labels: {severity: info, environment: "staging"}
      annotations:
        summary: The staging manager ticks, but none completed with a full snapshot in 15 minutes.
    - alert: PhorvexServiceRestarting
      expr: sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace="phorvex-staging"}[15m])) > 2
      labels: {severity: info, environment: "staging"}
      annotations:
        summary: A Pod in phorvex-staging restarted more than twice in 15 minutes.
    # Stateful rotation (docs/stateful-rotation.md). The actuator never claims a
    # replacement it did not observe; these surface the dispatches that left a member
    # unproven and an owner that did not return to fully Ready. Each also counts a
    # series first exported within its window (last_over_time ... unless ... offset),
    # which increase() cannot see, including one from an actuator Pod since replaced.
    - alert: PhorvexStatefulRotationNotConfirmed
      expr: >-
        (sum by (namespace, action, outcome) (increase(phorvex_stateful_rotations_total{environment="staging",outcome=~"unconfirmed|partial|error"}[30m])) > 0)
        or (sum by (namespace, action, outcome) ((last_over_time(phorvex_stateful_rotations_total{environment="staging",outcome=~"unconfirmed|partial|error"}[30m])
        unless phorvex_stateful_rotations_total{environment="staging",outcome=~"unconfirmed|partial|error"} offset 30m) > 0) > 0)
      labels: {severity: info, environment: "staging"}
      annotations:
        summary: A stateful rotation in staging ended unconfirmed, partial or in error; check the owner's members.
    - alert: PhorvexStatefulOwnerNotRecovered
      expr: >-
        max by (namespace, statefulset) (kube_statefulset_replicas - kube_statefulset_status_replicas_ready) > 0
        and on (namespace) (
        (sum by (namespace) (increase(phorvex_stateful_rotations_total{environment="staging"}[2h])) > 0)
        or (sum by (namespace) ((last_over_time(phorvex_stateful_rotations_total{environment="staging"}[2h])
        unless phorvex_stateful_rotations_total{environment="staging"} offset 2h) > 0) > 0))
      for: 15m
      labels: {severity: info, environment: "staging"}
      annotations:
        summary: A StatefulSet that staging rotated has had a member not Ready for 15 minutes; every stateful class on it stays refused until it recovers.
---
# Source: phorvex/templates/attacks-targets-policy.yaml
# The attacks service's SecurityEvents target only console.attackNamespaces. SecurityEvents
# are cluster-scoped, so RBAC cannot confine what it creates, changes or deletes; this policy
# matches the attacks service's own requests only, and leaves every other requester's,
# production's included, alone. It runs in the API server and cannot fail open.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: staging-attacks-targets-664615def0
  labels:
    app.kubernetes.io/name: phorvex
    app.kubernetes.io/instance: staging
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: phorvex
    phorvex.ai/policy: attacks-targets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["amtd.r6security.com"]
      apiVersions: ["*"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["securityevents"]
  matchConditions:
  - name: the-attacks-service
    expression: "request.userInfo.username == \"system:serviceaccount:phorvex-staging:staging-attacks\""
  variables:
  - name: targets
    expression: "request.operation == 'DELETE' ? oldObject.spec.targets : object.spec.targets"
  validations:
  - expression: "size(variables.targets) > 0 && variables.targets.all(t, [\"phorvex-staging-demo\",\"console-identity-shared\",\"p6-demo\"].exists(n, t.startsWith(n + '/')))"
    reason: Forbidden
    message: "the attacks service may only target, change or delete SecurityEvents of Pods in phorvex-staging-demo, console-identity-shared, p6-demo"
---
