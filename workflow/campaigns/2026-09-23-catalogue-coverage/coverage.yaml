  required_effect: If present, deny an unauthorized operation without exposing files or invoking an external provider.
  threat_oracle: In an isolated fixture, owned-file containment or synthetic call-control denial; no live exploit payload.
  service_oracle: Authorized disposable session/call workflow still completes.
  present_constraints: Installed pipecat-ai 0.0.94 is in advisory version ranges, but Deployment shows no command/args and runner, folder and telephony modes are unknown.
  next_step: Bind image entrypoint and route/config provenance to the Pipecat vendor advisories before case admission.
  source_gap: CVE-2026-44716 and CVE-2026-54695 feature predicates are unproved; no CVE applicability claim.
- id: nats-durable-message
