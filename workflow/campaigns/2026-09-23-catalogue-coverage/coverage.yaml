scope_decisions:
- area: MIG partition and MIG-specific GPU controls
  disposition: excluded-unavailable-hardware
  evidence: No MIG allocatable resource in eight-Node inventory; one GPU node's numeric allocation does not prove MIG support.
  revisit: Only after actual MIG-capable node/resource and exact fixture are observed.
- area: Argo CD, Grafana/Prometheus, GPU plugin and node infrastructure
  disposition: scoped-dependency-not-ordinary-attack-target-in-initial-wave
  evidence: Present among 48 controllers; provide deployment, telemetry and hardware context rather than the sampled application trust boundaries.
  revisit: Add versioned cells if a specific producer, authority or failure mode materially controls a supported workload case.
- area: Non-fixture customer data, provider calls, existing NATS streams and shared-cluster crash stimuli
  disposition: excluded-from-stimulus
  evidence: Campaign authorization is bounded to owned fixtures and independently measured service outcomes.
  revisit: No automatic expansion; require a separately reviewed and authorized case.
