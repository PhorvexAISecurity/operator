event_modes:
  direct: Direct mechanism probe; no installed-manager or attack claim.
  proactive: Installed decision without an alert; observe actual context and no-action.
  real_detector_unverified: Requires an independently identified real producer, event and target join.
  injected_response_only: Injected event tests response wiring, never natural detection.
  no_current_path: No verified producer or admissible installed path at this baseline.
cells:
- id: voice-stream-continuity
  stack: voice
  kind: M
  disposition: reuse-and-revise
  source_ids: [c2-voice-websocket-continuity, c2-installed-manager-session]
  event_mode: direct
  objective: Establish session completion, fresh admission, interruption and recovery around a scoped target.
  required_effect: Exact target replacement or explicit PDB refusal with measured session outcome.
  threat_oracle: No attack objective; distinguish completed, interrupted and censored synthetic streams by frame and close records.
  service_oracle: Peer and new sessions complete with bounded latency, endpoint identity and no unintended interruption.
  present_constraints: Voice is 2/3; one Pod is Pending after CNI IP allocation failure; PDB permits zero disruptions.
  next_step: Restore and rebaseline capacity, then review an owned synthetic WebSocket fixture and PDB refusal arm.
  source_gap: Current fixture overrides the Voice image command; it proves transport behavior, not Pipecat speech semantics or natural detection.
- id: voice-session-authorization
  stack: voice
  kind: S
  disposition: new
  source_ids: []
  event_mode: no_current_path
  objective: Test unauthorized reuse of an owned disposable session identity across a real Voice trust boundary.
  required_effect: Reject the unauthorized continuation while preserving an authorized session; any Phorvex response needs exact installed attribution.
  threat_oracle: Independent server-side accepted/rejected session identity and bounded media/control outcome, separated from initial disclosure.
  service_oracle: Same-time legitimate session establishment, frame continuity and recovery.
  present_constraints: Public Voice Ingress exists, but effective application session authentication and producer signal are unverified; capacity/PDB baseline is degraded.
  next_step: Trace deployed entrypoint, session identity contract and telemetry; design only an owned synthetic identity fixture.
  source_gap: No verified unauthorized producer, session oracle or detector-to-brain path.
