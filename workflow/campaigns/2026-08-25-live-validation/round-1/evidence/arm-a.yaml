apiVersion: v1
kind: Namespace
metadata:
  name: cv1-control
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv1-web
  namespace: cv1-control
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cv1-web
  template:
    metadata:
      labels:
        app: cv1-web
        r6th.io/rotation-target: "true"
        data-class: internal
    spec:
      tolerations:
      - operator: Exists
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: phorvex.ai/v1alpha1
kind: PhorvexPolicy
metadata:
  name: cv1-defense
  namespace: cv1-control
spec:
  tenant: cv1-control
  mode: active
  selector:
    matchLabels:
      r6th.io/rotation-target: "true"
  objective:
    lambda: "0.5"
    costWeights:
      flowDisruption: "0.6"
      normSparsity: "0.4"
  budget:
    tickInterval: 10s
    maxMovesPerTick: 1
    antiOverRotationWindow: 90s
    proactiveFloor: 15m
  slo:
    costCeiling: "1.2"
    minAvailableReplicas: 2
  assetValue:
    blastRadiusFromGraph: true
    weightSecrets: "0.8"
    fromLabels:
      data-class:
        internal: "0.4"
        public: "0.1"
        restricted: "1.0"
  triggers:
    eventDriven: true
    reactiveOnly: true
  actions:
    enabled:
    - rotate
