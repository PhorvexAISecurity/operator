# Class A/B sample: a 3-node NATS JetStream cluster. JetStream re-seeds a member that returns on
# empty storage from its RAFT peers, so the owner may declare peer-resync. Readiness is the
# JetStream health endpoint, so a rebuilt member is Ready only once its streams are current.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-e2e-config
  namespace: phorvex-stateful-e2e
data:
  nats.conf: |
    port: 4222
    http: 8222
    server_name: $POD_NAME
    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 64MB
      max_file_store: 512MB
    }
    cluster {
      name: nats-e2e
      port: 6222
      routes: [
        nats://nats-e2e-0.nats-e2e-headless.phorvex-stateful-e2e.svc:6222
        nats://nats-e2e-1.nats-e2e-headless.phorvex-stateful-e2e.svc:6222
        nats://nats-e2e-2.nats-e2e-headless.phorvex-stateful-e2e.svc:6222
      ]
    }
    lame_duck_duration: "30s"
---
apiVersion: v1
kind: Service
metadata:
  name: nats-e2e-headless
  namespace: phorvex-stateful-e2e
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: nats-e2e}
  ports:
  - {name: client, port: 4222}
  - {name: cluster, port: 6222}
  - {name: monitor, port: 8222}
---
apiVersion: v1
kind: Service
metadata:
  name: nats-e2e
  namespace: phorvex-stateful-e2e
spec:
  selector: {app: nats-e2e}
  ports:
  - {name: client, port: 4222}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nats-e2e
  namespace: phorvex-stateful-e2e
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: nats-e2e}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats-e2e
  namespace: phorvex-stateful-e2e
  annotations:
    phorvex.ai/stateful-quorum: "2"
    phorvex.ai/stateful-replica-rebuild: peer-resync
    phorvex.ai/stateful-snapshot-class: ebs-csi-snapclass
    phorvex.ai/stateful-recovery-seconds: "180"
    phorvex.ai/stateful-resync-seconds: "300"
spec:
  replicas: 3
  serviceName: nats-e2e-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: nats-e2e}
  template:
    metadata:
      labels: {app: nats-e2e, phorvex.ai/e2e: stateful, data-class: restricted}
    spec:
      terminationGracePeriodSeconds: 45
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: eks.amazonaws.com/nodegroup, operator: NotIn, values: [phorvex-dev-eks-db-ng]}
      securityContext: {fsGroup: 1000}
      containers:
      - name: nats
        image: nats:2.10-alpine
        args: [--config, /etc/nats/nats.conf]
        env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        ports:
        - {name: client, containerPort: 4222}
        - {name: cluster, containerPort: 6222}
        - {name: monitor, containerPort: 8222}
        readinessProbe:
          httpGet: {path: /healthz, port: 8222}
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
        volumeMounts:
        - {name: config, mountPath: /etc/nats}
        - {name: data, mountPath: /data}
      volumes:
      - name: config
        configMap: {name: nats-e2e-config}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: gp2-csi
      resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-box
  namespace: phorvex-stateful-e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: nats-box}
  template:
    metadata:
      labels: {app: nats-box}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: eks.amazonaws.com/nodegroup, operator: NotIn, values: [phorvex-dev-eks-db-ng]}
      containers:
      - name: nats-box
        image: natsio/nats-box:0.14.5
        command: [sleep, infinity]
        env:
        - {name: NATS_URL, value: "nats://nats-e2e:4222"}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
