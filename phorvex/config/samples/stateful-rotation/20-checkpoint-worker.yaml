# Class C sample: a volume-less worker keeping its state in memory. POST /checkpoint commits
# the state to its durable store (one ConfigMap per member, written only by the worker's own
# ServiceAccount) and returns (checkpointId, sha256); on start the member restores it, and
# GET /restore reports the digest recomputed over the restored state.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkpoint-worker
  namespace: phorvex-stateful-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: checkpoint-worker
  namespace: phorvex-stateful-e2e
rules:
- {apiGroups: [""], resources: [configmaps], resourceNames: [checkpoint-checkpoint-worker-0, checkpoint-checkpoint-worker-1], verbs: [get, update]}
- {apiGroups: [""], resources: [configmaps], verbs: [create]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: checkpoint-worker
  namespace: phorvex-stateful-e2e
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: checkpoint-worker}
subjects: [{kind: ServiceAccount, name: checkpoint-worker, namespace: phorvex-stateful-e2e}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkpoint-worker-app
  namespace: phorvex-stateful-e2e
data:
  worker.py: |
    import hashlib, http.server, json, os, secrets, ssl, threading, time, urllib.error, urllib.request
    SA = "/var/run/secrets/kubernetes.io/serviceaccount/"
    NS = open(SA + "namespace").read()
    CTX = ssl.create_default_context(cafile=SA + "ca.crt")
    API = "https://kubernetes.default.svc/api/v1/namespaces/%s/configmaps" % NS
    STORE = "checkpoint-" + os.environ["POD_NAME"]

    def call(method, url, body=None):
        req = urllib.request.Request(url, method=method, data=json.dumps(body).encode() if body else None,
                                     headers={"Authorization": "Bearer " + open(SA + "token").read(),
                                              "Content-Type": "application/json"})
        try:
            with urllib.request.urlopen(req, context=CTX, timeout=5) as resp:
                return resp.status, json.loads(resp.read())
        except urllib.error.HTTPError as e:
            return e.code, None

    def digest(blob):
        return hashlib.sha256(blob.encode()).hexdigest()

    lock = threading.Lock()
    status, stored = call("GET", API + "/" + STORE)
    if status == 200:
        blob = stored["data"]["state"]
        state = json.loads(blob)
        restored = {"checkpointId": stored["data"]["id"], "sha256": digest(blob)}
    else:
        state = {"counter": 0, "secret": secrets.token_hex(32)}
        restored = {"checkpointId": "none", "sha256": "0" * 64}

    def work():
        while True:
            with lock:
                state["counter"] += 1
            time.sleep(1)

    threading.Thread(target=work, daemon=True).start()

    class Handler(http.server.BaseHTTPRequestHandler):
        def reply(self, code, obj):
            body = json.dumps(obj).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_POST(self):
            if self.path != "/checkpoint":
                return self.reply(404, {})
            with lock:
                blob = json.dumps(state, sort_keys=True)
            ack = {"checkpointId": "ckpt-%d" % time.time_ns(), "sha256": digest(blob)}
            cm = {"apiVersion": "v1", "kind": "ConfigMap", "metadata": {"name": STORE},
                  "data": {"state": blob, "id": ack["checkpointId"]}}
            code, _ = call("PUT", API + "/" + STORE, cm)
            if code == 404:
                code, _ = call("POST", API, cm)
            if code not in (200, 201):
                return self.reply(503, {"error": "durable store unavailable"})
            self.reply(200, ack)

        def do_GET(self):
            if self.path == "/restore":
                return self.reply(200, restored)
            if self.path == "/healthz":
                with lock:
                    return self.reply(200, {"counter": state["counter"]})
            self.reply(404, {})

        def log_message(self, *args):
            pass

    http.server.ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: checkpoint-worker
  namespace: phorvex-stateful-e2e
  annotations:
    phorvex.ai/stateful-checkpoint-port: "8080"
    phorvex.ai/stateful-checkpoint-path: /checkpoint
    phorvex.ai/stateful-restore-path: /restore
    phorvex.ai/stateful-recovery-seconds: "60"
spec:
  replicas: 2
  serviceName: checkpoint-worker
  selector:
    matchLabels: {app: checkpoint-worker}
  template:
    metadata:
      labels: {app: checkpoint-worker, phorvex.ai/e2e: stateful, data-class: restricted}
    spec:
      serviceAccountName: checkpoint-worker
      terminationGracePeriodSeconds: 5
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: eks.amazonaws.com/nodegroup, operator: NotIn, values: [phorvex-dev-eks-db-ng]}
      containers:
      - name: worker
        image: python:3.12-alpine
        command: [python3, /app/worker.py]
        env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        ports:
        - {name: http, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 3
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
        volumeMounts:
        - {name: app, mountPath: /app}
      volumes:
      - name: app
        configMap: {name: checkpoint-worker-app}
---
apiVersion: v1
kind: Service
metadata:
  name: checkpoint-worker
  namespace: phorvex-stateful-e2e
spec:
  clusterIP: None
  selector: {app: checkpoint-worker}
  ports:
  - {name: http, port: 8080}
