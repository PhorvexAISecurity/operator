---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-phorvex-ai-v1alpha1-phorvexpolicy
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: vphorvexpolicy.phorvex.ai
  rules:
  - apiGroups:
    - phorvex.ai
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - phorvexpolicies
  sideEffects: None
  timeoutSeconds: 5
