{{- if and .Values.phorvex.epss.enabled .Values.phorvex.epss.feed.enabled }}
{{- $name := printf "%s-epss-feed" (include "phorvex.fullname" .) | trunc 63 | trimSuffix "-" -}}
{{- if or (and .Values.phorvex.epss.feed.scopeNamespaces (empty .Values.phorvex.epss.feed.scopeDigests)) (and .Values.phorvex.epss.feed.scopeDigests (empty .Values.phorvex.epss.feed.scopeNamespaces)) }}
{{- fail "scoped EPSS feed requires both scopeNamespaces and scopeDigests" }}
{{- end }}
{{- $auth := .Values.phorvex.epss.feed.registryAuth }}
{{- $mode := default "secret" $auth.mode }}
{{- $irsa := $auth.irsaInit }}
{{- if not (has $mode (list "secret" "irsaInit")) }}
{{- fail "EPSS registry authentication mode must be secret or irsaInit" }}
{{- end }}
{{- if and $irsa.enabled (or (not $auth.enabled) (ne $mode "irsaInit")) }}
{{- fail "EPSS registry authentication irsaInit requires enabled=true and mode=irsaInit" }}
{{- end }}
{{- if and $auth.enabled (eq $mode "secret") (or (empty $auth.secretName) (empty $auth.secretKey) (empty $auth.registries)) }}
{{- fail "EPSS registry authentication requires secretName, secretKey, and exact registries" }}
{{- end }}
{{- if and (not $auth.enabled) (or $auth.secretName $auth.registries) }}
{{- fail "EPSS registry authentication values require registryAuth.enabled=true" }}
{{- end }}
{{- $useIRSA := and $auth.enabled (eq $mode "irsaInit") }}
{{- if $useIRSA }}
{{- if or (not $irsa.enabled) $auth.secretName (ne $auth.secretKey "config.json") }}
{{- fail "EPSS registry authentication Secret and irsaInit modes are mutually exclusive" }}
{{- end }}
{{- if or (ne .Release.Namespace "phorvex-system") (ne $name "phorvex-phorvex-epss-feed") }}
{{- fail "EPSS registry authentication irsaInit requires the exact trusted ServiceAccount subject" }}
{{- end }}
{{- $role := "arn:aws:iam::753556437180:role/phorvex-dev-epss-feed" }}
{{- $hosts := list "753556437180.dkr.ecr.us-east-2.amazonaws.com" "602401143452.dkr.ecr.us-east-2.amazonaws.com" }}
{{- if or (ne $irsa.roleARN $role) (ne $irsa.region "us-east-2") (ne (default "" (index .Values.phorvex.epss.feed.serviceAccount.annotations "eks.amazonaws.com/role-arn")) $role) }}
{{- fail "EPSS registry authentication irsaInit requires the expected role annotation and region" }}
{{- end }}
{{- if or (ne (len $auth.registries) 2) (ne (join "," (sortAlpha $auth.registries)) (join "," (sortAlpha $hosts))) }}
{{- fail "EPSS registry authentication irsaInit requires exactly the two approved hosts" }}
{{- end }}
{{- if not (regexMatch "^753556437180[.]dkr[.]ecr[.]us-east-2[.]amazonaws[.]com/phorvex@sha256:[0-9a-f]{64}$" $irsa.image) }}
{{- fail "EPSS registry authentication irsaInit requires a published helper image digest" }}
{{- end }}
{{- if or (le (int .Values.phorvex.epss.feed.activeDeadlineSeconds) 0) (gt (int .Values.phorvex.epss.feed.activeDeadlineSeconds) 3600) (ne .Values.phorvex.epss.feed.scanTimeout "10m") }}
{{- fail "EPSS registry authentication irsaInit supports deadline <=3600s and scanTimeout=10m" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "phorvex.labels" $ | nindent 4 }}
    app.kubernetes.io/component: epss-feed
  {{- with .Values.phorvex.epss.feed.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# Inventory only. The feed cannot mutate workloads or read Secrets.
{{- if .Values.phorvex.epss.feed.scopeNamespaces }}
{{- range $i, $namespace := .Values.phorvex.epss.feed.scopeNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-pods-%d" $name $i | trunc 63 | trimSuffix "-" }}
  namespace: {{ $namespace }}
  labels:
    {{- include "phorvex.labels" $ | nindent 4 }}
    app.kubernetes.io/component: epss-feed
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-pods-%d" $name $i | trunc 63 | trimSuffix "-" }}
  namespace: {{ $namespace }}
  labels:
    {{- include "phorvex.labels" $ | nindent 4 }}
    app.kubernetes.io/component: epss-feed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-pods-%d" $name $i | trunc 63 | trimSuffix "-" }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
---
{{- end }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
    app.kubernetes.io/component: epss-feed
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
    app.kubernetes.io/component: epss-feed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
# Kubernetes cannot resourceName-restrict list/create, so the chart bootstraps the
# ConfigMap and grants this ServiceAccount only get/update on that exact object.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
    app.kubernetes.io/component: epss-feed
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: [{{ .Values.phorvex.epss.configMapName | quote }}]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
    app.kubernetes.io/component: epss-feed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
    app.kubernetes.io/component: epss-feed
spec:
  schedule: {{ .Values.phorvex.epss.feed.schedule | quote }}
  suspend: {{ .Values.phorvex.epss.feed.suspend }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.phorvex.epss.feed.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "phorvex.labels" . | nindent 12 }}
            app.kubernetes.io/component: epss-feed
        spec:
          serviceAccountName: {{ $name }}
          restartPolicy: Never
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          {{- with .Values.phorvex.epss.feed.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          initContainers:
          {{- if $useIRSA }}
          - name: ecr-auth
            image: {{ $irsa.image | quote }}
            imagePullPolicy: IfNotPresent
            env:
            - name: AWS_ROLE_ARN
              value: {{ $irsa.roleARN | quote }}
            - name: AWS_REGION
              value: {{ $irsa.region | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ $irsa.region | quote }}
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { cpu: 100m, memory: 64Mi }
            volumeMounts:
            - name: registry-auth
              mountPath: /var/run/secrets/phorvex-epss-registry-auth
            - name: epss-web-identity
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
          {{- end }}
          - name: trivy
            image: "{{ .Values.phorvex.epss.feed.trivy.image.repository }}:{{ .Values.phorvex.epss.feed.trivy.image.tag }}"
            imagePullPolicy: {{ .Values.phorvex.epss.feed.trivy.image.pullPolicy }}
            command: ["/bin/sh", "-ec"]
            args: ["cp /usr/local/bin/trivy /tools/trivy"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            volumeMounts:
            - name: trivy-bin
              mountPath: /tools
          containers:
          - name: feed
            image: {{ include "phorvex.image" . | quote }}
            imagePullPolicy: {{ .Values.phorvex.image.pullPolicy }}
            args:
            - --epss-feed=true
            - --epss-feed-apply={{ .Values.phorvex.epss.feed.apply }}
            - --epss-feed-allow-partial={{ .Values.phorvex.epss.feed.allowPartial }}
            - --epss-feed-namespace={{ .Release.Namespace }}
            - --epss-feed-configmap={{ .Values.phorvex.epss.configMapName }}
            - --epss-feed-key={{ .Values.phorvex.epss.fileName }}
            - --epss-metadata-key={{ .Values.phorvex.epss.metadataFileName }}
            - --epss-feed-metadata-ttl={{ .Values.phorvex.epss.feed.metadataTTL }}
            {{- if .Values.phorvex.epss.feed.scopeNamespaces }}
            - --epss-feed-scope-namespaces={{ join "," .Values.phorvex.epss.feed.scopeNamespaces }}
            {{- end }}
            {{- if .Values.phorvex.epss.feed.scopeDigests }}
            - --epss-feed-scope-digests={{ join "," .Values.phorvex.epss.feed.scopeDigests }}
            {{- end }}
            - --epss-feed-first-url={{ .Values.phorvex.epss.feed.firstURL }}
            - --epss-feed-trivy={{ .Values.phorvex.epss.feed.trivyPath }}
            - --epss-feed-scan-timeout={{ .Values.phorvex.epss.feed.scanTimeout }}
            {{- if .Values.phorvex.epss.feed.registryAuth.enabled }}
            - --epss-feed-registry-auth-file=/var/run/secrets/phorvex-epss-registry-auth/config.json
            - --epss-feed-registry-auth-registries={{ join "," .Values.phorvex.epss.feed.registryAuth.registries }}
            {{- end }}
            env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.phorvex.epss.feed.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              {{- toYaml .Values.phorvex.epss.feed.resources | nindent 14 }}
            volumeMounts:
            - name: trivy-cache
              mountPath: /tmp
            - name: trivy-bin
              mountPath: /tools
              readOnly: true
            {{- if .Values.phorvex.epss.feed.registryAuth.enabled }}
            - name: registry-auth
              mountPath: /var/run/secrets/phorvex-epss-registry-auth
              readOnly: true
            {{- end }}
          volumes:
          - name: trivy-cache
            emptyDir: {}
          - name: trivy-bin
            emptyDir: {}
          {{- if .Values.phorvex.epss.feed.registryAuth.enabled }}
          - name: registry-auth
            {{- if $useIRSA }}
            emptyDir:
              medium: Memory
              sizeLimit: 1Mi
          - name: epss-web-identity
            projected:
              defaultMode: 0440
              sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
            {{- else }}
            secret:
              secretName: {{ .Values.phorvex.epss.feed.registryAuth.secretName | quote }}
              defaultMode: 0440
              items:
              - key: {{ .Values.phorvex.epss.feed.registryAuth.secretKey | quote }}
                path: config.json
            {{- end }}
          {{- end }}
          {{- with .Values.phorvex.epss.feed.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.phorvex.epss.feed.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.phorvex.epss.feed.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
