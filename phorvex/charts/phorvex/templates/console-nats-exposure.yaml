{{- if and .Values.phorvex.console.enabled .Values.phorvex.console.natsExposure.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: phorvex-nats-exposure-fixture
  labels:
    phorvex.ai/nats-exposure-fixture: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "phorvex.fullname" . }}-console-nats-fixture
  namespace: phorvex-nats-exposure-fixture
rules:
- apiGroups: [""]
  resources: ["pods", "configmaps"]
  verbs: ["get", "create", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "phorvex.fullname" . }}-console-nats-fixture
  namespace: phorvex-nats-exposure-fixture
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "phorvex.fullname" . }}-console-nats-fixture
subjects:
- kind: ServiceAccount
  name: {{ include "phorvex.consoleServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "phorvex.fullname" . }}-console-nats-read
  namespace: nats
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["pods/portforward"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "phorvex.fullname" . }}-console-nats-read
  namespace: nats
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "phorvex.fullname" . }}-console-nats-read
subjects:
- kind: ServiceAccount
  name: {{ include "phorvex.consoleServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
