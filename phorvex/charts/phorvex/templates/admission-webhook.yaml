{{- if .Values.phorvex.admissionWebhook.enabled }}
{{- $fullname := include "phorvex.fullname" . -}}
{{- $serviceName := printf "%s-webhook" $fullname -}}
{{- $secretName := printf "%s-webhook-cert" $fullname -}}
{{- $caCert := "" -}}
{{- $tlsCert := "" -}}
{{- $tlsKey := "" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if and $existing (hasKey $existing.data "ca.crt") (hasKey $existing.data "tls.crt") (hasKey $existing.data "tls.key") -}}
{{- $caCert = (index $existing.data "ca.crt" | b64dec) -}}
{{- $tlsCert = (index $existing.data "tls.crt" | b64dec) -}}
{{- $tlsKey = (index $existing.data "tls.key" | b64dec) -}}
{{- else -}}
{{- $ca := genCA (printf "%s-ca" $fullname) 3650 -}}
{{- $dnsNames := list $serviceName (printf "%s.%s" $serviceName .Release.Namespace) (printf "%s.%s.svc" $serviceName .Release.Namespace) (printf "%s.%s.svc.cluster.local" $serviceName .Release.Namespace) -}}
{{- $cert := genSignedCert $serviceName nil $dnsNames 3650 $ca -}}
{{- $caCert = $ca.Cert -}}
{{- $tlsCert = $cert.Cert -}}
{{- $tlsKey = $cert.Key -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $caCert | b64enc | quote }}
  tls.crt: {{ $tlsCert | b64enc | quote }}
  tls.key: {{ $tlsKey | b64enc | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "phorvex.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  - name: https-webhook
    port: 443
    protocol: TCP
    targetPort: webhook-server
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ printf "%s-policy-validator" $fullname | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
webhooks:
- name: vphorvexpolicy.phorvex.ai
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Fail
  matchPolicy: Equivalent
  timeoutSeconds: 5
  clientConfig:
    caBundle: {{ $caCert | b64enc | quote }}
    service:
      name: {{ $serviceName }}
      namespace: {{ .Release.Namespace }}
      port: 443
      path: /validate-phorvex-ai-v1alpha1-phorvexpolicy
  rules:
  - apiGroups: ["phorvex.ai"]
    apiVersions: ["v1alpha1"]
    operations: ["CREATE", "UPDATE"]
    resources: ["phorvexpolicies"]
    scope: Namespaced
---
# M-94: bind every SecurityEvent to the identity that created it. The authenticated user is
# known only to the API server, so the stamp has to happen at admission; ingest then allowlists
# that identity instead of the self-declared spec.rule.source.
#
# failurePolicy is Ignore ON PURPOSE: Phorvex must never be able to block the cluster's
# security-event flow. An unstamped event is untrusted at ingest, so the failure direction is
# closed on the belief side rather than on the API server.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ printf "%s-securityevent-stamp" $fullname | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
webhooks:
- name: stamp-securityevent.phorvex.ai
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Ignore
  matchPolicy: Equivalent
  reinvocationPolicy: IfNeeded
  timeoutSeconds: 5
  clientConfig:
    caBundle: {{ $caCert | b64enc | quote }}
    service:
      name: {{ $serviceName }}
      namespace: {{ .Release.Namespace }}
      port: 443
      path: /stamp-amtd-r6security-com-v1beta1-securityevent
  rules:
  - apiGroups: ["amtd.r6security.com"]
    apiVersions: ["v1beta1"]
    operations: ["CREATE", "UPDATE"]
    resources: ["securityevents"]
    scope: Cluster
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ printf "%s-protected-outcomes-stamp" $fullname | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
webhooks:
# M99 outcome-bearing events must never preserve a forged stamp on webhook failure.
# The general M94 event-flow hook above retains its existing availability policy.
- name: stamp-protected-outcomes.phorvex.ai
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Fail
  matchPolicy: Equivalent
  reinvocationPolicy: IfNeeded
  timeoutSeconds: 5
  matchConditions:
  - name: protected-outcomes
    expression: "has(object.metadata.annotations) && 'phorvex.ai/protected-outcomes-v1' in object.metadata.annotations"
  clientConfig:
    caBundle: {{ $caCert | b64enc | quote }}
    service:
      name: {{ $serviceName }}
      namespace: {{ .Release.Namespace }}
      port: 443
      path: /stamp-amtd-r6security-com-v1beta1-securityevent
  rules:
  - apiGroups: ["amtd.r6security.com"]
    apiVersions: ["v1beta1"]
    operations: ["CREATE", "UPDATE"]
    resources: ["securityevents"]
    scope: Cluster
{{- if .Values.phorvex.lossHistory.enabled }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ printf "%s-completed-disclosure-stamp" $fullname | trunc 63 | trimSuffix "-" }}
  annotations:
    phorvex.ai/completed-disclosure-boundary-contract: completed-disclosure-boundary-v2
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
webhooks:
- name: stamp-completed-disclosures.phorvex.ai
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Fail
  matchPolicy: Equivalent
  reinvocationPolicy: IfNeeded
  timeoutSeconds: 5
  matchConditions:
  - name: completed-disclosures
    expression: "(has(object.metadata.annotations) && 'phorvex.ai/completed-disclosure-v1' in object.metadata.annotations) || (request.operation == 'UPDATE' && has(oldObject.metadata.annotations) && 'phorvex.ai/completed-disclosure-v1' in oldObject.metadata.annotations)"
  clientConfig:
    caBundle: {{ $caCert | b64enc | quote }}
    service:
      name: {{ $serviceName }}
      namespace: {{ .Release.Namespace }}
      port: 443
      path: /stamp-amtd-r6security-com-v1beta1-securityevent
  rules:
  - apiGroups: ["amtd.r6security.com"]
    apiVersions: ["v1beta1"]
    operations: ["CREATE", "UPDATE"]
    resources: ["securityevents"]
    scope: Cluster
{{- end }}
{{- if .Values.phorvex.lossHistory.currentInventory.enabled }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ printf "%s-current-inventory-stamp" $fullname | trunc 63 | trimSuffix "-" }}
  annotations:
    phorvex.ai/current-inventory-boundary-contract: current-protected-inventory-boundary-v1
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
webhooks:
- name: stamp-current-protected-inventory.phorvex.ai
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Fail
  matchPolicy: Equivalent
  reinvocationPolicy: IfNeeded
  timeoutSeconds: 5
  matchConditions:
  - name: current-protected-inventory
    expression: "(has(object.metadata.annotations) && 'phorvex.ai/current-protected-inventory-v1' in object.metadata.annotations) || (request.operation == 'UPDATE' && has(oldObject.metadata.annotations) && 'phorvex.ai/current-protected-inventory-v1' in oldObject.metadata.annotations)"
  clientConfig:
    caBundle: {{ $caCert | b64enc | quote }}
    service:
      name: {{ $serviceName }}
      namespace: {{ .Release.Namespace }}
      port: 443
      path: /stamp-amtd-r6security-com-v1beta1-securityevent
  rules:
  - apiGroups: ["amtd.r6security.com"]
    apiVersions: ["v1beta1"]
    operations: ["CREATE", "UPDATE"]
    resources: ["securityevents"]
    scope: Cluster
{{- end }}
{{- end }}
