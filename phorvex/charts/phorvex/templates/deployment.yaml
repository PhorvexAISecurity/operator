apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "phorvex.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- if and .Values.phorvex.audit.enabled .Values.phorvex.audit.persistence.enabled }}
  # A ReadWriteOnce volume can only be attached to one node at a time, so a RollingUpdate
  # would deadlock: the new pod cannot mount the PVC until the old pod releases it, and the
  # old pod is not terminated until the new one is Ready.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "phorvex.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "phorvex.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "phorvex.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        {{- if or .Values.phorvex.audit.enabled .Values.phorvex.admissionWebhook.enabled }}
        # Both containers run as non-root with different images; fsGroup makes the mounted
        # audit volume group-writable and lets the manager read its 0440 webhook key.
        fsGroup: 65532
        {{- end }}
      containers:
      - name: manager
        image: "{{ .Values.phorvex.image.repository }}:{{ .Values.phorvex.image.tag }}"
        imagePullPolicy: {{ .Values.phorvex.image.pullPolicy }}
        args:
        - --base-interval={{ .Values.phorvex.baseInterval }}
        - --actions-supported-debounce={{ .Values.phorvex.actionsSupportedDebounce }}
        - --calibration-shadow={{ .Values.phorvex.calibration.enabled }}
        {{- if .Values.phorvex.calibration.enabled }}
        - --calibration-sample={{ .Values.phorvex.calibration.sampleInterval }}
        - --calibration-refresh={{ .Values.phorvex.calibration.refreshInterval }}
        - --calibration-lookback={{ .Values.phorvex.calibration.lookback }}
        - --calibration-export-dir={{ .Values.phorvex.calibration.exportDir }}
        {{- end }}
        - --metrics-bind-address={{ .Values.phorvex.metricsBindAddress }}
        - --health-probe-bind-address={{ .Values.phorvex.healthProbeBindAddress }}
        - --leader-elect={{ .Values.phorvex.leaderElect }}
        {{- if .Values.phorvex.admissionWebhook.enabled }}
        - --admission-webhook=true
        - --webhook-port={{ .Values.phorvex.admissionWebhook.port }}
        - --webhook-cert-dir={{ .Values.phorvex.admissionWebhook.certDir }}
        {{- end }}
        {{- if .Values.phorvex.prometheusUrl }}
        - --prometheus-url={{ .Values.phorvex.prometheusUrl }}
        {{- end }}
        {{- if .Values.phorvex.epss.enabled }}
        - --epss-cache={{ printf "%s/%s" (.Values.phorvex.epss.mountPath | trimSuffix "/") .Values.phorvex.epss.fileName }}
        - --epss-cache-refresh={{ .Values.phorvex.epss.refreshInterval }}
        {{- end }}
        {{- if .Values.phorvex.operatorNamespace }}
        - --operator-namespace={{ .Values.phorvex.operatorNamespace }}
        {{- end }}
        - --gpu-envelope-max={{ .Values.phorvex.gpuEnvelopeMax }}
        {{- with .Values.phorvex.pcieClassCapacity }}
        - --pcie-class-table={{ toJson . }}
        {{- end }}
        {{- with .Values.phorvex.flowResidualClasses }}
        - --flow-residual-classes={{ join "," . }}
        {{- end }}
        {{- $detectors := .Values.phorvex.trustedDetectors | default list }}
        {{- if .Values.phorvex.e2eDetector.enabled }}
        {{- $detectors = append $detectors (printf "%s/%s-e2e-detector" .Release.Namespace (include "phorvex.fullname" .)) }}
        {{- end }}
        {{- with $detectors }}
        - --trusted-detectors={{ join "," . }}
        {{- end }}
        {{- if .Values.phorvex.audit.enabled }}
        {{- $auditMaxBytesText := toString .Values.phorvex.audit.maxBytes }}
        {{- if kindIs "float64" .Values.phorvex.audit.maxBytes }}
        {{- if or (lt .Values.phorvex.audit.maxBytes 0.0) (ne .Values.phorvex.audit.maxBytes (floor .Values.phorvex.audit.maxBytes)) (gt .Values.phorvex.audit.maxBytes 9007199254740991.0) }}
        {{- fail "phorvex.audit.maxBytes must be a non-negative whole number of bytes (quote values above 9007199254740991)" }}
        {{- end }}
        {{- $auditMaxBytesText = printf "%.0f" .Values.phorvex.audit.maxBytes }}
        {{- end }}
        {{- $auditMaxBackupsText := toString .Values.phorvex.audit.maxBackups }}
        {{- if kindIs "float64" .Values.phorvex.audit.maxBackups }}
        {{- if or (lt .Values.phorvex.audit.maxBackups 0.0) (ne .Values.phorvex.audit.maxBackups (floor .Values.phorvex.audit.maxBackups)) (gt .Values.phorvex.audit.maxBackups 9007199254740991.0) }}
        {{- fail "phorvex.audit.maxBackups must be a non-negative whole number (quote values above 9007199254740991)" }}
        {{- end }}
        {{- $auditMaxBackupsText = printf "%.0f" .Values.phorvex.audit.maxBackups }}
        {{- end }}
        {{- if not (regexMatch "^(0|[1-9][0-9]*)$" $auditMaxBytesText) }}
        {{- fail "phorvex.audit.maxBytes must be a non-negative whole number of bytes" }}
        {{- end }}
        {{- if not (regexMatch "^(0|[1-9][0-9]*)$" $auditMaxBackupsText) }}
        {{- fail "phorvex.audit.maxBackups must be a non-negative whole number" }}
        {{- end }}
        {{- if or (gt (len $auditMaxBytesText) 19) (and (eq (len $auditMaxBytesText) 19) (gt $auditMaxBytesText "9223372036854775807")) }}
        {{- fail "phorvex.audit.maxBytes must not exceed 9223372036854775807" }}
        {{- end }}
        {{- if or (gt (len $auditMaxBackupsText) 19) (and (eq (len $auditMaxBackupsText) 19) (gt $auditMaxBackupsText "9223372036854775807")) }}
        {{- fail "phorvex.audit.maxBackups must not exceed 9223372036854775807" }}
        {{- end }}
        {{- $auditMaxBytes := int64 $auditMaxBytesText }}
        {{- $auditMaxBackups := int64 $auditMaxBackupsText }}
        {{- if and (gt $auditMaxBytes 0) (eq $auditMaxBackups 0) }}
        {{- fail "phorvex.audit.maxBackups must be at least 1 when phorvex.audit.maxBytes is positive" }}
        {{- end }}
        - --audit-json={{ .Values.phorvex.audit.path }}
        - --audit-max-bytes={{ $auditMaxBytes }}
        - --audit-max-backups={{ $auditMaxBackups }}
        {{- end }}
        {{- if .Values.phorvex.globalKillSwitch }}
        - --global-kill-switch=true
        {{- end }}
        {{- with .Values.phorvex.extraArgs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PHORVEX_BRAIN_IMAGE
          value: "{{ .Values.phorvex.image.repository }}:{{ .Values.phorvex.image.tag }}"
        {{- if .Values.phorvex.actuator }}
        - name: PHORVEX_ACTUATOR
          value: {{ .Values.phorvex.actuator | quote }}
        {{- end }}
        {{- with .Values.phorvex.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        {{- if .Values.phorvex.admissionWebhook.enabled }}
        - name: webhook-server
          containerPort: {{ .Values.phorvex.admissionWebhook.port }}
          protocol: TCP
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          {{- toYaml .Values.phorvex.resources | nindent 10 }}
        {{- if or .Values.phorvex.epss.enabled .Values.phorvex.audit.enabled .Values.phorvex.calibration.enabled .Values.phorvex.admissionWebhook.enabled }}
        volumeMounts:
        {{- if .Values.phorvex.epss.enabled }}
        - name: epss
          mountPath: {{ .Values.phorvex.epss.mountPath }}
          readOnly: true
        {{- end }}
        {{- if .Values.phorvex.audit.enabled }}
        - name: audit
          mountPath: {{ .Values.phorvex.audit.path | dir }}
        {{- end }}
        {{- if .Values.phorvex.calibration.enabled }}
        - name: calibration-evidence
          mountPath: {{ .Values.phorvex.calibration.exportDir }}
        {{- end }}
        {{- if .Values.phorvex.admissionWebhook.enabled }}
        - name: webhook-cert
          mountPath: {{ .Values.phorvex.admissionWebhook.certDir }}
          readOnly: true
        {{- end }}
        {{- end }}
{{- if .Values.phorvex.console.enabled }}

      # ── console ────────────────────────────────────────────────────────────
      # Second container, not a second Deployment: it reads the audit as a local file and
      # the operator writes it as a local file, so they have to share one filesystem.
      # It also inherits this pod's ServiceAccount, which is what finally lets
      # /api/workload/attack apply a SecurityEvent — the console's own ServiceAccount
      # never had the rights, and its image never had kubectl.
      - name: console
        image: "{{ .Values.phorvex.console.image.repository }}:{{ .Values.phorvex.console.image.tag }}"
        imagePullPolicy: {{ .Values.phorvex.console.image.pullPolicy }}
        args:
        - -root={{ .Values.phorvex.console.root }}
        - -web={{ .Values.phorvex.console.web }}
        - -addr=:{{ .Values.phorvex.console.port }}
        {{- if .Values.phorvex.audit.enabled }}
        # Explicit, so the console streams the operator's LIVE audit rather than falling
        # back to newestAudit() and serving the snapshot baked into its own image.
        - -audit-json={{ .Values.phorvex.audit.path }}
        {{- end }}
        {{- if .Values.phorvex.prometheusUrl }}
        # Let `phorvex --scan` (the console's Scan / Physics tab) reach the live DCGM/GPU feed.
        # The scan's SSRF guard only fetches a Prometheus whose host is allow-listed here, so
        # without this the URL is dropped and the GPU half of physics stays "unmeasured (no
        # GPU/DCGM scan)" even though dcgm-exporter is scraping. host[:port], scheme stripped.
        - -metrics-allow={{ .Values.phorvex.prometheusUrl | trimPrefix "https://" | trimPrefix "http://" }}
        {{- end }}
        {{- if .Values.phorvex.console.auth.grants.enabled }}
        # M-136: the DevOps-supplied subject grant table. Without it the console still starts and
        # still authenticates callers, but authorizes NOBODY — the fail-closed rollout state.
        - -auth-grants={{ .Values.phorvex.console.auth.grants.mountPath }}/{{ .Values.phorvex.console.auth.grants.fileName }}
        {{- end }}
        {{- if or .Values.phorvex.prometheusUrl .Values.phorvex.console.auth.alb.signerArn .Values.phorvex.console.auth.oidc.issuer .Values.phorvex.console.auth.trustedOrigins }}
        env:
        {{- if .Values.phorvex.prometheusUrl }}
        # The scan reads PHORVEX_PROM_URL as its default Prometheus when a request carries no
        # ?prometheus-url (subsystems.go Scan), so the browser Physics tab measures GPU physics.
        - name: PHORVEX_PROM_URL
          value: {{ .Values.phorvex.prometheusUrl | quote }}
        {{- end }}
        # ── M-136 console identity ─────────────────────────────────────────────
        # The console refuses to start unless at least one credential path is configured. These
        # are CONFIGURATION IDENTIFIERS (a load-balancer ARN, a user-pool issuer, an app-client
        # id) — not secrets — and they are per-deployment: never reuse one environment's signer
        # in another, or that environment's ALB becomes a trusted issuer for this one.
        {{- with .Values.phorvex.console.auth.alb }}
        {{- if .signerArn }}
        - name: PHORVEX_CONSOLE_ALB_SIGNER_ARN
          value: {{ .signerArn | quote }}
        - name: PHORVEX_CONSOLE_ALB_ISSUER
          value: {{ required "console.auth.alb.issuer is required when signerArn is set" .issuer | quote }}
        - name: PHORVEX_CONSOLE_ALB_CLIENT_ID
          value: {{ required "console.auth.alb.clientId is required when signerArn is set" .clientId | quote }}
        {{- if .region }}
        - name: PHORVEX_CONSOLE_ALB_REGION
          value: {{ .region | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- with .Values.phorvex.console.auth.oidc }}
        {{- if .issuer }}
        - name: PHORVEX_CONSOLE_OIDC_ISSUER
          value: {{ .issuer | quote }}
        - name: PHORVEX_CONSOLE_OIDC_AUDIENCE
          value: {{ required "console.auth.oidc.audience is required when issuer is set" .audience | quote }}
        - name: PHORVEX_CONSOLE_OIDC_JWKS_URL
          value: {{ required "console.auth.oidc.jwksUrl is required when issuer is set" .jwksUrl | quote }}
        {{- if .algorithms }}
        - name: PHORVEX_CONSOLE_OIDC_ALGS
          value: {{ join "," .algorithms | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.phorvex.console.auth.trustedOrigins }}
        # The same-origin/CSRF boundary for browser-driven state changes. Exact origins only;
        # there is no wildcard, and an unlisted origin gets no CORS grant either.
        - name: PHORVEX_CONSOLE_TRUSTED_ORIGINS
          value: {{ join "," .Values.phorvex.console.auth.trustedOrigins | quote }}
        {{- end }}
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.phorvex.console.port }}
        readinessProbe:
          httpGet: { path: /, port: http }
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /, port: http }
          initialDelaySeconds: 10
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          {{- toYaml .Values.phorvex.console.resources | nindent 10 }}
        volumeMounts:
        {{- if .Values.phorvex.audit.enabled }}
        - name: audit
          mountPath: {{ .Values.phorvex.audit.path | dir }}
          readOnly: true
        {{- end }}
        # workload_attack.go writes the SecurityEvent manifest with os.CreateTemp before
        # applying it. With readOnlyRootFilesystem that fails, so /tmp must be writable —
        # an emptyDir keeps the root filesystem read-only while allowing it.
        - name: console-tmp
          mountPath: /tmp
        {{- if .Values.phorvex.console.auth.grants.enabled }}
        - name: console-grants
          mountPath: {{ .Values.phorvex.console.auth.grants.mountPath }}
          readOnly: true
        {{- end }}
{{- end }}
      {{- if or .Values.phorvex.epss.enabled .Values.phorvex.audit.enabled .Values.phorvex.console.enabled .Values.phorvex.calibration.enabled .Values.phorvex.admissionWebhook.enabled }}
      volumes:
      {{- if .Values.phorvex.epss.enabled }}
      - name: epss
        configMap:
          name: {{ .Values.phorvex.epss.configMapName }}
      {{- end }}
      {{- if .Values.phorvex.audit.enabled }}
      - name: audit
        {{- if .Values.phorvex.audit.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "phorvex.fullname" . }}-audit
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- end }}
      {{- if .Values.phorvex.console.enabled }}
      - name: console-tmp
        emptyDir: {}
      {{- if .Values.phorvex.console.auth.grants.enabled }}
      - name: console-grants
        configMap:
          name: {{ .Values.phorvex.console.auth.grants.configMapName | default (printf "%s-console-grants" (include "phorvex.fullname" .)) }}
      {{- end }}
      {{- end }}
      {{- if .Values.phorvex.calibration.enabled }}
      - name: calibration-evidence
        emptyDir: {}
      {{- end }}
      {{- if .Values.phorvex.admissionWebhook.enabled }}
      - name: webhook-cert
        secret:
          secretName: {{ include "phorvex.fullname" . }}-webhook-cert
          defaultMode: 0440
      {{- end }}
      {{- end }}
      {{- with .Values.phorvex.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.phorvex.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.phorvex.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
