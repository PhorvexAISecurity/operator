apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "phorvex.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- if or (and .Values.phorvex.audit.enabled .Values.phorvex.audit.persistence.enabled) .Values.phorvex.lossHistory.enabled }}
  # A ReadWriteOnce volume can only be attached to one node at a time, so a RollingUpdate
  # would deadlock: the new pod cannot mount the PVC until the old pod releases it, and the
  # old pod is not terminated until the new one is Ready.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "phorvex.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "phorvex.labels" . | nindent 8 }}
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: {{ include "phorvex.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        {{- if or .Values.phorvex.audit.enabled .Values.phorvex.admissionWebhook.enabled .Values.phorvex.lossHistory.enabled }}
        # Containers run as non-root; fsGroup makes configured durable volumes
        # group-writable and lets the manager read its 0440 webhook key.
        fsGroup: 65532
        {{- end }}
      containers:
      - name: manager
        image: "{{ .Values.phorvex.image.repository }}:{{ .Values.phorvex.image.tag }}"
        imagePullPolicy: {{ .Values.phorvex.image.pullPolicy }}
        args:
        - --base-interval={{ .Values.phorvex.baseInterval }}
        - --actions-supported-debounce={{ .Values.phorvex.actionsSupportedDebounce }}
        - --calibration-shadow={{ .Values.phorvex.calibration.enabled }}
        {{- if .Values.phorvex.calibration.enabled }}
        - --calibration-sample={{ .Values.phorvex.calibration.sampleInterval }}
        - --calibration-refresh={{ .Values.phorvex.calibration.refreshInterval }}
        - --calibration-lookback={{ .Values.phorvex.calibration.lookback }}
        - --calibration-export-dir={{ .Values.phorvex.calibration.exportDir }}
        {{- end }}
        - --metrics-bind-address={{ .Values.phorvex.metricsBindAddress }}
        - --health-probe-bind-address={{ .Values.phorvex.healthProbeBindAddress }}
        - --leader-elect={{ .Values.phorvex.leaderElect }}
        {{- if .Values.phorvex.admissionWebhook.enabled }}
        - --admission-webhook=true
        - --webhook-port={{ .Values.phorvex.admissionWebhook.port }}
        - --webhook-cert-dir={{ .Values.phorvex.admissionWebhook.certDir }}
        {{- end }}
        {{- if .Values.phorvex.prometheusUrl }}
        - --prometheus-url={{ .Values.phorvex.prometheusUrl }}
        {{- end }}
        {{- if .Values.phorvex.epss.enabled }}
        - --epss-cache={{ printf "%s/%s" (.Values.phorvex.epss.mountPath | trimSuffix "/") .Values.phorvex.epss.fileName }}
        - --epss-cache-refresh={{ .Values.phorvex.epss.refreshInterval }}
        {{- end }}
        {{- if .Values.phorvex.operatorNamespace }}
        - --operator-namespace={{ .Values.phorvex.operatorNamespace }}
        {{- end }}
        {{- $quarantineCapText := toString .Values.phorvex.maxRetainedQuarantinesPerNamespace }}
        {{- if kindIs "float64" .Values.phorvex.maxRetainedQuarantinesPerNamespace }}
        {{- if or (lt .Values.phorvex.maxRetainedQuarantinesPerNamespace 0.0) (ne .Values.phorvex.maxRetainedQuarantinesPerNamespace (floor .Values.phorvex.maxRetainedQuarantinesPerNamespace)) }}
        {{- fail "phorvex.maxRetainedQuarantinesPerNamespace must be a non-negative whole number" }}
        {{- end }}
        {{- $quarantineCapText = printf "%.0f" .Values.phorvex.maxRetainedQuarantinesPerNamespace }}
        {{- end }}
        {{- if not (regexMatch "^(0|[1-9][0-9]*)$" $quarantineCapText) }}
        {{- fail "phorvex.maxRetainedQuarantinesPerNamespace must be a non-negative whole number" }}
        {{- end }}
        {{- if or (gt (len $quarantineCapText) 3) (gt (int64 $quarantineCapText) 128) }}
        {{- fail "phorvex.maxRetainedQuarantinesPerNamespace must not exceed 128" }}
        {{- end }}
        - --max-retained-quarantines-per-namespace={{ $quarantineCapText }}
        {{- if .Values.phorvex.loraCleanSources.content }}
        - --lora-clean-sources-file={{ .Values.phorvex.loraCleanSources.mountPath }}
        {{- end }}
        {{- if .Values.phorvex.mig.profiles.content }}
        - --mig-profiles-file={{ .Values.phorvex.mig.profiles.mountPath }}
        {{- end }}
        {{- if not (has .Values.phorvex.servingSecurity.mode (list "secure-required" "legacy-plaintext")) }}{{ fail "phorvex.servingSecurity.mode must be secure-required or legacy-plaintext" }}{{- end }}
        {{- if and (eq .Values.phorvex.servingSecurity.mode "legacy-plaintext") .Values.phorvex.servingSecurity.bindings }}{{ fail "legacy-plaintext does not accept servingSecurity.bindings" }}{{- end }}
        {{- if and .Values.phorvex.servingSecurity.bindings (not (has .Values.phorvex.actuator (list "native" "hybrid"))) }}{{ fail "servingSecurity.bindings require phorvex.actuator=native or hybrid" }}{{- end }}
        - --serving-security-mode={{ .Values.phorvex.servingSecurity.mode }}
        {{- if .Values.phorvex.servingSecurity.bindings }}
        - --serving-security-file={{ .Values.phorvex.servingSecurity.mountPath }}
        {{- end }}
        {{- if .Values.phorvex.mig.nodeExec.enabled }}
        {{- if not .Values.phorvex.mig.nodeExec.exclusiveMaintenance }}{{ fail "phorvex.mig.nodeExec.exclusiveMaintenance=true is required when enabling destructive MIG node exec" }}{{- end }}
        {{- $agentNS := required "phorvex.mig.nodeExec.namespace is required when enabled" .Values.phorvex.mig.nodeExec.namespace }}
        {{- $agentDS := required "phorvex.mig.nodeExec.daemonSetName is required when enabled" .Values.phorvex.mig.nodeExec.daemonSetName }}
        {{- $agentSA := required "phorvex.mig.nodeExec.serviceAccountName is required when enabled" .Values.phorvex.mig.nodeExec.serviceAccountName }}
        - --mig-node-exec=true
        - --mig-agent-namespace={{ $agentNS }}
        - --mig-agent-service-accounts={{ $agentSA }}
        - --mig-agent-daemonset={{ $agentDS }}
        - --mig-agent-gpu-container={{ .Values.phorvex.mig.nodeExec.gpuContainer }}
        - --mig-agent-helper-container={{ .Values.phorvex.mig.nodeExec.helperContainer }}
        - --mig-allocation-helper={{ .Values.phorvex.mig.nodeExec.allocationHelperPath }}
        - --mig-allocation-socket={{ printf "%s/kubelet.sock" (.Values.phorvex.mig.nodeExec.podResourcesMountPath | trimSuffix "/") }}
        - --mig-agent-exec-timeout={{ .Values.phorvex.mig.nodeExec.execTimeout }}
        - --mig-allocation-read-timeout={{ .Values.phorvex.mig.nodeExec.allocationReadTimeout }}
        - --mig-allocation-release-timeout={{ .Values.phorvex.mig.nodeExec.allocationReleaseTimeout }}
        - --mig-exclusive-maintenance=true
        {{- end }}
        - --gpu-envelope-max={{ .Values.phorvex.gpuEnvelopeMax }}
        {{- with .Values.phorvex.pcieClassCapacity }}
        - --pcie-class-table={{ toJson . }}
        {{- end }}
        {{- with .Values.phorvex.flowResidualClasses }}
        - --flow-residual-classes={{ join "," . }}
        {{- end }}
        {{- $detectors := .Values.phorvex.trustedDetectors | default list }}
        {{- if .Values.phorvex.e2eDetector.enabled }}
        {{- $detectors = append $detectors (printf "%s/%s-e2e-detector" .Release.Namespace (include "phorvex.fullname" .)) }}
        {{- end }}
        {{- with $detectors }}
        - --trusted-detectors={{ join "," . }}
        {{- end }}
        {{- if and .Values.phorvex.lossHistory.currentInventory.enabled (not .Values.phorvex.lossHistory.enabled) }}{{ fail "phorvex.lossHistory.currentInventory.enabled requires phorvex.lossHistory.enabled" }}{{- end }}
        {{- if .Values.phorvex.lossHistory.enabled }}
        {{- if not .Values.phorvex.admissionWebhook.enabled }}{{ fail "phorvex.lossHistory.enabled requires admissionWebhook.enabled" }}{{- end }}
        {{- $lossClaim := required "phorvex.lossHistory.existingClaim is required when enabled" .Values.phorvex.lossHistory.existingClaim }}
        {{- $lossObservers := .Values.phorvex.lossHistory.trustedObservers | default list }}
        {{- if .Values.phorvex.lossHistory.observer.enabled }}
        {{- $lossObserverName := printf "%s-loss-observer" (include "phorvex.fullname" .) | trunc 63 | trimSuffix "-" }}
        {{- $lossObservers = append $lossObservers (printf "%s/%s" .Release.Namespace $lossObserverName) }}
        {{- end }}
        {{- if eq (len $lossObservers) 0 }}{{ fail "phorvex.lossHistory.trustedObservers is required when enabled" }}{{- end }}
        - --loss-history-dir={{ .Values.phorvex.lossHistory.mountPath }}
        - --trusted-loss-observers={{ join "," $lossObservers }}
        {{- if .Values.phorvex.lossHistory.currentInventory.enabled }}
        {{- $currentObservers := .Values.phorvex.lossHistory.currentInventory.trustedObservers | default list }}
        {{- if .Values.phorvex.lossHistory.currentInventory.observer.enabled }}
        {{- $currentObserverName := printf "%s-current-inventory-observer" (include "phorvex.fullname" .) | trunc 63 | trimSuffix "-" }}
        {{- $currentObservers = append $currentObservers (printf "%s/%s" .Release.Namespace $currentObserverName) }}
        {{- end }}
        {{- if eq (len $currentObservers) 0 }}{{ fail "phorvex.lossHistory.currentInventory.trustedObservers is required when enabled" }}{{- end }}
        - --trusted-current-inventory-observers={{ join "," $currentObservers }}
        {{- end }}
        {{- end }}
        {{- if .Values.phorvex.audit.enabled }}
        {{- $auditMaxBytesText := toString .Values.phorvex.audit.maxBytes }}
        {{- if kindIs "float64" .Values.phorvex.audit.maxBytes }}
        {{- if or (lt .Values.phorvex.audit.maxBytes 0.0) (ne .Values.phorvex.audit.maxBytes (floor .Values.phorvex.audit.maxBytes)) (gt .Values.phorvex.audit.maxBytes 9007199254740991.0) }}
        {{- fail "phorvex.audit.maxBytes must be a non-negative whole number of bytes (quote values above 9007199254740991)" }}
        {{- end }}
        {{- $auditMaxBytesText = printf "%.0f" .Values.phorvex.audit.maxBytes }}
        {{- end }}
        {{- $auditMaxBackupsText := toString .Values.phorvex.audit.maxBackups }}
        {{- if kindIs "float64" .Values.phorvex.audit.maxBackups }}
        {{- if or (lt .Values.phorvex.audit.maxBackups 0.0) (ne .Values.phorvex.audit.maxBackups (floor .Values.phorvex.audit.maxBackups)) (gt .Values.phorvex.audit.maxBackups 9007199254740991.0) }}
        {{- fail "phorvex.audit.maxBackups must be a non-negative whole number (quote values above 9007199254740991)" }}
        {{- end }}
        {{- $auditMaxBackupsText = printf "%.0f" .Values.phorvex.audit.maxBackups }}
        {{- end }}
        {{- if not (regexMatch "^(0|[1-9][0-9]*)$" $auditMaxBytesText) }}
        {{- fail "phorvex.audit.maxBytes must be a non-negative whole number of bytes" }}
        {{- end }}
        {{- if not (regexMatch "^(0|[1-9][0-9]*)$" $auditMaxBackupsText) }}
        {{- fail "phorvex.audit.maxBackups must be a non-negative whole number" }}
        {{- end }}
        {{- if or (gt (len $auditMaxBytesText) 19) (and (eq (len $auditMaxBytesText) 19) (gt $auditMaxBytesText "9223372036854775807")) }}
        {{- fail "phorvex.audit.maxBytes must not exceed 9223372036854775807" }}
        {{- end }}
        {{- if or (gt (len $auditMaxBackupsText) 19) (and (eq (len $auditMaxBackupsText) 19) (gt $auditMaxBackupsText "9223372036854775807")) }}
        {{- fail "phorvex.audit.maxBackups must not exceed 9223372036854775807" }}
        {{- end }}
        {{- $auditMaxBytes := int64 $auditMaxBytesText }}
        {{- $auditMaxBackups := int64 $auditMaxBackupsText }}
        {{- if and (gt $auditMaxBytes 0) (eq $auditMaxBackups 0) }}
        {{- fail "phorvex.audit.maxBackups must be at least 1 when phorvex.audit.maxBytes is positive" }}
        {{- end }}
        - --audit-json={{ .Values.phorvex.audit.path }}
        - --audit-max-bytes={{ $auditMaxBytes }}
        - --audit-max-backups={{ $auditMaxBackups }}
        {{- if .Values.phorvex.console.enabled }}
        - --audit-source-addr=:{{ .Values.phorvex.console.auditTransport.port }}
        - --audit-source-cert=/etc/audit-server/tls.crt
        - --audit-source-key=/etc/audit-server/tls.key
        - --audit-source-ca=/etc/audit-server/ca.crt
        - --audit-source-client-dns={{ required "console.auditTransport.clientDNSName required" .Values.phorvex.console.auditTransport.clientDNSName }}
        {{- if .Values.phorvex.console.auditTransport.vclusterPath }}
        - --audit-source-vcluster-path={{ .Values.phorvex.console.auditTransport.vclusterPath }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.phorvex.globalKillSwitch }}
        - --global-kill-switch=true
        {{- end }}
        {{- with .Values.phorvex.extraArgs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PHORVEX_BRAIN_IMAGE
          value: "{{ .Values.phorvex.image.repository }}:{{ .Values.phorvex.image.tag }}"
        {{- if .Values.phorvex.actuator }}
        - name: PHORVEX_ACTUATOR
          value: {{ .Values.phorvex.actuator | quote }}
        {{- end }}
        {{- with .Values.phorvex.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        {{- if and .Values.phorvex.console.enabled .Values.phorvex.audit.enabled }}
        - name: audit-tls
          containerPort: {{ .Values.phorvex.console.auditTransport.port }}
        {{- end }}
        {{- if .Values.phorvex.admissionWebhook.enabled }}
        - name: webhook-server
          containerPort: {{ .Values.phorvex.admissionWebhook.port }}
          protocol: TCP
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          {{- toYaml .Values.phorvex.resources | nindent 10 }}
        {{- if or .Values.phorvex.epss.enabled .Values.phorvex.audit.enabled .Values.phorvex.calibration.enabled .Values.phorvex.admissionWebhook.enabled .Values.phorvex.loraCleanSources.content .Values.phorvex.mig.profiles.content .Values.phorvex.servingSecurity.bindings .Values.phorvex.lossHistory.enabled }}
        volumeMounts:
        {{- if .Values.phorvex.epss.enabled }}
        - name: epss
          mountPath: {{ .Values.phorvex.epss.mountPath }}
          readOnly: true
        {{- end }}
        {{- if .Values.phorvex.audit.enabled }}
        - name: audit
          mountPath: {{ .Values.phorvex.audit.path | dir }}
        {{- if .Values.phorvex.console.enabled }}
        - name: audit-server
          mountPath: /etc/audit-server
          readOnly: true
        {{- end }}
        {{- end }}
        {{- if .Values.phorvex.calibration.enabled }}
        - name: calibration-evidence
          mountPath: {{ .Values.phorvex.calibration.exportDir }}
        {{- end }}
        {{- if .Values.phorvex.admissionWebhook.enabled }}
        - name: webhook-cert
          mountPath: {{ .Values.phorvex.admissionWebhook.certDir }}
          readOnly: true
        {{- end }}
        {{- if .Values.phorvex.loraCleanSources.content }}
        - name: lora-clean-sources
          mountPath: {{ .Values.phorvex.loraCleanSources.mountPath }}
          subPath: sources.json
          readOnly: true
        {{- end }}
        {{- if .Values.phorvex.mig.profiles.content }}
        - name: mig-profiles
          mountPath: {{ .Values.phorvex.mig.profiles.mountPath }}
          subPath: profiles.json
          readOnly: true
        {{- end }}
        {{- if .Values.phorvex.servingSecurity.bindings }}
        - name: serving-security
          mountPath: {{ .Values.phorvex.servingSecurity.mountPath }}
          subPath: security.json
          readOnly: true
        {{- end }}
        {{- if .Values.phorvex.lossHistory.enabled }}
        - name: loss-history
          mountPath: {{ .Values.phorvex.lossHistory.mountPath }}
        {{- end }}
        {{- end }}
      {{- if or .Values.phorvex.epss.enabled .Values.phorvex.audit.enabled .Values.phorvex.calibration.enabled .Values.phorvex.admissionWebhook.enabled .Values.phorvex.loraCleanSources.content .Values.phorvex.mig.profiles.content .Values.phorvex.servingSecurity.bindings .Values.phorvex.lossHistory.enabled }}
      volumes:
      {{- if .Values.phorvex.epss.enabled }}
      - name: epss
        configMap:
          name: {{ .Values.phorvex.epss.configMapName }}
      {{- end }}
      {{- if .Values.phorvex.loraCleanSources.content }}
      - name: lora-clean-sources
        configMap:
          name: {{ include "phorvex.fullname" . }}-lora-clean-sources
          items:
          - key: sources.json
            path: sources.json
      {{- end }}
      {{- if .Values.phorvex.mig.profiles.content }}
      - name: mig-profiles
        configMap:
          name: {{ include "phorvex.fullname" . }}-mig-profiles
          items:
          - key: profiles.json
            path: profiles.json
      {{- end }}
      {{- if .Values.phorvex.audit.enabled }}
      - name: audit
        {{- if .Values.phorvex.audit.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "phorvex.fullname" . }}-audit
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- if .Values.phorvex.console.enabled }}
      - name: audit-server
        secret:
          secretName: {{ required "console.auditTransport.serverSecretName required" .Values.phorvex.console.auditTransport.serverSecretName }}
      {{- end }}
      {{- end }}
      {{- if .Values.phorvex.servingSecurity.bindings }}
      - name: serving-security
        configMap:
          name: {{ include "phorvex.fullname" . }}-serving-security
          items:
          - key: security.json
            path: security.json
      {{- end }}
      {{- if .Values.phorvex.lossHistory.enabled }}
      - name: loss-history
        persistentVolumeClaim:
          claimName: {{ .Values.phorvex.lossHistory.existingClaim }}
      {{- end }}
      {{- if .Values.phorvex.calibration.enabled }}
      - name: calibration-evidence
        emptyDir: {}
      {{- end }}
      {{- if .Values.phorvex.admissionWebhook.enabled }}
      - name: webhook-cert
        secret:
          secretName: {{ include "phorvex.fullname" . }}-webhook-cert
          defaultMode: 0440
      {{- end }}
      {{- end }}
      {{- with .Values.phorvex.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.phorvex.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.phorvex.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
