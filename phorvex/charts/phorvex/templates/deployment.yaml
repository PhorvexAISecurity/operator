apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "phorvex.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "phorvex.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "phorvex.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "phorvex.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
      containers:
      - name: manager
        image: "{{ .Values.phorvex.image.repository }}:{{ .Values.phorvex.image.tag }}"
        imagePullPolicy: {{ .Values.phorvex.image.pullPolicy }}
        args:
        - --base-interval={{ .Values.phorvex.baseInterval }}
        - --metrics-bind-address={{ .Values.phorvex.metricsBindAddress }}
        - --health-probe-bind-address={{ .Values.phorvex.healthProbeBindAddress }}
        - --leader-elect={{ .Values.phorvex.leaderElect }}
        {{- if .Values.phorvex.prometheusUrl }}
        - --prometheus-url={{ .Values.phorvex.prometheusUrl }}
        {{- end }}
        {{- if .Values.phorvex.epss.enabled }}
        - --epss-cache={{ printf "%s/%s" (.Values.phorvex.epss.mountPath | trimSuffix "/") .Values.phorvex.epss.fileName }}
        {{- end }}
        {{- if .Values.phorvex.operatorNamespace }}
        - --operator-namespace={{ .Values.phorvex.operatorNamespace }}
        {{- end }}
        - --gpu-envelope-max={{ .Values.phorvex.gpuEnvelopeMax }}
        {{- if .Values.phorvex.globalKillSwitch }}
        - --global-kill-switch=true
        {{- end }}
        {{- with .Values.phorvex.extraArgs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if .Values.phorvex.actuator }}
        - name: PHORVEX_ACTUATOR
          value: {{ .Values.phorvex.actuator | quote }}
        {{- end }}
        {{- with .Values.phorvex.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          {{- toYaml .Values.phorvex.resources | nindent 10 }}
        {{- if .Values.phorvex.epss.enabled }}
        volumeMounts:
        - name: epss
          mountPath: {{ .Values.phorvex.epss.mountPath }}
          readOnly: true
        {{- end }}
      {{- if .Values.phorvex.epss.enabled }}
      volumes:
      - name: epss
        configMap:
          name: {{ .Values.phorvex.epss.configMapName }}
      {{- end }}
      {{- with .Values.phorvex.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.phorvex.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.phorvex.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
