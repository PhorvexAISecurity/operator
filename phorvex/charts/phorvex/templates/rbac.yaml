apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "phorvex.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
---
# LEAST-PRIVILEGE ClusterRole (NFR4): read-only ingest of the K8s graph; write ONLY
# Phorvex's own CRDs + Phoenix SecurityEvent/AMTD + policy warning Events. NEVER writes pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "phorvex.fullname" . }}-manager-role
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
rules:
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations"]
  verbs: ["get", "list"]
{{- if .Values.phorvex.codeExecAdmission.enabled }}
- apiGroups: ["admissionregistration.k8s.io"]
  # M-6 runtime capability check: GET-by-resourceName ONLY of the two named code-exec admission
  # objects, so the operator can VERIFY (never modify) that its own deny-policy is in force before
  # it offers or dispatches an ephemeral-container injection. Read-only, scoped to exactly these two
  # object names; no list/watch (informer), no create/update/delete. This is NOT an injection grant.
  resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
  resourceNames: ["phorvex-codeexec-ephemeral"]
  verbs: ["get"]
{{- end }}
- apiGroups: [""]
  resources: ["pods", "namespaces", "nodes", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "clusterroles", "rolebindings", "clusterrolebindings"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["authorization.k8s.io"]
  # T1-E capability gate: the operator reviews its OWN permissions (SelfSubjectAccessReview,
  # "can I?") before offering an action, so an unpermitted move is excluded pre-scoring
  # (no-rbac) instead of ranked and failing at actuation. Creating a SelfSubjectAccessReview
  # grants no cluster power — it only asks the apiserver what this ServiceAccount may already do.
  resources: ["selfsubjectaccessreviews"]
  verbs: ["create"]
- apiGroups: ["amtd.r6security.com"]
  resources: ["securityevents"]
  {{- if .Values.phorvex.console.enabled }}
  # update/patch/delete are granted ONLY when the console shares this ServiceAccount by
  # running in this pod. Each backs one thing the console does:
  #   /api/workload/attack  `kubectl apply` a SecurityEvent — apply PATCHES when the object
  #                         already exists, and redteam-<ns> survives between runs
  #   action=clear          `kubectl delete securityevent` — without delete the signal can
  #                         be fired but never withdrawn, leaving the workload under attack
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- else }}
  verbs: ["get", "list", "watch", "create"]
  {{- end }}
{{- if .Values.phorvex.console.enabled }}
# ── console-only subresources ────────────────────────────────────────────────
# Deliberately gated. The operator alone never needs these, and pods/exec in particular
# is a real escalation — it is the difference between "reads the cluster graph" and "can
# run a command in any pod". They exist because the console is a container in this pod and
# a pod has exactly one ServiceAccount.
- apiGroups: [""]
  # attack_results.go reads the operator's own logs to measure the outcome of an attack.
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  # vllm_attack.go runs curl inside the vLLM pod to fire the KV-cache / poison signals.
  resources: ["pods/exec"]
  verbs: ["create"]
{{- end }}
- apiGroups: ["amtd.r6security.com"]
  resources: ["adaptivemovingtargetdefenses"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["phorvex.ai"]
  resources: ["phorvexpolicies"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["phorvex.ai"]
  resources: ["phorvexpolicies/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["phorvex.ai"]
  resources: ["phorvexpolicies/finalizers"]
  verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "phorvex.fullname" . }}-manager-rolebinding
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "phorvex.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "phorvex.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- range $namespace := .Values.phorvex.actuatorNamespaces }}
---
# Native/hybrid actuator routine permissions are always namespaced. Listing a tenant
# under phorvex.actuatorNamespaces opts that namespace into these bounded mutations.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "phorvex.fullname" $ }}-actuator-routine
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "phorvex.labels" $ | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete", "update"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create", "get", "list", "delete", "update"]
- apiGroups: ["apps"]
  resources: ["replicasets", "statefulsets", "daemonsets", "deployments"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["replicationcontrollers"]
  verbs: ["get"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "phorvex.fullname" $ }}-actuator-routine
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "phorvex.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "phorvex.fullname" $ }}-actuator-routine
subjects:
- kind: ServiceAccount
  name: {{ include "phorvex.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
