apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "phorvex.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
{{- /* In process the manager holds the actuation access below. With a remote
actuator it holds only the dispatcher's share (dispatcher-rbac.yaml). */}}
{{- if not .Values.phorvex.services.actuator.endpoint }}
---
# LEAST-PRIVILEGE ClusterRole (NFR4): read-only ingest of the K8s graph; write ONLY
# Phorvex's own CRDs + Phoenix SecurityEvent/AMTD + policy warning Events. NEVER writes pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "phorvex.fullname" . }}-manager-role
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
rules:
- apiGroups: ["apiextensions.k8s.io"]
  # M-158: uncached, read-only discovery of the installed policy action enum.
  resources: ["customresourcedefinitions"]
  resourceNames: ["phorvexpolicies.phorvex.ai"]
  verbs: ["get"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations"]
  verbs: ["get", "list"]
{{- if .Values.phorvex.codeExecAdmission.enabled }}
- apiGroups: ["admissionregistration.k8s.io"]
  # M-6 runtime capability check: GET-by-resourceName ONLY of the two named code-exec admission
  # objects, so the operator can VERIFY (never modify) that its own deny-policy is in force before
  # it offers or dispatches an ephemeral-container injection. Read-only, scoped to exactly these two
  # object names; no list/watch (informer), no create/update/delete. This is NOT an injection grant.
  resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
  resourceNames: ["phorvex-codeexec-ephemeral"]
  verbs: ["get"]
{{- end }}
{{- with .Values.phorvex.eventIdentityPolicy.external }}
- apiGroups: ["admissionregistration.k8s.io"]
  # M-94: GET-by-name of the creator-identity guard another release installs, so startup
  # can verify it is in force before any detector identity is trusted.
  resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
  resourceNames: [{{ . | quote }}]
  verbs: ["get"]
{{- end }}
- apiGroups: [""]
  resources: ["pods", "namespaces", "nodes", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
{{- if .Values.phorvex.statefulRotation.enabled }}
- apiGroups: ["snapshot.storage.k8s.io"]
  # Stateful rotation: GET-by-name of the VolumeSnapshotClass a StatefulSet's contract declares,
  # so snapshot-rotate is offered only where its rollback point can actually be taken.
  resources: ["volumesnapshotclasses"]
  verbs: ["get"]
{{- end }}
- apiGroups: [""]
  # Direct APIReader inventory of current ServiceAccount UID/creation identity
  # for the optional Pod-bound Kubernetes API-token projection. No informer is
  # started; missing permission or inventory grants no cover.
  resources: ["serviceaccounts"]
  verbs: ["list"]
- apiGroups: ["discovery.k8s.io"]
  # Read-only Service membership inventory for shared availability capacity.
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy"]
  # Planning observes all matching PDB status; the API eviction subresource is
  # still the final atomic disruption-budget authority.
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "clusterroles", "rolebindings", "clusterrolebindings"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["authorization.k8s.io"]
  # T1-E capability gate: the operator reviews its OWN permissions (SelfSubjectAccessReview,
  # "can I?") before offering an action, so an unpermitted move is excluded pre-scoring
  # (no-rbac) instead of ranked and failing at actuation. Creating a SelfSubjectAccessReview
  # grants no cluster power — it only asks the apiserver what this ServiceAccount may already do.
  resources: ["selfsubjectaccessreviews"]
  verbs: ["create"]
# Only the Phoenix route creates SecurityEvents and AMTDs (actuator/phoenix.go).
- apiGroups: ["amtd.r6security.com"]
  resources: ["securityevents"]
  verbs: ["get", "list", "watch"{{ if ne .Values.phorvex.actuator "native" }}, "create"{{ end }}]
- apiGroups: ["amtd.r6security.com"]
  resources: ["adaptivemovingtargetdefenses"]
  verbs: ["get", "list", "watch"{{ if ne .Values.phorvex.actuator "native" }}, "create", "update", "patch"{{ end }}]
- apiGroups: ["phorvex.ai"]
  resources: ["phorvexpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["phorvex.ai"]
  resources: ["phorvexpolicies/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["phorvex.ai"]
  resources: ["phorvexpolicies/finalizers"]
  verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "phorvex.fullname" . }}-manager-rolebinding
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "phorvex.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "phorvex.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# Protected operation receipts live only with the operator, outside tenant
# namespaces. Tenant credentials must not receive this Role or ConfigMap writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "phorvex.fullname" . }}-operation-journal
  namespace: {{ default .Release.Namespace .Values.phorvex.operatorNamespace }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "create", "update", "delete"]
{{- if and (eq .Values.phorvex.servingSecurity.mode "secure-required") (has .Values.phorvex.actuator (list "native" "hybrid")) }}
{{- range .Values.phorvex.servingSecurity.bindings }}
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [{{ required "servingSecurity binding secretName is required" .secretName | quote }}]
  verbs: ["get"]
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "phorvex.fullname" . }}-operation-journal
  namespace: {{ default .Release.Namespace .Values.phorvex.operatorNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "phorvex.fullname" . }}-operation-journal
subjects:
- kind: ServiceAccount
  name: {{ include "phorvex.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- range $namespace := .Values.phorvex.actuatorNamespaces }}
---
# Native/hybrid actuator routine permissions are always namespaced. Listing a tenant
# under phorvex.actuatorNamespaces opts that namespace into these bounded mutations.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "phorvex.fullname" $ }}-actuator-routine
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "phorvex.labels" $ | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  # request-drain and protected route/endpoint cutovers use resourceVersion-locked patches.
  verbs: ["get", "list", "delete", "update", "patch"]
- apiGroups: [""]
  resources: ["pods/eviction"]
  verbs: ["create"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create", "get", "list", "delete", "update"]
- apiGroups: ["apps"]
  resources: ["replicasets", "statefulsets", "daemonsets", "deployments"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["replicationcontrollers"]
  verbs: ["get"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "update"]
- apiGroups: ["discovery.k8s.io"]
  # request-drain and route/endpoint control-plane confirmation only; EndpointSlice mutation stays denied.
  resources: ["endpointslices"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "phorvex.fullname" $ }}-actuator-routine
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "phorvex.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "phorvex.fullname" $ }}-actuator-routine
subjects:
- kind: ServiceAccount
  name: {{ include "phorvex.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- if .Values.phorvex.outputPolicy.enabled }}
{{- $namespace := required "outputPolicy.targetNamespace is required" .Values.phorvex.outputPolicy.targetNamespace }}
{{- $name := required "outputPolicy.configMapName is required" .Values.phorvex.outputPolicy.configMapName }}
{{- if not (regexMatch "^phorvex-output-policy-[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $name) }}{{- fail "outputPolicy.configMapName must name the exact fixture policy" }}{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "phorvex.fullname" . }}-output-policy-activation
  namespace: {{ $namespace | quote }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: [{{ $name | quote }}]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "phorvex.fullname" . }}-output-policy-activation
  namespace: {{ $namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "phorvex.fullname" . }}-output-policy-activation
subjects:
- kind: ServiceAccount
  name: {{ include "phorvex.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.phorvex.litellmClientRevoke.enabled }}
{{- if not (has .Values.phorvex.actuator (list "native" "hybrid")) }}{{- fail "litellmClientRevoke requires native or hybrid actuator" }}{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "phorvex.fullname" . }}-litellm-client-revoke
  namespace: litellm
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["phorvex-litellm-client-policy"]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "phorvex.fullname" . }}-litellm-client-revoke
  namespace: litellm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "phorvex.fullname" . }}-litellm-client-revoke
subjects:
- kind: ServiceAccount
  name: {{ include "phorvex.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.phorvex.statefulRotation.enabled }}
{{- if not (has .Values.phorvex.actuator (list "native" "hybrid")) }}{{- fail "statefulRotation requires native or hybrid actuator" }}{{- end }}
{{- range $namespace := .Values.phorvex.actuatorNamespaces }}
---
# Stateful rotation: replica-rebuild releases one member's claims (UID-preconditioned delete;
# pvc-protection keeps them attached until the member's Eviction); snapshot-rotate takes the
# pre-rotation VolumeSnapshots. Claims and snapshots are read for admission and confirmation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "phorvex.fullname" $ }}-stateful-rotation
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "phorvex.labels" $ | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "delete"]
- apiGroups: ["snapshot.storage.k8s.io"]
  resources: ["volumesnapshots"]
  verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "phorvex.fullname" $ }}-stateful-rotation
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "phorvex.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "phorvex.fullname" $ }}-stateful-rotation
subjects:
- kind: ServiceAccount
  name: {{ include "phorvex.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- if .Values.phorvex.crmRefundRevoke.enabled }}
{{- if not (has .Values.phorvex.actuator (list "native" "hybrid")) }}{{- fail "crmRefundRevoke requires native or hybrid actuator" }}{{- end }}
---
# crm-refund-revoke may CAS only the mini-CRM deny-guard ConfigMap. Its Pod,
# Service and EndpointSlice reads are covered by the existing read-only grants.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "phorvex.fullname" . }}-crm-refund-revoke
  namespace: crm
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["crm-refund-guard"]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "phorvex.fullname" . }}-crm-refund-revoke
  namespace: crm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "phorvex.fullname" . }}-crm-refund-revoke
subjects:
- kind: ServiceAccount
  name: {{ include "phorvex.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.phorvex.endpointLease.enabled }}
{{- if not (has .Values.phorvex.actuator (list "native" "hybrid")) }}{{- fail "endpointLease requires native or hybrid actuator" }}{{- end }}
---
# The lease action may CAS only its named tenant policy. Its graph reads are
# additive to the existing read-only Pod and EndpointSlice inventory grants.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "phorvex.fullname" . }}-endpoint-lease
  namespace: vllm
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["phorvex-endpoint-lease-policy"]
  verbs: ["get", "update"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["guardrail-proxy"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["services"]
  resourceNames: ["vllm"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["vllm"]
  verbs: ["get"]
- apiGroups: ["apps"]
  # ReplicaSet names vary by rollout; ownership validation only uses GET.
  resources: ["replicasets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "phorvex.fullname" . }}-endpoint-lease
  namespace: vllm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "phorvex.fullname" . }}-endpoint-lease
subjects:
- kind: ServiceAccount
  name: {{ include "phorvex.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# The protected journal is preinstalled and may only be CAS-updated here.
# The legacy operation-journal role remains unchanged for other actions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "phorvex.fullname" . }}-endpoint-lease-journal
  namespace: {{ default .Release.Namespace .Values.phorvex.operatorNamespace }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["phorvex-endpoint-lease-journal"]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "phorvex.fullname" . }}-endpoint-lease-journal
  namespace: {{ default .Release.Namespace .Values.phorvex.operatorNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "phorvex.fullname" . }}-endpoint-lease-journal
subjects:
- kind: ServiceAccount
  name: {{ include "phorvex.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.phorvex.voiceMemory.enabled }}
{{- if not (has .Values.phorvex.actuator (list "native" "hybrid")) }}{{- fail "voiceMemory requires native or hybrid actuator" }}{{- end }}
---
