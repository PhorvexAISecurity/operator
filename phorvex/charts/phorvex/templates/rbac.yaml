apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "phorvex.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
---
# LEAST-PRIVILEGE ClusterRole (NFR4): read-only ingest of the K8s graph; write ONLY
# Phorvex's own CRDs + Phoenix SecurityEvent/AMTD + policy warning Events. NEVER writes pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "phorvex.fullname" . }}-manager-role
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
rules:
- apiGroups: ["apiextensions.k8s.io"]
  # M-158: uncached, read-only discovery of the installed policy action enum.
  resources: ["customresourcedefinitions"]
  resourceNames: ["phorvexpolicies.phorvex.ai"]
  verbs: ["get"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations"]
  verbs: ["get", "list"]
{{- if .Values.phorvex.codeExecAdmission.enabled }}
- apiGroups: ["admissionregistration.k8s.io"]
  # M-6 runtime capability check: GET-by-resourceName ONLY of the two named code-exec admission
  # objects, so the operator can VERIFY (never modify) that its own deny-policy is in force before
  # it offers or dispatches an ephemeral-container injection. Read-only, scoped to exactly these two
  # object names; no list/watch (informer), no create/update/delete. This is NOT an injection grant.
  resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
  resourceNames: ["phorvex-codeexec-ephemeral"]
  verbs: ["get"]
{{- end }}
- apiGroups: [""]
  resources: ["pods", "namespaces", "nodes", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  # Read-only Service membership inventory for shared availability capacity.
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "clusterroles", "rolebindings", "clusterrolebindings"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["authorization.k8s.io"]
  # T1-E capability gate: the operator reviews its OWN permissions (SelfSubjectAccessReview,
  # "can I?") before offering an action, so an unpermitted move is excluded pre-scoring
  # (no-rbac) instead of ranked and failing at actuation. Creating a SelfSubjectAccessReview
  # grants no cluster power — it only asks the apiserver what this ServiceAccount may already do.
  resources: ["selfsubjectaccessreviews"]
  verbs: ["create"]
- apiGroups: ["amtd.r6security.com"]
  resources: ["securityevents"]
  verbs: ["get", "list", "watch", "create"]
- apiGroups: ["amtd.r6security.com"]
  resources: ["adaptivemovingtargetdefenses"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["phorvex.ai"]
  resources: ["phorvexpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["phorvex.ai"]
  resources: ["phorvexpolicies/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["phorvex.ai"]
  resources: ["phorvexpolicies/finalizers"]
  verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "phorvex.fullname" . }}-manager-rolebinding
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "phorvex.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "phorvex.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# Protected operation receipts live only with the operator, outside tenant
# namespaces. Tenant credentials must not receive this Role or ConfigMap writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "phorvex.fullname" . }}-operation-journal
  namespace: {{ default .Release.Namespace .Values.phorvex.operatorNamespace }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "create", "update", "delete"]
{{- if and (eq .Values.phorvex.servingSecurity.mode "secure-required") (has .Values.phorvex.actuator (list "native" "hybrid")) }}
{{- range .Values.phorvex.servingSecurity.bindings }}
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [{{ required "servingSecurity binding secretName is required" .secretName | quote }}]
  verbs: ["get"]
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "phorvex.fullname" . }}-operation-journal
  namespace: {{ default .Release.Namespace .Values.phorvex.operatorNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "phorvex.fullname" . }}-operation-journal
subjects:
- kind: ServiceAccount
  name: {{ include "phorvex.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- range $namespace := .Values.phorvex.actuatorNamespaces }}
---
# Native/hybrid actuator routine permissions are always namespaced. Listing a tenant
# under phorvex.actuatorNamespaces opts that namespace into these bounded mutations.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "phorvex.fullname" $ }}-actuator-routine
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "phorvex.labels" $ | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  # request-drain and protected route/endpoint cutovers use resourceVersion-locked patches.
  verbs: ["get", "list", "delete", "update", "patch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create", "get", "list", "delete", "update"]
- apiGroups: ["apps"]
  resources: ["replicasets", "statefulsets", "daemonsets", "deployments"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["replicationcontrollers"]
  verbs: ["get"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "update"]
- apiGroups: ["discovery.k8s.io"]
  # request-drain and route/endpoint control-plane confirmation only; EndpointSlice mutation stays denied.
  resources: ["endpointslices"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "phorvex.fullname" $ }}-actuator-routine
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "phorvex.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "phorvex.fullname" $ }}-actuator-routine
subjects:
- kind: ServiceAccount
  name: {{ include "phorvex.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
