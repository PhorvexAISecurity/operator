{{- if and .Values.phorvex.mig.profiles.content (not .Values.phorvex.services.actuator.endpoint) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "phorvex.fullname" . }}-mig-profiles
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
data:
  profiles.json: |
{{ .Values.phorvex.mig.profiles.content | indent 4 }}
{{- end }}
