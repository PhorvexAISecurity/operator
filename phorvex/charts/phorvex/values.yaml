phorvex:
  # Empty uses the release-scoped manager name. A non-empty value names the manager
  # ServiceAccount that this chart creates and binds to the Deployment and all chart Roles.
  # The optional code-exec admission contract has one fixed, independently verified manager
  # identity; custom names require codeExecAdmission.enabled=false (see that setting below).
  serviceAccountName: ""
  image:
    repository: phorvex/phorvex
    pullPolicy: IfNotPresent
    tag: "0.1.0-p0"
    # CI-maintained published immutable release authority; never derived from a live tag.
    # Once set, every pod that runs this image pulls it by this digest.
    releaseDigest: ""
    releaseSourceSHA: ""
  litellmClientRevoke:
    enabled: false
    statusSecret: ""
  # Exact get/update grant on the crm-refund-guard ConfigMap for crm-refund-revoke.
  # Enable BEFORE any policy enables the action, or startup preflight refuses to start.
  crmRefundRevoke:
    enabled: false
  # Exact get/update grant on the agent-deny-guard ConfigMap per enabled namespace
  # for agent-action-deny (the namespace-parametric analog of crm-refund-revoke).
  # Enable BEFORE any policy enables the action, or startup preflight refuses to start.
  agentActionDeny:
    enabled: false
  litellmOutput:
    enabled: false
  # Base tick interval for the decision loop (per-tenant cadence honored on top).
  baseInterval: 10s
  # Consecutive unsupported observations before ActionsSupported becomes False.
  # Three policy ticks exceeds a normal single-pod restart while still surfacing drift promptly.
  actionsSupportedDebounce: 3
  # Cluster-specific scale calibration. Shadow-only: values are exported and monitored,
  # while production scoring continues to use the shipped constants until review.
  calibration:
    enabled: true
    sampleInterval: 5m
    refreshInterval: 30m
    lookback: 168h
    exportDir: /var/run/phorvex-calibration
  # Prometheus base URL for telemetry ingest. Empty => K8s-only signals (no
  # fabricated metrics).
  prometheusUrl: ""
  # Normalized GPU reload/warm-up envelope. 0.2925 is the observed worst case on
  # the production EKS Tesla T4 fleet: 117s time-to-Ready / 400s documented scale.
  gpuEnvelopeMax: 0.2925
  # PCIe link capacity used to normalize the DCGM RX+TX byte-rate into LinkBandwidth
  # (M-114). The denominator is DISCOVERED, never chosen: (1) the device's negotiated link
  # from DCGM_FI_DEV_PCIE_LINK_GEN/_WIDTH when the exporter publishes them; (2) otherwise
  # this table, keyed by the exporter's own `modelName` label (gen = PCIe generation,
  # width = lanes; capacity = 2 × width × PCI-SIG per-lane rate); (3) otherwise the signal
  # is absent — never a borrowed number. Merged over the shipped default (Tesla T4 = Gen3 x16,
  # NVIDIA T4 datasheet); add classes for other devices, e.g. "NVIDIA A100-SXM4-40GB": {gen: 4, width: 16}.
  pcieClassCapacity:
    "Tesla T4": {gen: 3, width: 16}
  # Workload classes (namespaces) whose Little's-law flow residual is ACTIVATED (M-115).
  # The per-class verdict belongs to the math ruling, not to telemetry availability: as of
  # 2026-09-06 MATH ruled every class ABSENT (vllm included) until the in-system count is
  # validated at low load, so this list is empty and the component is recorded absent with
  # reason class-not-activated, entering no aggregate and no fact.
  flowResidualClasses: []
  # Detector identities whose SecurityEvents may supply belief evidence (M-94). The check is
  # made against the AUTHENTICATED creator that the admission stamp records, never against the
  # self-declared spec.rule.source — that string is written by whoever created the event.
  # Accepted spellings: "namespace/serviceaccount", "namespace:serviceaccount", or a full
  # "system:serviceaccount:ns:name". An EMPTY list trusts no external detector (fail-closed):
  # events are still ingested and recorded, they simply carry no evidence.
  # The defaults below are the identities that actually hold securityevents-create on the
  # EKS fleet (discovered 2026-09-06 from the bound ClusterRoles); replace them for your fleet.
  trustedDetectors:
    - vllm/detector-kv-canary
    - vllm/detector-adapter-inv
    - phorvex-system/operator-controller-manager
  # The ServiceAccount (namespace/name) the workload live arms create their SecurityEvents
  # as. Empty is the console of the release named phorvex in phorvex-system; any other
  # environment names its own. Every service and the console must agree.
  injectorIdentity: ""
  # Opt-in M100 synthetic completed-disclosure history. This authority is
  # independent of trustedDetectors. Durable history requires an operator-owned
  # existing PVC whose mount root is writable by UID/GID 65532 and inaccessible
  # to other users; the chart does not silently use ephemeral storage.
  lossHistory:
    enabled: false
    mountPath: /var/lib/phorvex-loss-history
    existingClaim: ""
    trustedObservers: []
    observer:
      enabled: false
      targetNamespace: ""
      targetName: ""
      targetUID: ""
      policyNamespace: ""
      policyName: ""
      canaryURL: ""
      serverName: ""
      caSecretName: ""
      clientSecretName: ""
      protectedAsset: ""
      protectedVersion: ""
      protectedProperty: confidentiality
      evidenceID: ""
      ruleVersion: ""
      ruleSHA256: ""
      expectedBytes: 0
      expectedSHA256: ""
      timeout: 10s
    # Independent, expiring synthetic current-version inventory. Enabling it
    # also requires this loss-history ledger so the runner can distinguish
    # at-risk from already-lost without guessing across a history outage.
    currentInventory:
      enabled: false
      trustedObservers: []
      observer:
        enabled: false
        targetNamespace: ""
        targetName: ""
        targetUID: ""
        policyNamespace: ""
        policyName: ""
        manifestURL: ""
        serverName: ""
        caSecretName: ""
        clientSecretName: ""
        configMapName: ""
        configMapKey: ""
        volumeName: ""
        containerName: ""
        mountPath: ""
        projectedPath: ""
        protectedAsset: ""
        protectedVersion: ""
        protectedProperty: confidentiality
        evidenceID: ""
        ruleSHA256: ""
        ttl: 1m
        timeout: 10s
  # M-94 server-side guard that makes the stamp above worth trusting: a
  # ValidatingAdmissionPolicy + Deny binding requiring that any phorvex.ai/creator-identity
  # annotation on a SecurityEvent CREATE/UPDATE equals the authenticated requester. It is
  # evaluated in-process by the API server, so — unlike the mutating stamp webhook, which is
  # failurePolicy=Ignore so it can never block the cluster's event flow — it has no endpoint
  # that can be down. Without it, a client-supplied creator survives any stamp-webhook outage
  # and forges an allowlisted detector.
  # ON by default and required for `trustedDetectors` to mean anything: rendering with this
  # disabled and a non-empty allowlist is rejected. Needs Kubernetes >=1.30 (stable
  # admissionregistration.k8s.io/v1 ValidatingAdmissionPolicy); on an older cluster the render
  # fails loudly rather than quietly dropping the guard.
  # An event with NO creator annotation is still admitted — it is simply untrusted at ingest.
  # It does not retroactively authenticate SecurityEvents that already exist.
  # Scraping and the services dashboard (deploy/environments/README.md). One
  # environment file sets them for every chart.
  metrics:
    podMonitor:
      enabled: false
      interval: 30s
      # Added to every series as environment=<value>.
      environment: ""
      # prometheus-operator metricRelabelings, applied to every series scraped.
      metricRelabelings: []
    # A Grafana dashboard of these services, filtered on podMonitor.environment.
    dashboard:
      enabled: false
    # Alert rules for these services, filtered on podMonitor.environment, at severity
    # info: they show in Prometheus and Grafana, and page no one.
    rules:
      enabled: false
  eventIdentityPolicy:
    enabled: true
    # The guard another release on the cluster installs, by its ValidatingAdmissionPolicy
    # name, where this release installs none (enabled: false) beside a production stack
    # that does. The manager and the sensor refuse to start unless it is in force with a
    # Deny binding of the same name (eventtrust.CheckIdentityPolicy), and trustedDetectors
    # may then be non-empty.
    external: ""
  # Opt-in live E2E identity. Admission confines its events to one test namespace;
  # the console/operator identity is NOT added to the detector allowlist.
  e2eDetector:
    enabled: false
    targetNamespace: ""
  # Engage the global actuation kill-switch at startup (FR8). Can also be toggled at
  # runtime via the phorvex-killswitch ConfigMap.
  globalKillSwitch: false
  # Optional Prometheus Operator rules for kill-switch observability.
  alerts:
    enabled: false
    disagreementFor: 2m
    restartWindow: 10m
    restartThreshold: 3
    restartFor: 2m
    additionalLabels: {}
  # The PHVX-9b fail-conservative NaN-cost alert is independently switchable so
  # enabling it does not silently activate unrelated alert policies.
  costNaNAlert:
    enabled: false
  # Leader election for HA (single active controller).
  leaderElect: true
  # Fail-closed CREATE/UPDATE admission for cross-field PhorvexPolicy invariants.
  # The chart generates and retains one self-signed serving certificate per release;
  # single-field ranges and duration syntax are enforced independently by CRD CEL.
  admissionWebhook:
    enabled: true
    port: 9443
    certDir: /tmp/k8s-webhook-server/serving-certs
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  # Namespace the operator treats as its own (where it looks for the killswitch ConfigMap
  # and its leader-election lease). Empty => the operator's own POD_NAMESPACE.
  operatorNamespace: ""
  # The namespaces whose PhorvexPolicies this release reconciles, ticks and
  # authorizes; empty = every namespace. A second release on the same cluster, such
  # as a staging environment, lists only its own (--policy-namespaces).
  policyNamespaces: []
  # Hard safety bound shared by every policy and actuator route in a namespace.
  # Existing and pending quarantine UIDs consume the same protected capacity. Zero
  # disables new quarantine; values above 128 are rejected at render and startup.
  maxRetainedQuarantinesPerNamespace: 1
  # Actuator backend. Accepted values are exactly: phoenix, native, hybrid.
  #   phoenix - drives UNMODIFIED Phoenix through SecurityEvent/AMTD CRs
  #   native  - Phorvex's own client-go hands (no Phoenix CRDs)
  #   hybrid  - native for policy-bounded rotate and AI-native moves; Phoenix for quarantine
  # The default/unset phoenix backend refuses rotate because Phoenix Delete cannot carry
  # budget.maxGracePeriodSeconds. Select native or hybrid and grant actuatorNamespaces
  # to migrate policies that require bounded rotation.
  # EMPTY (the default here) renders NO PHORVEX_ACTUATOR env var at all, so the operator
  # binary applies its own documented default, phoenix. That is the only way to get the
  # default: any NON-empty value is matched EXACTLY by the binary — no trimming, no case
  # folding — and anything else (a typo, padding, "Native") fails startup with the accepted
  # set rather than silently falling back to phoenix (M-21). Surfaced here because the
  # difference is visible in the audit (A01–A04 assert on what actually touched the
  # cluster), so it must be part of desired state rather than a hand-patched env var.
  # The per-action repertoire of each backend is published in phorvex/docs/actuator-repertoire.md.
  actuator: ""
  # The services the manager reaches over gRPC (ADR-0001), each deployed by its own
  # chart under deploy/charts. An empty endpoint runs that part in this process.
  # With a remote actuator, the actuator holds the actuation access and reads the
  # actuator's files and credentials; this chart then binds the manager only to the
  # dispatcher's share of the access (phorvex-common) and mounts none of them.
  services:
    brain:
      endpoint: ""
    sensor:
      endpoint: ""
    actuator:
      endpoint: ""
    # The attacks service (deploy/charts/phorvex-attacks, docs/services/attacks.md). Set,
    # the console forwards the attack routes to it, and its account holds the attack
    # grants and injects the workload live arms' events.
    attacks:
      endpoint: ""
  # Mutual TLS between the dispatcher and the brain, sensor and actuator services
  # (ADR-0001, docs/services/service-tls.md). On, every chart mounts its end's
  # Secret, <release>-<end>-grpc-tls, which deploy/eks/provision-service-mtls.sh
  # writes; the services admit only the dispatcher's certificate. Off, gRPC is
  # plaintext.
  serviceTLS:
    enabled: false
  # Optional, reporting-only scoped outcome observation. Enabling this mounts
  # one immutable startup config Secret, a separate mTLS Secret, and a
  # dedicated existing PVC for private evidence. The startup.json contents
  # retain the exact policy/workload/session preregistration and capacity.
  scopedOutcome:
    enabled: false
    configSecretName: ""
    tlsSecretName: ""
    existingClaim: ""
    configMountPath: /etc/phorvex-scoped-outcome/config
    tlsMountPath: /etc/phorvex-scoped-outcome/tls
    evidenceMountPath: /var/lib/phorvex-scoped-outcome
  # Managed tenant namespaces where the native/hybrid actuator may perform routine
  # namespaced mutations. Empty by default: the chart adds no workload-write privilege.
  # Each entry renders a namespaced Role/RoleBinding for pods, NetworkPolicies,
  # ReplicaSets and Services. Service access is exactly get/update so route-rotate and
  # endpoint-rotate can restitch selectors; Secrets and EndpointSlice mutation remain denied.
  # request-drain receives namespaced EndpointSlice list only to confirm withdrawal/return.
  actuatorNamespaces: []
  # Opt-in exact Voice memory note quarantine. Requires the reviewed Voice
  # policy ConfigMap and private state-token Secret in namespace voice.
  voiceMemory:
    enabled: false
  # Opt-in exact asserted-caller/order refund pair denial in the Voice app.
  voiceRefund:
    enabled: false
  # Opt-in Voice MCP descriptor pinning requires a reviewed immutable MCP image.
  voiceAdmission:
    enabled: false
    sourceConfigMapName: ""
    legacyConfigMapName: ""
  voiceMCP:
    enabled: false
    approvedImage: ""
  # Default-off endpoint lease revocation requires an independently reviewed
  # combined proxy source digest; never derive this authority from an event.
  endpointLease:
    enabled: false
    approvedSourceSHA256: ""
    approvedProxyImage: ""
    approvedEngineImage: ""
  voiceOutput:
    enabled: false
  # Opt-in exact response-field policy mutation; Kubernetes RBAC grants update
  # only to this one preinstalled ConfigMap in the named fixture namespace.
  outputPolicy:
    enabled: false
    targetNamespace: ""
    configMapName: ""
  # Operator-administered exact namespace+adapter reload mappings. Empty disables
  # adapter reload and mounts nothing. Changes take effect after manager restart.
  loraCleanSources:
    content: ""
    mountPath: /etc/phorvex-adapters/sources.json
  # Serving control is HTTPS with a scoped operator-owned Secret by default. Each
  # binding is exact for one policy UID and workload ServiceAccount. The referenced
  # Secret lives in operatorNamespace (or the release namespace when empty) and must
  # contain the configured bearer and CA keys. `legacy-plaintext` is an explicit,
  # visibly insecure migration mode and does not satisfy the secure contract.
  servingSecurity:
    mode: secure-required
    mountPath: /etc/phorvex-serving/security.json
    # Example (values must match current API-assigned policy UID and workload SA):
    # bindings:
    #   - namespace: tenant-a
    #     policyName: models
    #     policyUID: 9e7354cc-5b97-42f4-982d-8c531f03cf15
    #     serviceAccount: model-runtime
    #     profileID: models-admin-v1
    #     secretName: models-serving-admin # Secret in operatorNamespace/release namespace
    #     bearerKey: bearer
    #     caKey: ca.crt
    #     serverName: models-admin.tenant-a.svc
    bindings: []
  # Destructive MIG repartition is disabled unless both an operator-owned exact
  # profile map and the trusted two-container node agent are explicitly enabled.
  mig:
    profiles:
      content: ""
      mountPath: /etc/phorvex-mig/profiles.json
    nodeExec:
      enabled: false
      # Explicit acknowledgement that an external scheduler/maintenance process
      # prevents new allocations during the bounded repartition operation.
      exclusiveMaintenance: false
      namespace: ""
      daemonSetName: ""
      serviceAccountName: ""
      gpuContainer: gpu-tools
      helperContainer: allocation-helper
      gpuImage:
        repository: "" # DevOps supplies and pins a vendor image containing nvidia-smi.
        digest: "" # Required sha256 digest; the chart renders repository@digest.
        pullPolicy: IfNotPresent
      gpuCommand: [] # Long-running argv supplied for the selected vendor image.
      runtimeClassName: ""
      allocationHelperPath: /phorvex-mig-allocation-helper
      podResourcesHostPath: /var/lib/kubelet/pod-resources
      podResourcesMountPath: /var/lib/kubelet/pod-resources
      execTimeout: 5s
      allocationReadTimeout: 3s
      allocationReleaseTimeout: 45s
      nodeSelector: {}
      tolerations: []
  # M-6 code-exec admission protection. OFF by default: enabling it renders the installer-owned
  # ValidatingAdmissionPolicy + Binding (phorvex-codeexec-ephemeral) that DENIES any
  # pods/ephemeralcontainers UPDATE in a managed namespace unless it exactly matches the approved
  # profile, plus the minimal resourceName-scoped `get` the operator's runtime verifier needs to
  # confirm the policy is in force before offering/dispatching debugger/custom-inject. This grants
  # NO injection permission (the ephemeralcontainers write Role stays unbound — a separate,
  # human-gated step) and labels no namespace: an admin opts a namespace in with
  # `kubectl label ns <ns> phorvex.ai/codeexec-managed=true`. Deny-only, so it is safe to enable
  # ahead of any execution grant, and required to be verified BEFORE one. This installer-owned
  # singleton contract trusts exactly system:serviceaccount:phorvex-system:phorvex-phorvex-manager,
  # matching the runtime's embedded full-policy verifier. Enabling it is rejected whenever the
  # resulting namespace/ServiceAccount identity differs from that exact canonical identity; an
  # alternate release name is supported when it explicitly selects the canonical ServiceAccount.
  # Custom manager identities remain supported while this optional admission feature is disabled.
  codeExecAdmission:
    enabled: false
  # EPSS exploit-probability cache. The operator reads it from a file so a scored CVE feed
  # can be refreshed without a rebuild; the file arrives as a ConfigMap.
  epss:
    enabled: false
    configMapName: phorvex-epss
    mountPath: /etc/phorvex
    fileName: epss-cache.json
    # When enabled, cache bytes are neutral-unavailable until the mounted metadata
    # and current ConfigMap API object match exactly.
    authoritative: false
    metadataFileName: epss-metadata.json
    authoritativeTimeout: 5s
    # Projected ConfigMaps update asynchronously. Every operator replica re-reads
    # the mounted file and retains its last-known-good cache on a bad update.
    refreshInterval: 30s
    # Create the ConfigMap from `data` below, rather than expecting it to already exist.
    # The Deployment mounts it, so a missing ConfigMap means the pod never starts — which
    # makes it a startup dependency, and a startup dependency that exists only as a
    # hand-applied object is a cluster that cannot be rebuilt from git.
    # Set false when an external pipeline owns the ConfigMap instead.
    create: false
    data: ""
    # Automated running-image inventory -> Trivy -> FIRST EPSS -> ConfigMap refresh.
    # It uses a dedicated ServiceAccount with pod-list plus get/update on only the
    # named ConfigMap. `apply: false` performs the full job as a safe dry-run.
    feed:
      enabled: false
      schedule: "17 3 * * *"
      suspend: false
      apply: false
      allowPartial: false
      # Both lists must be configured together. Digests must be exact lowercase
      # repository@sha256 references; scoped apply preserves all other cache keys.
      scopeNamespaces: []
      scopeDigests: []
      metadataTTL: 26h
      firstURL: https://api.first.org/data/v1/epss
      trivyPath: /tools/trivy
      trivy:
        image:
          repository: aquasec/trivy
          tag: "0.65.0"
          pullPolicy: IfNotPresent
      # Optional caller-provisioned, short-lived Docker config for exact private
      # ECR hosts. The Secret is projected read-only; the feed never reads Secrets
      # through the Kubernetes API or generates registry credentials.
      registryAuth:
        enabled: false
        # Existing caller-provisioned Secret mode remains the default.
        mode: secret
        secretName: ""
        secretKey: config.json
        registries: []
        # Explicit opt-in only after IAM apply and merged helper publication.
        # No active role/image pin is supplied by this support-only change.
        irsaInit:
          enabled: false
          image: ""  # full existing-repository image@sha256 digest
          roleARN: ""
          region: us-east-2
      scanTimeout: 10m
      activeDeadlineSeconds: 3600
      serviceAccount:
        annotations: {}
      imagePullSecrets: []
      extraEnv: []
      # No CPU/memory limits: phorvex-system pods run unthrottled (2026-10-13).
      resources:
        requests: { cpu: 100m, memory: 256Mi }
      nodeSelector: {}
      tolerations: []
      affinity: {}
  # Write the decision audit to a JSONL file. The console streams /api/live from a FILE,
  # so without this there is nothing live to stream — which is why the in-cluster console
  # could only ever serve the stale snapshot baked into its image.
  audit:
    enabled: false
    path: /audit/live.jsonl
    # Opt-in accidental-outage guard: reject other Pods mounting this release's
    # RWO audit PVC. Requires Kubernetes >=1.30 and audit.persistence.enabled.
    # This checks Deployment pod shape, not authenticated controller identity.
    volumeGuard:
      enabled: false
    # 0 = unbounded. Otherwise this is a target segment size; whole records can
    # exceed it. Nominal budget = maxBytes * (maxBackups + 1).
    maxBytes: 536870912
    maxBackups: 4
    persistence:
      # A PVC rather than an emptyDir so the decision history survives a restart. The
      # volume is shared between the operator and the console container INSIDE ONE POD,
      # so ReadWriteOnce is sufficient and no EFS/RWX filesystem is needed.
      enabled: true
      storageClass: ""
      size: 5Gi

  # Math Lab decision capture (observation-only). Allowlisted policies' decision ticks are
  # recorded as replayable snapshots on the audit volume and relayed read-only through the
  # console for offline parameter replay. Empty records nothing. Requires audit.enabled.
  mathLab:
    capturePolicies: []      # e.g. ["vllm/vllm-defense"]
    captureDir: /audit/math-lab
    captureMaxBytes: 1073741824

  # Run the console as a second container in this pod.
  #
  # They are co-located because the console reads the audit as a local file and the
  # operator writes it as a local file. Two Deployments cannot share a ReadWriteOnce
  # volume, and the alternative — an RWX filesystem — means provisioning EFS for what is
  # one file on one node. Co-location is also what already works on the jump host.
  #
  # The cost is a shared lifecycle: the console restarts whenever the operator does.
  console:
    enabled: false
    # Its own chart deploys the console (deploy/charts/phorvex-console,
    # docs/services/console.md), with its own Application and version; this chart
    # then renders none of the console's objects. Off, this chart renders them.
    separate: false
    allowWorkloadMutations: false
    # With the attacks service remote (services.attacks.endpoint): the namespaces it may
    # exec into and change, and where it and the console may edit policies. Empty is
    # every namespace, as the console had.
    attackNamespaces: []
    # The console's own Service and Ingress, for an environment that exposes it outside
    # the production stack's dashboard. The Service serves port 80.
    ingress:
      enabled: false
      className: ""
      host: ""
      annotations: {}
    # Live attack ids (namespace/id, or */id) with no actuator wired end to end. Retired rows
    # show in the catalogue as not-armed with a clear reason, and the fire handlers refuse them.
    liveAttackDisabled: []
    # Extra read grants for the fixed synthetic vLLM comparison. The shipped
    # harness profile also requires exact reviewed pins before launch.
    guardrailStatic:
      enabled: false
      configMapName: ""
      profileSHA256: ""
      sourceConfigMap: guardrail-proxy
      guardrailJournalName: ""
      kvJournalName: ""
    # Separate injected availability recovery suite. An operator must supply
    # a reviewed immutable profile ConfigMap and exact raw-byte digest.
    guardrailAvailability:
      enabled: false
      configMapName: ""
      profileSHA256: ""
      sourceConfigMap: guardrail-proxy
      guardrailJournalName: ""
    # Separate pinned authority for the existing injected guardrail-effect
    # action. Its fixed guarded baseline may stop without creating an event.
    guardrailEffect:
      enabled: false
      configMapName: ""
      profileSHA256: ""
      sourceConfigMap: guardrail-proxy
      guardrailJournalName: ""
    guardrailOutput:
      enabled: false
      configMapName: ""
      profileSHA256: ""
      sourceConfigMap: guardrail-output-fixture
      outputPolicyConfigMapName: ""
      outputPolicyJournalName: ""
      targetNamespace: vllm
    # One exact-source, fixed-model request-drain observation. A digest-pinned
    # profile is required before this default-off arm can create an event.
    drainLive:
      enabled: false
      configMapName: ""
      profileSHA256: ""
      journalName: ""
    # Distinct reviewed caller-credential revocation trial; endpoint-rotate
    # remains a route-effect observation. Off until owner migration is complete.
    endpointLease:
      enabled: false
      configMapName: ""
      profileSHA256: ""
      callerSecretName: ""
      sourceConfigMapName: ""
    # Reviewed real LiteLLM Service-path client policy trial. Off until the
    # owner has installed the gateway and pinned a complete runtime profile.
    litellmLive:
      enabled: false
      configMapName: ""
      sourceConfigMapName: phorvex-litellm-admission-gateway
      profileSHA256: ""
      seedSecret: ""
      statusSecret: ""
      journalName: phorvex-litellm-revoke-journal
    # Reviewed direct Voice/CRM agency trial. A Deployment UID pin limits
    # read-only journal access to that one Voice rollout and revisions 1..256.
    voiceAgencyLive:
      enabled: false
      configMapName: ""
      profileSHA256: ""
      deploymentUID: ""
    # Separate real-provider server-owned context output objectives. Disabled
    # until both source Secrets, output policy, profile and native action exist.
    litellmOutput:
      enabled: false
      configMapName: ""
      profileSHA256: ""
      documentSeedSecret: phorvex-litellm-output-document
      promptSeedSecret: phorvex-litellm-output-prompt
    # Reviewed real Voice synthetic output marker trial. Off until the
    # output-policy ConfigMap, protected journal and exact profile are pinned.
    voiceOutputLive:
      enabled: false
      configMapName: ""
      profileSHA256: ""
    voiceAdmissionLive:
      enabled: false
      configMapName: ""
      profileSHA256: ""
      sourceConfigMapName: ""
      legacyConfigMapName: ""
    voiceMCPLive:
      enabled: false
      configMapName: ""
      profileSHA256: ""
      deploymentUID: ""
      sourceConfigMapName: ""
      mcpSourceConfigMapName: ""
    # HTTP-driven CRM cross-account refund Live producer. No reviewed profile: the console
    # ServiceAccount reads the Service, Pods, policy and the deny-guard ConfigMap UID and
    # drives the mini-CRM over its in-cluster Service. Enabling it also renders the console's
    # resourceName-scoped GET of the crm-refund-guard ConfigMap (console-crm-live-rbac.yaml).
    crmRefundLive:
      enabled: false
    # Fixed, opt-in synthetic NATS baseline authority. It adds no namespace
    # create/delete or Secret/RBAC write permissions to the console identity.
    natsExposure:
      enabled: false
      configMapName: ""
      profileSHA256: ""
      # Adds only fixed-namespace response fixture verbs when explicitly enabled
      # alongside natsExposure.enabled. Existing baseline grants stay narrow.
      clientResponse:
        enabled: false
        configMapName: ""
        profileSHA256: ""
    # Opt-in authority for the fixed, unscored Mongo synthetic-document
    # configuration exposure control. The existing document-store namespace,
    # Service and server-owned harness config are not browser-selectable.
    mongoExposure:
      enabled: false
      configMapName: ""
      profileSHA256: ""
    # One fixed, injected Pod-bound API bearer response case. Enabling this
    # grants Voice fixture mutations, a name-bound E2E TokenRequest, and a
    # read-only exact protected-reservation ledger check.
    # Approval means the operator reviewed the PodMonitor selection path;
    # fresh per-Pod samples are still checked by the case at runtime.
    podBoundToken:
      enabled: false
      # Existing, operator-reviewed ConfigMap with exactly these two data keys:
      # config.pod-bound-api-auth-response.yaml and manifest.json. The profile
      # pins manifest bytes via podBoundTokenFixture.sourceManifestSHA256.
      # Its own raw bytes are checked against profileSHA256 by the console.
      configMapName: ""
      profileSHA256: ""
      scrapeApproved: false
      scrapeNamespace: voice
      podSelectorLabel: fixture.phorvex.ai/token-response
      # Set to phorvex-quarantine-capacity-<first 20 SHA256 bytes of the live
      # Voice Namespace UID>. The harness derives the name independently;
      # a mismatch cannot read the ledger and leaves cleanup unsafe.
      quarantineCapacityLedgerName: ""
    # Separate, fixed CPU response fixture. This grants nothing until enabled
    # with a reviewed source ConfigMap and namespace-specific scrape/ledger pins.
    # It does not enable or alter the original Voice token-response case.
    podBoundTokenCPU:
      enabled: false
      configMapName: ""
      profileSHA256: ""
      scrapeApproved: false
      scrapeNamespace: phorvex-catalogue-cpu
      podSelectorLabel: fixture.phorvex.ai/token-response
      # Exact name derived from the live phorvex-catalogue-cpu Namespace UID.
      quarantineCapacityLedgerName: ""
    # Opt-in fixed functional catalogue. Rows stay visible when disabled and
    # report their missing prerequisites; browsers cannot override any target.
    catalogueV1:
      enabled: false
      loopbackURL: "http://127.0.0.1:8090"
      allowedTenant: ""
      deniedTenant: ""
      deniedTarget: ""
      expectedSubject: ""
      scopedToken:
        existingSecret: ""
        key: token
        mountPath: /etc/phorvex-catalogue-v1
      voice:
        enabled: false
        namespace: ""
        deployment: ""
        service: ""
        container: ""
        port: 0
        pdb: ""
        transcriptSelector: ""
        transcriptContainer: ""
      # Disabled unless the installed guardrail source digest and fixed route
      # are explicitly supplied. This only measures two benign classifiers.
      guardrailCalibration:
        enabled: false
        namespace: vllm
        service: vllm
        port: 8000
        container: guardrail
        sourceConfigMap: guardrail-proxy
        sourceKey: guardrail_proxy.py
        sourceSHA256: ""
      mcpSession:
        enabled: false
        namespace: mcp
        deployment: mcp-server
        service: mcp-server
        container: mcp-server
        port: 8000
        sourceConfigMap: mcp-code
        sourceKey: server.py
        imageID: ""
        sourceSHA256: ""
      # Source-pinned two-call model-decision observation. Always opt in separately.
      mcpVoiceModel:
        enabled: false
        voiceSourceSHA256: ""
      # Fixed direct controls; enabled only against the reviewed installed routes.
      chroma:
        enabled: false
        namespace: document-store
        deployment: chroma
        service: chroma
        container: chroma
        port: 8000
        imageID: docker.io/chromadb/chroma@sha256:18e67eecc172abbcd9413d751bde64983b3d167fe497c98f979083eb24c0c942
        versionSourceSHA256: 5458a79347d19a5d15966a76a3a5e02bdac384ef670ff0612cc93fc788c41f44
        serverSourceSHA256: 8dae4ea1f3357edf75ac446bbe0e3973151a542dc6de184c7be3b6be82925c41
        schemaSourceSHA256: 2b6ec7c5796309be91f9af97e3bb4379a42652550146b2dda226c801894570b1
      litellm:
        enabled: false
        # A separate opt-in for bounded authenticated completion requests.
        # The alias must be reviewed against the SHA-pinned installed config.
        inferenceEnabled: false
        modelAlias: ""
        namespace: litellm
        deployment: litellm
        service: litellm
        container: litellm
        port: 4000
        configMap: litellm-config
        configKey: config.yaml
        configSHA256: 14ebebce3b18a492a7aadb5c011bfcd71d8d16d8e8745e305b4f2336664daafb
      gpu:
        enabled: false
        namespace: ""
        fixtureConfigMap: ""
        fixtureKey: config.yaml
        mountPath: /etc/phorvex-catalogue-v1-gpu
        runtimeSecret: ""
        kubeconfigKey: kubeconfig
        bearerTokenKey: bearer-token
        runtimeMountPath: /etc/phorvex-catalogue-v1-gpu-runtime
        kubeContext: ""
      # Synthetic CRM functional controls. Owner provisions a dedicated labelled
      # namespace and scoped kubeconfig. RBAC binds only the dedicated fixture SA.
      crm:
        enabled: false
        namespace: ""
        namespaceUID: ""
        serviceAccountName: ""
        manifestConfigMap: ""
        manifestKey: manifest.json
        manifestMountPath: /etc/phorvex-catalogue-v1-crm
        manifestSHA256: ""
        harnessSHA256: ""
        runtimeSecret: ""
        kubeconfigKey: kubeconfig
        runtimeMountPath: /etc/phorvex-catalogue-v1-crm-runtime
        kubeconfigSHA256: ""
        kubeContext: ""
    auditTransport:
      port: 8445
      serverSecretName: ""
      clientSecretName: ""
      serverDNSName: ""
      clientDNSName: ""
      vclusterPath: ""
    image:
      repository: ""
      tag: ""
      # Once set, the console pulls its image by this digest.
      releaseDigest: ""
      releaseSourceSHA: ""
      pullPolicy: IfNotPresent
    port: 8090
    # Matches the console image's own CMD (deploy/docker/console.Dockerfile).
    root: /data
    web: /app/web
    # Console-owned mutable evidence is physically separate from the manager decision audit.
    # Keep persistence enabled in shared environments. Operators own StorageClass/claim
    # provisioning, backup/restore, retention of the PVC, and capacity monitoring.
    state:
      mountPath: /var/lib/phorvex-console
      # Zero keeps existing append-only behavior; positive values authorize expiry.
      historyRetentionDays: 0
      historyArchiveMaxBytes: "2147483648"
      historyMinFreeBytes: "536870912"
      persistence:
        enabled: true
        existingClaim: ""
        storageClass: ""
        size: 5Gi
        accessModes: [ReadWriteOnce]
        retainOnDelete: true
      # Explicit development opt-out. State is lost on Pod replacement.
      allowEphemeral: false
    # No CPU/memory limits: phorvex-system pods run unthrottled (2026-10-13).
    resources:
      requests: { cpu: 10m, memory: 256Mi }
    # ── identity and authorization (M-136) ────────────────────────────────────
    # The console REFUSES TO START unless at least one credential path below is configured. There
    # is no demo-trust mode: the previous build treated "no IdP" and "IdP failed to load" as
    # permission to serve cluster controls to whoever asked.
    #
    # Everything here is a configuration identifier, not a secret. It is also per-environment:
    # copying one cluster's signer ARN into another makes that cluster's load balancer a trusted
    # issuer here, which is exactly the trust relationship you do not want to share.
    auth:
      # ALB Cognito — the path the browser actually uses when the ingress carries
      # alb.ingress.kubernetes.io/auth-type: cognito. The console verifies the ES256 signature on
      # x-amzn-oidc-data against this exact load balancer, user pool and app client.
      alb:
        signerArn: ""   # arn:aws:elasticloadbalancing:<region>:<account>:loadbalancer/app/<name>/<id>
        additionalSignerArns: [] # explicit ALB allowlist, same account/region and issuer/client
        issuer: ""      # https://cognito-idp.<region>.amazonaws.com/<user-pool-id>
        clientId: ""    # the user-pool app-client id
        region: ""      # optional; defaults to the region inside signerArn
      # Bearer OIDC — for CLI and automation callers. All three fields are required together.
      oidc:
        issuer: ""
        audience: ""
        jwksUrl: ""
        algorithms: []  # default ["RS256"]; RS256/384/512 and ES256/384/512 are supported
      # The End-to-End pipeline's machine identity: a token-less ServiceAccount whose
      # short-lived projected tokens (audience = oidc.audience) CI mints per run. Requires
      # oidc.* to point at the cluster's own OIDC issuer and a grant for
      # system:serviceaccount:<namespace>:<fullname>-console-e2e (see values-eks.yaml).
      e2eIdentity:
        enabled: false
      # Exact browser origins allowed to drive state changes (the same-origin/CSRF boundary).
      # There is no wildcard: an unlisted origin gets neither a CORS grant nor a mutation.
      trustedOrigins: []
      # The subject grant table. DevOps supplies it; the console never derives one.
      #
      # ROLLOUT PREREQUISITE: with no bindings the console authenticates callers and authorizes
      # NOBODY. That is deliberate and visible (the startup log says so, and /api/session reports
      # grantsConfigured: false). Bind the specific Cognito subjects who should be operators
      # before rollout — do not grant a role because someone can log in.
      grants:
        enabled: false
        create: false
        configMapName: ""
        mountPath: /etc/phorvex-console
        fileName: grants.json
        # data is the literal grant document. Example:
        #   {
        #     "version": 1,
        #     "subjects": [
        #       {"issuer": "https://cognito-idp.us-east-2.amazonaws.com/us-east-2_XXXX",
        #        "subject": "<cognito-sub-uuid>",
        #        "roles": ["operator"],
        #        "tenants": ["vllm", "litellm"],
        #        "targets": ["default"],
        #        "note": "platform on-call"}
        #     ]
        #   }
        # "tenants": ["*"] is cross-tenant admin. Write it out only when that is the intent — and
        # note that some surfaces REQUIRE it because they cannot be confined to one tenant:
        # clearing the shared decision audit, the global red-team controls and artifacts, the
        # unscoped (namespace-omitted) forms of /api/scan and /api/ablation, and the private
        # evidence corpus (benchmarks, effectiveness, frontier, posture, matrix, ai-surface,
        # reports, raw logs). A vendor-side identity that needs those holds the wildcard; a
        # customer-facing operator scoped to specific tenants deliberately does not.
        #
        # "targets" must likewise list every cluster the identity may reach. "default" is this
        # console's own cluster AND the host that runs harness subprocesses; a run whose config
        # names another context needs that context listed too.
        data: ""

  # Escape hatches, so a flag added to the operator does not require a chart release
  # before it can be deployed — and, more importantly, so a live deployment never has to be
  # hand-patched out from under Helm again.
  extraArgs: []
  extraEnv: []
  # No CPU/memory limits: a 256Mi limit OOM-killed the manager once the Math Lab snapshot
  # index grew (2026-10-12). Requests reflect the observed working set.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
# Install the PhorvexPolicy CRD with the chart (Helm crds/ dir installs it first).
installCRD: true
