phorvex:
  image:
    repository: phorvex/phorvex
    pullPolicy: IfNotPresent
    tag: "0.1.0-p0"
  # Base tick interval for the decision loop (per-tenant cadence honored on top).
  baseInterval: 10s
  # Consecutive unsupported observations before ActionsSupported becomes False.
  # Three policy ticks exceeds a normal single-pod restart while still surfacing drift promptly.
  actionsSupportedDebounce: 3
  # Cluster-specific scale calibration. Shadow-only: values are exported and monitored,
  # while production scoring continues to use the shipped constants until review.
  calibration:
    enabled: true
    sampleInterval: 5m
    refreshInterval: 30m
    lookback: 168h
    exportDir: /var/run/phorvex-calibration
  # Prometheus base URL for telemetry ingest. Empty => K8s-only signals (no
  # fabricated metrics).
  prometheusUrl: ""
  # Normalized GPU reload/warm-up envelope. 0.2925 is the observed worst case on
  # the production EKS Tesla T4 fleet: 117s time-to-Ready / 400s documented scale.
  gpuEnvelopeMax: 0.2925
  # PCIe link capacity used to normalize the DCGM RX+TX byte-rate into LinkBandwidth
  # (M-114). The denominator is DISCOVERED, never chosen: (1) the device's negotiated link
  # from DCGM_FI_DEV_PCIE_LINK_GEN/_WIDTH when the exporter publishes them; (2) otherwise
  # this table, keyed by the exporter's own `modelName` label (gen = PCIe generation,
  # width = lanes; capacity = 2 × width × PCI-SIG per-lane rate); (3) otherwise the signal
  # is absent — never a borrowed number. Merged over the shipped default (Tesla T4 = Gen3 x16,
  # NVIDIA T4 datasheet); add classes for other devices, e.g. "NVIDIA A100-SXM4-40GB": {gen: 4, width: 16}.
  pcieClassCapacity:
    "Tesla T4": {gen: 3, width: 16}
  # Workload classes (namespaces) whose Little's-law flow residual is ACTIVATED (M-115).
  # The per-class verdict belongs to the math ruling, not to telemetry availability: as of
  # 2026-09-06 MATH ruled every class ABSENT (vllm included) until the in-system count is
  # validated at low load, so this list is empty and the component is recorded absent with
  # reason class-not-activated, entering no aggregate and no fact.
  flowResidualClasses: []
  # Detector identities whose SecurityEvents may supply belief evidence (M-94). The check is
  # made against the AUTHENTICATED creator that the admission stamp records, never against the
  # self-declared spec.rule.source — that string is written by whoever created the event.
  # Accepted spellings: "namespace/serviceaccount", "namespace:serviceaccount", or a full
  # "system:serviceaccount:ns:name". An EMPTY list trusts no external detector (fail-closed):
  # events are still ingested and recorded, they simply carry no evidence.
  # The defaults below are the identities that actually hold securityevents-create on the
  # EKS fleet (discovered 2026-09-06 from the bound ClusterRoles); replace them for your fleet.
  trustedDetectors:
    - vllm/detector-kv-canary
    - vllm/detector-adapter-inv
    - phorvex-system/operator-controller-manager
  # M-94 server-side guard that makes the stamp above worth trusting: a
  # ValidatingAdmissionPolicy + Deny binding requiring that any phorvex.ai/creator-identity
  # annotation on a SecurityEvent CREATE/UPDATE equals the authenticated requester. It is
  # evaluated in-process by the API server, so — unlike the mutating stamp webhook, which is
  # failurePolicy=Ignore so it can never block the cluster's event flow — it has no endpoint
  # that can be down. Without it, a client-supplied creator survives any stamp-webhook outage
  # and forges an allowlisted detector.
  # ON by default and required for `trustedDetectors` to mean anything: rendering with this
  # disabled and a non-empty allowlist is rejected. Needs Kubernetes >=1.30 (stable
  # admissionregistration.k8s.io/v1 ValidatingAdmissionPolicy); on an older cluster the render
  # fails loudly rather than quietly dropping the guard.
  # An event with NO creator annotation is still admitted — it is simply untrusted at ingest.
  # It does not retroactively authenticate SecurityEvents that already exist.
  eventIdentityPolicy:
    enabled: true
  # Opt-in live E2E identity. Admission confines its events to one test namespace;
  # the console/operator identity is NOT added to the detector allowlist.
  e2eDetector:
    enabled: false
    targetNamespace: ""
  # Engage the global actuation kill-switch at startup (FR8). Can also be toggled at
  # runtime via the phorvex-killswitch ConfigMap.
  globalKillSwitch: false
  # Optional Prometheus Operator rules for kill-switch observability.
  alerts:
    enabled: false
    disagreementFor: 2m
    restartWindow: 10m
    restartThreshold: 3
    restartFor: 2m
    additionalLabels: {}
  # The PHVX-9b fail-conservative NaN-cost alert is independently switchable so
  # enabling it does not silently activate unrelated alert policies.
  costNaNAlert:
    enabled: false
  # Leader election for HA (single active controller).
  leaderElect: true
  # Fail-closed CREATE/UPDATE admission for cross-field PhorvexPolicy invariants.
  # The chart generates and retains one self-signed serving certificate per release;
  # single-field ranges and duration syntax are enforced independently by CRD CEL.
  admissionWebhook:
    enabled: true
    port: 9443
    certDir: /tmp/k8s-webhook-server/serving-certs
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  # Namespace the operator treats as its own (where it looks for the killswitch ConfigMap
  # and its leader-election lease). Empty => the operator's own POD_NAMESPACE.
  operatorNamespace: ""
  # Actuator backend. Accepted values are exactly: phoenix, native, hybrid.
  #   phoenix - drives UNMODIFIED Phoenix through SecurityEvent/AMTD CRs
  #   native  - Phorvex's own client-go hands (no Phoenix CRDs)
  #   hybrid  - Phoenix for rotate/quarantine, native for the AI-native moves
  # EMPTY (the default here) renders NO PHORVEX_ACTUATOR env var at all, so the operator
  # binary applies its own documented default, phoenix. That is the only way to get the
  # default: any NON-empty value is matched EXACTLY by the binary — no trimming, no case
  # folding — and anything else (a typo, padding, "Native") fails startup with the accepted
  # set rather than silently falling back to phoenix (M-21). Surfaced here because the
  # difference is visible in the audit (A01–A04 assert on what actually touched the
  # cluster), so it must be part of desired state rather than a hand-patched env var.
  # The per-action repertoire of each backend is published in phorvex/docs/actuator-repertoire.md.
  actuator: ""
  # Managed tenant namespaces where the native/hybrid actuator may perform routine
  # namespaced mutations. Empty by default: the chart adds no workload-write privilege.
  # Each entry renders a namespaced Role/RoleBinding for pods, NetworkPolicies,
  # ReplicaSets and Services. Service access is exactly get/update so route-rotate and
  # endpoint-rotate can restitch selectors; Secrets and EndpointSlices remain denied.
  actuatorNamespaces: []
  # Operator-administered exact namespace+adapter reload mappings. Empty disables
  # adapter reload and mounts nothing. Changes take effect after manager restart.
  loraCleanSources:
    content: ""
    mountPath: /etc/phorvex-adapters/sources.json
  # M-6 code-exec admission protection. OFF by default: enabling it renders the installer-owned
  # ValidatingAdmissionPolicy + Binding (phorvex-codeexec-ephemeral) that DENIES any
  # pods/ephemeralcontainers UPDATE in a managed namespace unless it exactly matches the approved
  # profile, plus the minimal resourceName-scoped `get` the operator's runtime verifier needs to
  # confirm the policy is in force before offering/dispatching debugger/custom-inject. This grants
  # NO injection permission (the ephemeralcontainers write Role stays unbound — a separate,
  # human-gated step) and labels no namespace: an admin opts a namespace in with
  # `kubectl label ns <ns> phorvex.ai/codeexec-managed=true`. Deny-only, so it is safe to enable
  # ahead of any execution grant, and required to be verified BEFORE one.
  codeExecAdmission:
    enabled: false
  # EPSS exploit-probability cache. The operator reads it from a file so a scored CVE feed
  # can be refreshed without a rebuild; the file arrives as a ConfigMap.
  epss:
    enabled: false
    configMapName: phorvex-epss
    mountPath: /etc/phorvex
    fileName: epss-cache.json
    # Projected ConfigMaps update asynchronously. Every operator replica re-reads
    # the mounted file and retains its last-known-good cache on a bad update.
    refreshInterval: 30s
    # Create the ConfigMap from `data` below, rather than expecting it to already exist.
    # The Deployment mounts it, so a missing ConfigMap means the pod never starts — which
    # makes it a startup dependency, and a startup dependency that exists only as a
    # hand-applied object is a cluster that cannot be rebuilt from git.
    # Set false when an external pipeline owns the ConfigMap instead.
    create: false
    data: ""
    # Automated running-image inventory -> Trivy -> FIRST EPSS -> ConfigMap refresh.
    # It uses a dedicated ServiceAccount with pod-list plus get/update on only the
    # named ConfigMap. `apply: false` performs the full job as a safe dry-run.
    feed:
      enabled: false
      schedule: "17 3 * * *"
      suspend: false
      apply: false
      allowPartial: false
      firstURL: https://api.first.org/data/v1/epss
      trivyPath: /tools/trivy
      trivy:
        image:
          repository: aquasec/trivy
          tag: "0.65.0"
          pullPolicy: IfNotPresent
      scanTimeout: 10m
      activeDeadlineSeconds: 3600
      serviceAccount:
        annotations: {}
      imagePullSecrets: []
      extraEnv: []
      resources:
        limits: { cpu: "2", memory: 2Gi }
        requests: { cpu: 100m, memory: 256Mi }
      nodeSelector: {}
      tolerations: []
      affinity: {}
  # Write the decision audit to a JSONL file. The console streams /api/live from a FILE,
  # so without this there is nothing live to stream — which is why the in-cluster console
  # could only ever serve the stale snapshot baked into its image.
  audit:
    enabled: false
    path: /audit/live.jsonl
    # Opt-in accidental-outage guard: reject other Pods mounting this release's
    # RWO audit PVC. Requires Kubernetes >=1.30 and audit.persistence.enabled.
    # This checks Deployment pod shape, not authenticated controller identity.
    volumeGuard:
      enabled: false
    # 0 = unbounded. Otherwise this is a target segment size; whole records can
    # exceed it. Nominal budget = maxBytes * (maxBackups + 1).
    maxBytes: 536870912
    maxBackups: 4
    persistence:
      # A PVC rather than an emptyDir so the decision history survives a restart. The
      # volume is shared between the operator and the console container INSIDE ONE POD,
      # so ReadWriteOnce is sufficient and no EFS/RWX filesystem is needed.
      enabled: true
      storageClass: ""
      size: 5Gi

  # Run the console as a second container in this pod.
  #
  # They are co-located because the console reads the audit as a local file and the
  # operator writes it as a local file. Two Deployments cannot share a ReadWriteOnce
  # volume, and the alternative — an RWX filesystem — means provisioning EFS for what is
  # one file on one node. Co-location is also what already works on the jump host.
  #
  # The cost is a shared lifecycle: the console restarts whenever the operator does.
  console:
    enabled: false
    allowWorkloadMutations: false
    auditTransport:
      port: 8445
      serverSecretName: ""
      clientSecretName: ""
      serverDNSName: ""
      clientDNSName: ""
      vclusterPath: ""
    image:
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent
    port: 8090
    # Matches the console image's own CMD (deploy/docker/console.Dockerfile).
    root: /data
    web: /app/web
    # Console-owned mutable evidence is physically separate from the manager decision audit.
    # Keep persistence enabled in shared environments. Operators own StorageClass/claim
    # provisioning, backup/restore, retention of the PVC, and capacity monitoring.
    state:
      mountPath: /var/lib/phorvex-console
      persistence:
        enabled: true
        existingClaim: ""
        storageClass: ""
        size: 5Gi
        accessModes: [ReadWriteOnce]
        retainOnDelete: true
      # Explicit development opt-out. State is lost on Pod replacement.
      allowEphemeral: false
    resources:
      limits: { cpu: 500m, memory: 256Mi }
      requests: { cpu: 10m, memory: 64Mi }
    # ── identity and authorization (M-136) ────────────────────────────────────
    # The console REFUSES TO START unless at least one credential path below is configured. There
    # is no demo-trust mode: the previous build treated "no IdP" and "IdP failed to load" as
    # permission to serve cluster controls to whoever asked.
    #
    # Everything here is a configuration identifier, not a secret. It is also per-environment:
    # copying one cluster's signer ARN into another makes that cluster's load balancer a trusted
    # issuer here, which is exactly the trust relationship you do not want to share.
    auth:
      # ALB Cognito — the path the browser actually uses when the ingress carries
      # alb.ingress.kubernetes.io/auth-type: cognito. The console verifies the ES256 signature on
      # x-amzn-oidc-data against this exact load balancer, user pool and app client.
      alb:
        signerArn: ""   # arn:aws:elasticloadbalancing:<region>:<account>:loadbalancer/app/<name>/<id>
        issuer: ""      # https://cognito-idp.<region>.amazonaws.com/<user-pool-id>
        clientId: ""    # the user-pool app-client id
        region: ""      # optional; defaults to the region inside signerArn
      # Bearer OIDC — for CLI and automation callers. All three fields are required together.
      oidc:
        issuer: ""
        audience: ""
        jwksUrl: ""
        algorithms: []  # default ["RS256"]; RS256/384/512 and ES256/384/512 are supported
      # Exact browser origins allowed to drive state changes (the same-origin/CSRF boundary).
      # There is no wildcard: an unlisted origin gets neither a CORS grant nor a mutation.
      trustedOrigins: []
      # The subject grant table. DevOps supplies it; the console never derives one.
      #
      # ROLLOUT PREREQUISITE: with no bindings the console authenticates callers and authorizes
      # NOBODY. That is deliberate and visible (the startup log says so, and /api/session reports
      # grantsConfigured: false). Bind the specific Cognito subjects who should be operators
      # before rollout — do not grant a role because someone can log in.
      grants:
        enabled: false
        create: false
        configMapName: ""
        mountPath: /etc/phorvex-console
        fileName: grants.json
        # data is the literal grant document. Example:
        #   {
        #     "version": 1,
        #     "subjects": [
        #       {"issuer": "https://cognito-idp.us-east-2.amazonaws.com/us-east-2_XXXX",
        #        "subject": "<cognito-sub-uuid>",
        #        "roles": ["operator"],
        #        "tenants": ["vllm", "litellm"],
        #        "targets": ["default"],
        #        "note": "platform on-call"}
        #     ]
        #   }
        # "tenants": ["*"] is cross-tenant admin. Write it out only when that is the intent — and
        # note that some surfaces REQUIRE it because they cannot be confined to one tenant:
        # clearing the shared decision audit, the global red-team controls and artifacts, the
        # unscoped (namespace-omitted) forms of /api/scan and /api/ablation, and the private
        # evidence corpus (benchmarks, effectiveness, frontier, posture, matrix, ai-surface,
        # reports, raw logs). A vendor-side identity that needs those holds the wildcard; a
        # customer-facing operator scoped to specific tenants deliberately does not.
        #
        # "targets" must likewise list every cluster the identity may reach. "default" is this
        # console's own cluster AND the host that runs harness subprocesses; a run whose config
        # names another context needs that context listed too.
        data: ""

  # Escape hatches, so a flag added to the operator does not require a chart release
  # before it can be deployed — and, more importantly, so a live deployment never has to be
  # hand-patched out from under Helm again.
  extraArgs: []
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
# Install the PhorvexPolicy CRD with the chart (Helm crds/ dir installs it first).
installCRD: true
