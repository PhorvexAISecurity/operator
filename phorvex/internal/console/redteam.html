<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phorvex — Red-Team Control</title>
<style>
  :root{--bg:#0a0d12;--panel:#11161d;--elev:#161c25;--border:#222b38;--fg:#dfe6ee;--muted:#8b97a7;
        --primary:#5b9dff;--success:#46d39a;--warn:#e8b552;--danger:#ef6f6f;--accent:#b98bff}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);font-size:14px}
  header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:700}
  .sub{color:var(--muted);font-size:12px}
  .tabs{display:flex;gap:4px;padding:10px 24px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .tab{padding:9px 16px;border:none;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--fg);border-bottom-color:var(--primary)}
  main{padding:20px 24px;max-width:1100px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
  .card h3{margin:0 0 4px;font-size:13px}
  .label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
  .row{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .stat{min-width:90px}
  .stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .k{font-size:10px;text-transform:uppercase;color:var(--muted)}
  button.act{background:var(--primary);color:#04101f;border:none;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.1)}
  button.ghost{background:var(--elev);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:8px 13px;cursor:pointer;font-size:13px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .b-ok{background:rgba(70,211,154,.15);color:var(--success)}
  .b-warn{background:rgba(232,181,82,.15);color:var(--warn)}
  .b-bad{background:rgba(239,111,111,.15);color:var(--danger)}
  .b-info{background:rgba(91,157,255,.15);color:var(--primary)}
  .b-n{background:rgba(139,151,167,.15);color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border)}
  th{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:600}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:8px;border-radius:4px;background:var(--elev);overflow:hidden;display:inline-block;width:90px;vertical-align:middle}
  .bar>i{display:block;height:100%;background:var(--primary)}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  select,input,textarea{background:var(--elev);color:var(--fg);border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:13px;font-family:inherit}
  .muted{color:var(--muted)}
  .pending{background:rgba(232,181,82,.08);border:1px solid rgba(232,181,82,.3);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--warn);margin-top:8px}
  pre{background:#0d1219;border:1px solid var(--border);border-radius:8px;padding:14px;overflow:auto;font-size:12px;line-height:1.5;white-space:pre-wrap}
  svg{display:block}
  .hidden{display:none}
  .find{border:1px solid var(--border);border-radius:9px;padding:14px;margin-bottom:12px;background:var(--elev)}
  .find h4{margin:0 0 6px;font-size:14px}
  .cycle{font-size:12px;color:var(--accent);margin:6px 0}
  .k{color:var(--muted);font-size:11px;text-transform:uppercase}
  .err{color:var(--danger);font-size:12px}
  a{color:var(--primary)}
</style>
</head>
<body>
<header>
  <h1>🛡️ Phorvex — Red-Team Control</h1>
  <span class="sub" id="hdr-sub">the RL adversary · deterministic Phorvex · live data</span>
  <span class="badge b-info" id="hdr-state">loading…</span>
</header>
<div class="tabs">
  <button class="tab active" data-t="run">▶ Run</button>
  <button class="tab" data-t="see">📈 See</button>
  <button class="tab" data-t="understand">🧠 Understand</button>
  <button class="tab" data-t="reports">📄 Reports</button>
  <button class="tab" data-t="address">✅ Address</button>
</div>
<main>
  <section id="t-run"></section>
  <section id="t-see" class="hidden"></section>
  <section id="t-understand" class="hidden"></section>
  <section id="t-reports" class="hidden"></section>
  <section id="t-address" class="hidden"></section>
</main>
<script>
const LENS="operator";
async function J(path,opts){opts=opts||{};opts.headers=Object.assign({"X-Phorvex-Lens":LENS,"Content-Type":"application/json"},opts.headers||{});opts.cache="no-store";const r=await fetch(path,opts);if(!r.ok)throw new Error(path+" -> "+r.status);return r.json();}
function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;}
function badge(txt,cls){return '<span class="badge '+cls+'">'+txt+'</span>';}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

// ---------- tab switching ----------
const tabs=document.querySelectorAll(".tab");
tabs.forEach(t=>t.onclick=()=>{
  tabs.forEach(x=>x.classList.remove("active"));t.classList.add("active");
  ["run","see","understand","reports","address"].forEach(n=>document.getElementById("t-"+n).classList.toggle("hidden",n!==t.dataset.t));
  render(t.dataset.t);
});

// ---------- RUN ----------
async function renderRun(){
  const root=document.getElementById("t-run");
  root.innerHTML='<div class="card"><div class="muted">loading run status…</div></div>';
  let st={},cv={};
  try{st=await J("/api/redteam/run-status");}catch(e){}
  try{cv=await J("/api/redteam/curves");}catch(e){}
  const stateBadge=st.state==="running"?badge("running","b-warn"):st.state==="done"?badge("done","b-ok"):st.state==="error"?badge("error","b-bad"):badge("idle","b-n");
  document.getElementById("hdr-state").outerHTML='<span class="badge '+(st.continuous?'b-warn':'b-info')+'" id="hdr-state">'+(st.continuous?'continuous · gen '+st.continuousGen:(st.state||'idle'))+'</span>';
  let verdict="";
  if(cv.available){
    verdict='<div class="row" style="margin-top:6px">'
     +badge((cv.steerFixNeutralizes?'✓':'✗')+' steer-fix neutralizes','b-'+(cv.steerFixNeutralizes?'ok':'bad'))
     +badge((cv.vulnWasReal?'✓':'✗')+' vuln was real','b-'+(cv.vulnWasReal?'ok':'bad'))
     +badge((cv.flatVsRandom?'✓':'✗')+' flat vs random','b-'+(cv.flatVsRandom?'ok':'bad'))
     +badge((cv.autoEscalate?'✗ auto-escalates':'✓ no auto-escalation'),'b-'+(cv.autoEscalate?'bad':'ok'))+'</div>';
  }
  root.innerHTML=
   '<div class="card"><div class="label">Single RL red-team run</div>'
   +'<div class="row"><div class="stat"><div class="v">'+(cv.iters||'—')+'</div><div class="k">PPO iters</div></div>'
   +'<div class="stat"><div class="v">'+(cv.qdCoverage||'—')+'</div><div class="k">QD cells</div></div>'
   +'<div class="stat"><div class="v">'+(cv.qd?cv.qd.length:'—')+'</div><div class="k">strategies</div></div>'
   +'<div>'+stateBadge+'</div></div>'
   +verdict
   +'<div class="row" style="margin-top:12px"><button class="act" id="btn-run" '+(st.state==="running"?'disabled':'')+'>▶ Run RL red-team</button>'
   +'<span class="muted" id="run-msg">'+esc(st.msg||"trains Recurrent-PPO + PBT + QD, refreshes the curves (~1–2 min)")+'</span></div></div>'

   +'<div class="card"><div class="label">Continuous co-training</div>'
   +'<div class="row"><button class="'+(st.continuous?'ghost':'act')+'" id="btn-cont">'+(st.continuous?'■ Stop continuous':'▶ Start continuous')+'</button>'
   +'<span class="muted">'+(st.continuous?('running — gen '+st.continuousGen+' refreshed'):'a managed in-process loop that re-trains + refreshes each cycle')+'</span></div>'
   +'<div class="pending">SCOPED: continuous is a managed in-process background job (start/stop, live gen counter). A cross-restart persistent daemon is <b>[PENDING-INFRA]</b> — not faked.</div></div>';

  document.getElementById("btn-run").onclick=async()=>{
    document.getElementById("btn-run").disabled=true;document.getElementById("run-msg").textContent="starting…";
    try{await J("/api/redteam/run",{method:"POST",body:"{}"});pollRun();}catch(e){document.getElementById("run-msg").textContent="error: "+e.message;}
  };
  document.getElementById("btn-cont").onclick=async()=>{
    const action=st.continuous?"stop":"start";
    try{const r=await J("/api/redteam/continuous",{method:"POST",body:JSON.stringify({action})});renderRun();}catch(e){alert(e.message);}
  };
}
let pollTimer=null;
function pollRun(){
  clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    try{const st=await J("/api/redteam/run-status");
      const m=document.getElementById("run-msg");if(m)m.textContent=st.msg||st.state;
      if(st.state!=="running"){clearInterval(pollTimer);renderRun();}
    }catch(e){clearInterval(pollTimer);}
  },4000);
}

// ---------- SEE ----------
let allCampaigns=[];
async function renderSee(){
  const root=document.getElementById("t-see");
  root.innerHTML='<div class="card"><div class="muted">loading curves + campaigns…</div></div>';
  let cv={},camp={},live={};
  try{cv=await J("/api/redteam/curves");}catch(e){}
  try{camp=await J("/api/redteam/campaigns");}catch(e){}
  try{live=await J("/api/redteam/live");}catch(e){}
  allCampaigns=(camp&&camp.campaigns)||[];
  let html="";
  // curves
  if(cv.available&&cv.curves){
    html+='<div class="card"><div class="label">RL learning curves — greedy return per PPO iteration (real run, seed '+cv.seed+')</div>';
    cv.curves.forEach(c=>{html+=curveRow(c);});
    html+='<div class="muted" style="margin-top:6px;font-size:12px">Climbs vs an exploitable defender, FLAT vs random, NEUTRALIZED (held to baseline) vs the shipped fixes — the RL exploits structure, not noise.</div></div>';
  }else{html+='<div class="card"><div class="muted">No RL run yet — go to <b>Run</b> and click “Run RL red-team”.</div></div>';}
  // campaigns with filters
  html+='<div class="card"><div class="label">-apt campaign results — PX vs reactive / blind / random (real metrics)</div>'
   +'<div class="filters"><select id="f-prod"><option value="">all products</option><option value="k8s">K8s</option><option value="ai">AI</option></select>'
   +'<select id="f-arm"><option value="">all arms</option><option>d-phorvex</option><option>d-fullphoenix</option><option>d-r6blindtimer</option><option>d-randomequal</option><option>d-reactive-only</option><option>d-nomtd</option></select></div>'
   +'<div id="camp-table"></div>'
   +'<div class="muted" style="font-size:12px;margin-top:6px">Honest labeling: PX evicts the foothold (disruption); for AI campaigns the in-request leg is the structural ceiling (MTD-CANNOT-HELP).</div></div>';
  // live proof
  if(live.available){
    html+='<div class="card"><div class="label">Live end-to-end actuation — the real pod actually changed</div><table><thead><tr><th>attack</th><th>foothold rotated?</th><th>action</th><th class="num">perDollar</th><th class="num">λ max</th><th class="num">foothold actuations</th></tr></thead><tbody>';
    live.proofs.forEach(p=>{html+='<tr><td>'+esc(p.attack)+'</td><td>'+badge(p.footholdRotated?'✓ rotated':'—',p.footholdRotated?'b-ok':'b-n')+'</td><td>'+esc(p.action||'—')+'</td><td class="num">'+(p.perDollar?p.perDollar.toFixed(2):'—')+'</td><td class="num">'+(p.lambdaMax?p.lambdaMax.toFixed(2):'—')+'</td><td class="num">'+p.footholdActuations+'</td></tr>';});
    html+='</tbody></table><div class="pending">'+esc(live.caveat)+'</div></div>';
  }
  root.innerHTML=html;
  const fp=document.getElementById("f-prod"),fa=document.getElementById("f-arm");
  if(fp){fp.onchange=fa.onchange=drawCampaigns;drawCampaigns();}
}
function curveRow(c){
  const w=420,h=40,vals=c.curve||[];if(!vals.length)return"";
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;
  const pts=vals.map((v,i)=>(i/(vals.length-1)*w)+","+(h-((v-mn)/rng)*h)).join(" ");
  const col=c.delta>4?'var(--danger)':Math.abs(c.delta)<4?'var(--success)':'var(--primary)';
  return '<div style="display:flex;align-items:center;gap:12px;margin:7px 0"><div style="width:200px;font-size:12px">'+esc(c.label)+'</div>'
   +'<svg width="'+w+'" height="'+h+'"><polyline fill="none" stroke="'+col+'" stroke-width="2" points="'+pts+'"/></svg>'
   +'<div style="font-size:12px;font-variant-numeric:tabular-nums" class="muted">'+c.start.toFixed(1)+' → '+c.end.toFixed(1)+' (Δ '+(c.delta>=0?'+':'')+c.delta.toFixed(1)+')</div></div>';
}
function drawCampaigns(){
  const prod=document.getElementById("f-prod").value,arm=document.getElementById("f-arm").value;
  let rows='<table><thead><tr><th>campaign</th><th>product</th><th>arm</th><th class="num">disruption</th><th>bar</th><th class="num">actions</th></tr></thead><tbody>';
  let any=false;
  allCampaigns.filter(c=>!prod||c.product===prod).forEach(c=>{
    c.arms.filter(a=>!arm||a.arm===arm).forEach(a=>{any=true;
      rows+='<tr><td>'+esc(c.scenario)+'</td><td>'+badge(c.product.toUpperCase(),'b-n')+'</td><td>'+esc(a.arm)+(a.arm==="d-phorvex"?' '+badge("PX","b-info"):'')+'</td>'
       +'<td class="num">'+a.disruption.toFixed(2)+'</td><td><span class="bar"><i style="width:'+(a.disruption*100)+'%;background:'+(a.disruption>=0.99?'var(--success)':a.disruption>0?'var(--warn)':'var(--muted)')+'"></i></span></td>'
       +'<td class="num">'+a.defensiveActions.toFixed(1)+'</td></tr>';});
  });
  rows+='</tbody></table>';
  document.getElementById("camp-table").innerHTML=any?rows:'<div class="muted">no campaign metrics for this filter</div>';
}

// ---------- UNDERSTAND ----------
async function renderUnderstand(){
  const root=document.getElementById("t-understand");
  root.innerHTML='<div class="card"><div class="muted">loading findings + gates…</div></div>';
  let f={},cv={};
  try{f=await J("/api/redteam/findings");}catch(e){}
  try{cv=await J("/api/redteam/curves");}catch(e){}
  let html='<div class="card"><div class="label">Two co-evolution cycles — why the RL found it, and how the fix closed it</div>';
  (f.findings||[]).forEach(x=>{
    html+='<div class="find"><h4>'+esc(x.title)+' '+badge(x.neutralized?'NEUTRALIZED':'OPEN',x.neutralized?'b-ok':'b-bad')+' '+badge(x.product.toUpperCase(),'b-n')+'</h4>'
     +'<div class="k">why the RL found it</div><div>'+esc(x.reasoning)+'</div>'
     +'<div class="cycle">↻ '+esc(x.cycle)+'</div>'
     +'<div class="k">recommended fix — '+esc(x.fixFile)+'</div><div>'+esc(x.fix)+'</div></div>';
  });
  html+='</div>';
  // QD weakness frontier
  if(cv.qd&&cv.qd.length){
    html+='<div class="card"><div class="label">QD weakness frontier — distinct strategies the search surfaced</div><table><thead><tr><th>strategy</th><th class="num">return</th></tr></thead><tbody>';
    cv.qd.sort((a,b)=>b.return-a.return).forEach(q=>{html+='<tr><td>'+esc(q.strategy)+'</td><td class="num">'+q.return.toFixed(1)+'</td></tr>';});
    html+='</tbody></table></div>';
  }
  // gates
  html+='<div class="card"><div class="label">Regression gates — 1.62× / P3 / lead-demo + the package suites</div>'
   +'<div class="row"><button class="act" id="btn-gates">▶ Run regression gates</button><span class="muted" id="gate-msg">runs go test live (~10–20s)</span></div>'
   +'<div id="gate-out" style="margin-top:10px"></div></div>';
  root.innerHTML=html;
  document.getElementById("btn-gates").onclick=async()=>{
    document.getElementById("btn-gates").disabled=true;document.getElementById("gate-msg").textContent="running go test…";
    try{const g=await J("/api/redteam/gates");
      let t='<table><thead><tr><th>gate</th><th>status</th><th>output</th></tr></thead><tbody>';
      g.gates.forEach(x=>{t+='<tr><td>'+esc(x.label)+'</td><td>'+badge(x.pass?'PASS':'FAIL',x.pass?'b-ok':'b-bad')+'</td><td class="muted" style="font-size:11px">'+esc(x.out)+'</td></tr>';});
      t+='</tbody></table>';
      document.getElementById("gate-out").innerHTML=t;
      document.getElementById("gate-msg").textContent=(g.allPass?"all gates green":"a gate failed")+" · ran "+g.ranAt;
    }catch(e){document.getElementById("gate-msg").textContent="error: "+e.message;}
    document.getElementById("btn-gates").disabled=false;
  };
}

// ---------- REPORTS ----------
async function renderReports(){
  const root=document.getElementById("t-reports");
  root.innerHTML='<div class="card"><div class="muted">generating report from live data…</div></div>';
  let cv={},camp={},live={},f={},g=null;
  try{cv=await J("/api/redteam/curves");}catch(e){}
  try{camp=await J("/api/redteam/campaigns");}catch(e){}
  try{live=await J("/api/redteam/live");}catch(e){}
  try{f=await J("/api/redteam/findings");}catch(e){}
  let md="# Red-Team — generated report ("+new Date().toISOString().slice(0,19)+"Z)\n\n";
  if(cv.available){md+="## RL learning (seed "+cv.seed+", "+cv.iters+" iters)\n";cv.curves.forEach(c=>{md+="- "+c.label+": "+c.start.toFixed(1)+" -> "+c.end.toFixed(1)+" (Δ "+(c.delta>=0?'+':'')+c.delta.toFixed(1)+")\n";});
    md+="- verdict: steer-fix neutralizes="+cv.steerFixNeutralizes+", vuln-was-real="+cv.vulnWasReal+", flat-vs-random="+cv.flatVsRandom+", auto-escalate="+cv.autoEscalate+"\n\n";}
  md+="## Findings (co-evolution)\n";(f.findings||[]).forEach(x=>{md+="- ["+(x.neutralized?"NEUTRALIZED":"OPEN")+"] "+x.title+" — "+x.cycle+" (fix: "+x.fixFile+")\n";});
  md+="\n## -apt campaigns (mean disruption per arm)\n";(camp.campaigns||[]).forEach(c=>{md+="- "+c.scenario+" ["+c.product+"]: "+c.arms.map(a=>a.arm+"="+a.disruption.toFixed(2)).join(", ")+"\n";});
  if(live.available){md+="\n## Live end-to-end actuation\n";live.proofs.forEach(p=>{md+="- "+p.attack+": footholdRotated="+p.footholdRotated+", action="+p.action+", perDollar="+(p.perDollar||0).toFixed(2)+", λmax="+(p.lambdaMax||0).toFixed(2)+"\n";});md+="- caveat: "+live.caveat+"\n";}
  root.innerHTML='<div class="card"><div class="label">Generated from the live run data (not hardcoded)</div>'
   +'<div class="row"><button class="ghost" id="btn-full">View full P-REDTEAM-REPORT.md</button><button class="ghost" id="btn-copy">Copy generated report</button></div>'
   +'<pre id="rep-md">'+esc(md)+'</pre></div>';
  document.getElementById("btn-copy").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(md);document.getElementById("btn-copy").textContent="copied";};
  document.getElementById("btn-full").onclick=async()=>{
    try{const r=await J("/api/reports?id=redteam-report");document.getElementById("rep-md").textContent=r.content||"(empty)";}catch(e){document.getElementById("rep-md").textContent="full report not registered: "+e.message;}
  };
}

// ---------- ADDRESS ----------
async function renderAddress(){
  const root=document.getElementById("t-address");
  root.innerHTML='<div class="card"><div class="muted">loading findings…</div></div>';
  let f={};try{f=await J("/api/redteam/findings");}catch(e){root.innerHTML='<div class="card err">'+e.message+'</div>';return;}
  let html='<div class="card"><div class="label">Review workflow — mark each finding (records your decision; applying a fix is [PENDING-P-VCLUSTER])</div>'
   +'<div class="filters"><select id="a-status"><option value="">all statuses</option><option>open</option><option>addressed</option><option>deferred</option><option>accepted-risk</option></select>'
   +'<select id="a-src"><option value="">all sources</option><option>RL</option><option>catalog</option></select></div><div id="find-list"></div></div>';
  root.innerHTML=html;
  window._findings=f.findings||[];
  document.getElementById("a-status").onchange=document.getElementById("a-src").onchange=drawFindings;
  drawFindings();
}
function drawFindings(){
  const st=document.getElementById("a-status").value,src=document.getElementById("a-src").value;
  let h="";
  (window._findings||[]).filter(x=>(!st||x.reviewStatus===st)&&(!src||x.source.indexOf(src)>=0)).forEach(x=>{
    const sb={open:'b-warn',addressed:'b-ok',deferred:'b-info','accepted-risk':'b-n'}[x.reviewStatus]||'b-n';
    h+='<div class="find"><h4>'+esc(x.title)+' '+badge(x.reviewStatus,sb)+' '+badge(x.source,'b-info')+'</h4>'
     +'<div class="k">reasoning</div><div style="font-size:13px">'+esc(x.reasoning)+'</div>'
     +'<div class="k" style="margin-top:6px">recommended fix ('+esc(x.fixFile)+')</div><div style="font-size:13px">'+esc(x.fix)+'</div>'
     +'<div class="pending">'+esc(x.applyNote)+'</div>'
     +'<div class="row" style="margin-top:8px"><select id="sel-'+x.id+'"><option>addressed</option><option>deferred</option><option>accepted-risk</option><option>open</option></select>'
     +'<input id="note-'+x.id+'" placeholder="decision note" value="'+esc(x.reviewNote)+'" style="flex:1;min-width:160px">'
     +'<button class="act" onclick="saveDecision(\''+x.id+'\')">Save decision</button>'
     +'<span class="muted" id="saved-'+x.id+'"></span></div></div>';
  });
  document.getElementById("find-list").innerHTML=h||'<div class="muted">no findings for this filter</div>';
}
async function saveDecision(id){
  const status=document.getElementById("sel-"+id).value,note=document.getElementById("note-"+id).value;
  try{const r=await J("/api/redteam/decision",{method:"POST",body:JSON.stringify({id,status,note})});
    document.getElementById("saved-"+id).textContent="✓ recorded ("+status+")";
    const fnd=(window._findings||[]).find(x=>x.id===id);if(fnd){fnd.reviewStatus=status;fnd.reviewNote=note;}
  }catch(e){document.getElementById("saved-"+id).textContent="error: "+e.message;}
}

// ---------- dispatch ----------
function render(t){({run:renderRun,see:renderSee,understand:renderUnderstand,reports:renderReports,address:renderAddress}[t]||renderRun)();}
render("run");
</script>
