apiVersion: phorvex.ai/v1alpha1
kind: PhorvexPolicy
metadata: {name: ws, namespace: wsdemo}
spec:
  tenant: t
  selector: {matchLabels: {app: ws}}
  objective: {lambda: "0.4"}
  budget: {maxMovesPerTick: 1, tickInterval: 2s}
  slo: {minAvailableReplicas: 0}
  assetValue: {fromLabels: {app: {ws: "1.0"}}}
  triggers: {eventDriven: true}
  actions: {enabled: ["rotate"]}
  mode: dryRun
