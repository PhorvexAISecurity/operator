# A crash-induced DOUBLE-LEADER warm-swap group (old leader carries swap-phase=flipping;
# the promoted shadow does not). The operator's reconcileWedged must converge to ONE leader.
apiVersion: v1
kind: Pod
metadata: {name: leader-old, namespace: wsdemo, labels: {phorvex.ai/swap-group: g1, phorvex.ai/role: leader, app: ws}, annotations: {phorvex.ai/swap-phase: flipping}}
spec: {containers: [{name: app, image: busybox:1.36, command: ["sleep","3600"]}]}
---
apiVersion: v1
kind: Pod
metadata: {name: leader-new, namespace: wsdemo, labels: {phorvex.ai/swap-group: g1, phorvex.ai/role: leader, app: ws}}
spec: {containers: [{name: app, image: busybox:1.36, command: ["sleep","3600"]}]}
