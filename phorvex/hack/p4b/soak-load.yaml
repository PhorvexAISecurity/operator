apiVersion: apps/v1
kind: Deployment
metadata: {name: churn, namespace: soak}
spec:
  replicas: 6
  selector: {matchLabels: {app: soak}}
  template:
    metadata: {labels: {app: soak, data-class: restricted}}
    spec: {containers: [{name: app, image: busybox:1.36, command: ["sleep","36000"], resources: {requests: {cpu: 5m, memory: 8Mi}}}]}
---
apiVersion: phorvex.ai/v1alpha1
kind: PhorvexPolicy
metadata: {name: soak, namespace: soak}
spec:
  tenant: t
  selector: {matchLabels: {app: soak}}
  objective: {lambda: "0.2"}
  budget: {maxMovesPerTick: 2, tickInterval: 1s, antiOverRotationWindow: 2s, proactiveFloor: 1s}
  slo: {minAvailableReplicas: 0}
  assetValue: {fromLabels: {data-class: {restricted: "1.0"}}}
  triggers: {eventDriven: true}
  actions: {enabled: ["rotate","quarantine"]}
  mode: active
