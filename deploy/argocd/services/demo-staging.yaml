# The workload staging's services defend (deploy/demo), as its own
# Application in the services project, in its own namespace: the services never
# defend the namespace they run in. Applied by hand, like applicationset.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: phorvex-demo-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phorvex
    phorvex.ai/environment: staging
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: phorvex-services
  source:
    repoURL: https://github.com/PhorvexSecurity/operator-refactored.git
    targetRevision: main
    path: deploy/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: phorvex-staging-demo
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
    # These fields are deliberately owned by the audited Live Policy Control in the console.
    # Keep Argo self-heal from immediately erasing an operator's live change.
    - RespectIgnoreDifferences=true
  ignoreDifferences:
  - group: phorvex.ai
    kind: PhorvexPolicy
    name: demo-api-defense
    namespace: phorvex-staging-demo
    jsonPointers:
    - /spec/mode
    - /spec/triggers/reactiveOnly
    - /spec/budget/maxMovesPerTick
    - /spec/actions/enabled
