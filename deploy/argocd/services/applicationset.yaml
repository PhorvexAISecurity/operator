# One Argo CD Application per Phorvex service (ADR-0001) for every environment: the
# manager (with the console), the brain, the sensor and the actuator, each its own
# chart, version, sync status and logs.
#
# Applied by hand (README.md); the production root app (../root.yaml) watches
# ../apps of the production repository, not this directory.
#
# An environment names its cluster, namespace and Helm release. Each reads
# deploy/environments/<environment>/: phorvex.yaml (the manager chart's keys,
# shared by every chart), <service>.yaml, and the shared default-off catalogue
# family overlay.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: phorvex-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - list:
          elements:
          # Staging beside the production stack on this cluster: its own namespace
          # and release name, and, in phorvex.yaml, its own policy scope and hands.
          - environment: staging
            server: https://kubernetes.default.svc
            namespace: phorvex-staging
            release: staging
      - list:
          elements:
          - service: manager
            chart: phorvex/charts/phorvex
          - service: brain
            chart: deploy/charts/phorvex-brain
          - service: sensor
            chart: deploy/charts/phorvex-sensor
          - service: actuator
            chart: deploy/charts/phorvex-actuator
          - service: attacks
            chart: deploy/charts/phorvex-attacks
          - service: console
            chart: deploy/charts/phorvex-console
  template:
    metadata:
      name: 'phorvex-{{.service}}-{{.environment}}'
      labels:
        app.kubernetes.io/part-of: phorvex
        phorvex.ai/service: '{{.service}}'
        phorvex.ai/environment: '{{.environment}}'
      finalizers:
      - resources-finalizer.argocd.argoproj.io
    spec:
      project: phorvex-services
      sources:
      - repoURL: https://github.com/PhorvexSecurity/operator-refactored.git
        targetRevision: main
        path: '{{.chart}}'
        helm:
          # Every chart of an environment shares its release name, so its objects
          # carry the names the others expect: <release>-brain, <release>-sensor,
          # <release>-actuator and the manager's <release>-phorvex-manager identity.
          releaseName: '{{.release}}'
          # The PhorvexPolicy CRD is cluster-wide and belongs to the cluster's
          # production stack.
          skipCrds: true
          valueFiles:
          - '$values/deploy/environments/{{.environment}}/phorvex.yaml'
          - '$values/deploy/environments/{{.environment}}/{{.service}}.yaml'
          - '$values/deploy/environments/{{.environment}}/catalogue-family.yaml'
      - repoURL: https://github.com/PhorvexSecurity/operator-refactored.git
        targetRevision: main
        ref: values
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          enabled: true
          # As for the production stack: the namespace holds objects the charts never
          # created (the CRs the services write at runtime), which a prune would delete.
          prune: false
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        # As for the production stack (../apps/phorvex-stack.yaml).
        - ServerSideApply=true
        # Keep the ignored fields below as they are live, even when another change syncs.
        - RespectIgnoreDifferences=true
        retry:
          limit: 3
          backoff:
            duration: 15s
            factor: 2
      ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        jsonPointers:
        - /status
      # The agent-action actuator owns this runtime ledger. The chart creates its
      # clean baseline, but self-heal must not erase a deny between the accepted
      # actuator receipt and the Console's physical oracle/cleanup transaction.
      - kind: ConfigMap
        name: agent-deny-guard
        namespace: p6-demo
        jsonPointers:
        - /data
      # The image catalogue family swaps these fixture containers to an untrusted image and
      # measures Phorvex's registry-rollback restoring the trusted pin. Self-heal would revert
      # that drift first and pre-empt the defense under test, so Argo ignores only the two
      # fixture containers' image field. The fixture digest is reproducible
      # (release/staging-fixture-identities.json); the rollback and the run cleanup restore it.
      - group: apps
        kind: Deployment
        name: demo-api
        namespace: p2-demo
        jqPathExpressions:
        - .spec.template.spec.containers[].image
      - group: apps
        kind: Deployment
        name: demo-api
        namespace: p3-demo
        jqPathExpressions:
        - .spec.template.spec.containers[].image
      # The manager chart generates its admission webhook certificate when it finds
      # none, and Argo CD renders without cluster access, so every render brings a new
      # one. The first sync installs the certificate and its CA bundle together; later
      # renders must not replace either.
      - kind: Secret
        name: '{{.release}}-phorvex-webhook-cert'
        jsonPointers:
        - /data
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration
        jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
