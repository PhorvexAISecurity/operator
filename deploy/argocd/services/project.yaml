# The Argo CD project of the split Phorvex services (applicationset.yaml): the
# service charts of this repository, into phorvex-system only, with exactly the
# cluster-scoped kinds the charts render. NOT applied (phase 5e).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: phorvex-services
  namespace: argocd
spec:
  description: The Phorvex services (ADR-0001), one Application per service.
  sourceRepos:
  - https://github.com/PhorvexSecurity/operator-refactored.git
  destinations:
  - server: '*'
    namespace: phorvex-system
  # tools/test_argocd_services.py requires this list to equal the cluster-scoped
  # kinds every environment renders, plus the namespace CreateNamespace creates.
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicy
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicyBinding
