# The Argo CD project of the split Phorvex services (applicationset.yaml): the
# service charts of this repository, into each environment's namespace only, with
# exactly the cluster-scoped kinds the charts render there.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: phorvex-services
  namespace: argocd
spec:
  description: The Phorvex services (ADR-0001), one Application per service.
  sourceRepos:
  - https://github.com/PhorvexSecurity/operator-refactored.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: phorvex-staging
  # The workload staging defends (demo-staging.yaml).
  - server: https://kubernetes.default.svc
    namespace: phorvex-staging-demo
  # The identity-rotate fixture's shared namespace (phorvex.identityRotate): the
  # per-tenant RBAC Roles the actuator and sensor render to defend console-id-fixture.
  - server: https://kubernetes.default.svc
    namespace: console-identity-shared
  # Exact catalogue fixture profiles are mutually exclusive, but the reviewed
  # destination allow-list includes every fixed lane and workload namespace.
  - server: https://kubernetes.default.svc
    namespace: p1
  - server: https://kubernetes.default.svc
    namespace: p1-demo
  - server: https://kubernetes.default.svc
    namespace: p2
  - server: https://kubernetes.default.svc
    namespace: p2-demo
  - server: https://kubernetes.default.svc
    namespace: p3
  - server: https://kubernetes.default.svc
    namespace: p3-demo
  - server: https://kubernetes.default.svc
    namespace: p4
  - server: https://kubernetes.default.svc
    namespace: p4-demo
  - server: https://kubernetes.default.svc
    namespace: p5
  - server: https://kubernetes.default.svc
    namespace: p5-demo
  - server: https://kubernetes.default.svc
    namespace: p6
  - server: https://kubernetes.default.svc
    namespace: p6-demo
  # tools/test_argocd_services.py requires this list to equal the cluster-scoped
  # kinds every environment renders, plus the namespace CreateNamespace creates.
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  # node-recycle's two bounded KWOK fixture Nodes.
  - group: ''
    kind: Node
  # The attacks service's target guard, which matches only its own requests.
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicy
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicyBinding
