# Exported verbatim from the live cluster on 2026-09-23 (generation 56).
# Source of record for vllm/vllm-defense; see deploy/policies/README.md.
apiVersion: phorvex.ai/v1alpha1
kind: PhorvexPolicy
metadata:
  name: vllm-defense
  namespace: vllm
spec:
  actions:
    enabled:
    - rotate
    - route-rotate
    - kv-reset
    - endpoint-rotate
    - adapter-rotate
    - request-drain
    - guardrail-rotate
    - kv-migrate-invalidate
    - endpoint-lease-revoke
  assetValue:
    blastRadiusFromGraph: true
    fromLabels:
      data-class:
        internal: '0.4'
        public: '0.1'
        restricted: '1.0'
    weightSecrets: '0.8'
  budget:
    antiOverRotationWindow: 90s
    maxGracePeriodSeconds: 30
    maxMovesPerTick: 10
    proactiveFloor: 15m
    tickInterval: 10s
  mode: active
  objective:
    costWeights:
      flowDisruption: '0.6'
      normSparsity: '0.4'
    lambda: '0.5'
  selector:
    matchLabels:
      app: vllm
  slo:
    costCeiling: '1.2'
    minAvailableReplicas: 0
  tenant: vllm
  triggers:
    eventAgeHorizon: 1h
    eventDriven: true
    reactiveOnly: false
