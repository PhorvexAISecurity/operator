# The stateful rotation sample (docs/stateful-rotation.md): a three-member NATS JetStream
# cluster whose owner declares the contract, defended by nats-demo-defense (policy.yaml).
# JetStream re-seeds a member that returns on empty storage from its RAFT peers, so the
# owner declares peer-resync; readiness is the JetStream health endpoint, so a rebuilt
# member is Ready only once its streams are current. The exporter sidecar publishes each
# member's own view of the DEMO stream, which is how the dashboard shows that no message
# is lost across rotations.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-demo-config
  labels:
    app.kubernetes.io/name: nats-demo
    app.kubernetes.io/part-of: phorvex-demo
data:
  nats.conf: |
    port: 4222
    http: 8222
    server_name: $POD_NAME
    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 64MB
      max_file_store: 512MB
    }
    cluster {
      name: nats-demo
      port: 6222
      routes: [
        nats://nats-demo-0.nats-demo-headless.phorvex-staging-demo.svc:6222
        nats://nats-demo-1.nats-demo-headless.phorvex-staging-demo.svc:6222
        nats://nats-demo-2.nats-demo-headless.phorvex-staging-demo.svc:6222
      ]
    }
    lame_duck_duration: "30s"
---
apiVersion: v1
kind: Service
metadata:
  name: nats-demo-headless
  labels:
    app.kubernetes.io/name: nats-demo
    app.kubernetes.io/part-of: phorvex-demo
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: nats-demo
  ports:
  - {name: client, port: 4222}
  - {name: cluster, port: 6222}
  - {name: monitor, port: 8222}
---
apiVersion: v1
kind: Service
metadata:
  name: nats-demo
  labels:
    app.kubernetes.io/name: nats-demo
    app.kubernetes.io/part-of: phorvex-demo
spec:
  selector:
    app.kubernetes.io/name: nats-demo
  ports:
  - {name: client, port: 4222}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nats-demo
  labels:
    app.kubernetes.io/name: nats-demo
    app.kubernetes.io/part-of: phorvex-demo
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats-demo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats-demo
  labels:
    app.kubernetes.io/name: nats-demo
    app.kubernetes.io/part-of: phorvex-demo
  annotations:
    phorvex.ai/stateful-quorum: "2"
    phorvex.ai/stateful-replica-rebuild: peer-resync
    phorvex.ai/stateful-snapshot-class: ebs-csi-snapclass
    phorvex.ai/stateful-recovery-seconds: "180"
    phorvex.ai/stateful-resync-seconds: "300"
spec:
  replicas: 3
  serviceName: nats-demo-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: nats-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats-demo
        app.kubernetes.io/part-of: phorvex-demo
        data-class: restricted
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nats
        image: docker.io/library/nats:2.10.29-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
        args: [--config, /etc/nats/nats.conf]
        env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        ports:
        - {name: client, containerPort: 4222}
        - {name: cluster, containerPort: 6222}
        - {name: monitor, containerPort: 8222}
        readinessProbe:
          httpGet: {path: /healthz, port: monitor}
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - {name: config, mountPath: /etc/nats}
        - {name: data, mountPath: /data}
      - name: exporter
        image: docker.io/natsio/prometheus-nats-exporter:0.20.3@sha256:4b8ddc1c86fec360b5cd3d5e1fbc6fb52bdafd5805bba3901cc52926538af255
        args: [-port=7777, -varz, -jsz=all, -use_internal_server_name, http://localhost:8222]
        ports:
        - {name: metrics, containerPort: 7777}
        resources:
          requests: {cpu: 5m, memory: 16Mi}
          limits: {memory: 64Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: config
        configMap: {name: nats-demo-config}
  # Spelled out as the API server stores it, so Argo CD's diff of the template is clean.
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: gp2-csi
      volumeMode: Filesystem
      resources: {requests: {storage: 1Gi}}
    status:
      phase: Pending
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nats-demo
  labels:
    app.kubernetes.io/name: nats-demo
    app.kubernetes.io/part-of: phorvex-demo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nats-demo
  podMetricsEndpoints:
  - port: metrics
    interval: 15s
    metricRelabelings:
    - action: keep
      sourceLabels: [__name__]
      regex: jetstream_stream_total_messages|jetstream_stream_last_seq|jetstream_server_jetstream_disabled|gnatsd_varz_routes|gnatsd_varz_start_time|nats_up
---
# Seeds the DEMO stream (three replicas, 1000 messages) once; a rerun leaves an existing
# stream untouched, so the message count only changes if a member loses data.
apiVersion: batch/v1
kind: Job
metadata:
  name: nats-demo-seed
  labels:
    app.kubernetes.io/name: nats-demo-seed
    app.kubernetes.io/part-of: phorvex-demo
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats-demo-seed
        app.kubernetes.io/part-of: phorvex-demo
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: seed
        image: docker.io/natsio/nats-box:0.14.5@sha256:0784ab710aefaf6ef037ed797ee7dcde613c6ad208c4dbff1945fc7c1b5b5375
        env:
        - {name: NATS_URL, value: "nats://nats-demo:4222"}
        - {name: HOME, value: /tmp}
        workingDir: /tmp
        command:
        - sh
        - -ec
        - |
          if nats stream info DEMO >/dev/null 2>&1; then echo "DEMO exists"; exit 0; fi
          nats stream add DEMO --subjects "demo.>" --replicas 3 --storage file --retention limits \
            --discard old --max-msgs=-1 --max-bytes=-1 --max-age=0 --max-msg-size=-1 --dupe-window=2m \
            --no-allow-rollup --no-deny-delete --no-deny-purge --defaults
          nats pub demo.orders "order {{Count}}" --count 1000
          nats stream info DEMO
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: tmp
        emptyDir: {}
