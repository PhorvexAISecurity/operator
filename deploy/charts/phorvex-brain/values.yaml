image:
  repository: phorvex-brain
  # Defaults to the chart's appVersion.
  tag: ""
  # The release writes the pushed image's sha256 digest; set, the pod runs
  # exactly that image.
  digest: ""
  pullPolicy: IfNotPresent

# The manager chart's keys, under the same name, so one environment file
# configures both charts. The decision values must match the manager's, or the
# brain refuses the manager at the handshake; every default equals the manager
# chart's (tools/test_service_charts.py). The engine is each binary's default:
# neither chart passes --engine.
phorvex:
  # Mutual TLS between the dispatcher and the brain, sensor and actuator services
  # (ADR-0001, docs/services/service-tls.md). On, every chart mounts its end's
  # Secret, <release>-<end>-grpc-tls, which deploy/eks/provision-service-mtls.sh
  # writes; the services admit only the dispatcher's certificate. Off, gRPC is
  # plaintext.
  serviceTLS:
    enabled: false
  metrics:
    podMonitor:
      enabled: false
      interval: 30s
      environment: ""
      metricRelabelings: []
  gpuEnvelopeMax: 0.2925
  flowResidualClasses: []
  mathLab:
    # Math Lab snapshots of the listed namespace/name policies. With a remote brain
    # the brain records them; the manager refuses capture flags then.
    capturePolicies: []
    captureMaxBytes: 1073741824

# The brain's own Math Lab snapshot store: an existing claim keeps snapshots
# across restarts; empty uses an emptyDir.
mathLabStore:
  existingClaim: ""

shutdownGrace: 20s
log:
  level: info
  format: json

# Only the manager reaches the gRPC port (ADR-0001). Its pods are selected by
# these labels in the namespace below (empty: the release namespace).
dispatcher:
  namespace: ""
  podLabels:
    app.kubernetes.io/name: phorvex
    app.kubernetes.io/component: manager

# Namespaces whose Prometheus may scrape the metrics port; empty allows none.
metricsScraperNamespaces: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
