{{- $v := .Values.phorvex }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "phorvex-brain.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phorvex-brain.labels" . | nindent 4 }}
spec:
  # One brain: its cost learner, kill-chain stage clocks and retired owners live in
  # memory (ADR-0001). Recreate never runs two at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "phorvex-brain.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "phorvex-brain.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "phorvex-brain.fullname" . }}
      # The brain reads no Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: brain
        {{- with .Values.image.digest }}{{ if not (regexMatch "^sha256:[0-9a-f]{64}$" .) }}{{ fail "image.digest must be sha256:<64 lowercase hex>" }}{{ end }}{{ end }}
        image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}{{ with .Values.image.digest }}@{{ . }}{{ end }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --listen=:9090
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        {{- /* The manager chart's decision flags, derived the same way. */}}
        - --gpu-envelope-max={{ $v.gpuEnvelopeMax }}
        {{- with $v.flowResidualClasses }}
        - --flow-residual-classes={{ join "," . }}
        {{- end }}
        - --shutdown-grace={{ .Values.shutdownGrace }}
        - --log-level={{ .Values.log.level }}
        - --log-format={{ .Values.log.format }}
        {{- with $v.mathLab.capturePolicies }}
        - --math-lab-capture-policies={{ join "," . }}
        - --math-lab-capture-dir=/var/lib/phorvex/math-lab
        - --math-lab-capture-max-bytes={{ $v.mathLab.captureMaxBytes | int64 }}
        {{- end }}
        {{- if $v.serviceTLS.enabled }}
        {{- include "phorvex-common.serviceTLS.args" (dict "root" . "end" "brain") | nindent 8 }}
        {{- end }}
        ports:
        - name: grpc
          containerPort: 9090
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- if or $v.mathLab.capturePolicies $v.serviceTLS.enabled }}
        volumeMounts:
        {{- if $v.mathLab.capturePolicies }}
        - name: math-lab
          mountPath: /var/lib/phorvex/math-lab
        {{- end }}
        {{- if $v.serviceTLS.enabled }}
        {{- include "phorvex-common.serviceTLS.volumeMount" . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- if or $v.mathLab.capturePolicies $v.serviceTLS.enabled }}
      volumes:
      {{- if $v.mathLab.capturePolicies }}
      - name: math-lab
        {{- if .Values.mathLabStore.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.mathLabStore.existingClaim }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- end }}
      {{- if $v.serviceTLS.enabled }}
      {{- include "phorvex-common.serviceTLS.volume" (dict "root" . "end" "brain") | nindent 6 }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
