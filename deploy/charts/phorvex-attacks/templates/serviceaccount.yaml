{{- if .Values.phorvex.console.enabled }}
# Its grants are the manager chart's (console-rbac.yaml and the live-arm RBAC), which
# bind this account once phorvex.services.attacks.endpoint names this service.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "phorvex-common.attacksServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phorvex.labels" . | nindent 4 }}
    app.kubernetes.io/component: attacks
{{- end }}
