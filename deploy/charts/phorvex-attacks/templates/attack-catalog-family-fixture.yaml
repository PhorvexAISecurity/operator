{{- $v := .Values.phorvex -}}
{{- $fixture := dig "console" "attackCatalog" "familyFixtures" (dict "enabled" false) $v -}}
{{- if dig "enabled" false $fixture -}}
{{- if not (dig "console" "attackCatalog" "enabled" false $v) }}{{- fail "familyFixtures.enabled requires console.attackCatalog.enabled" }}{{- end }}
{{- if not (has (dig "actuator" "" $v) (list "native" "hybrid")) }}{{- fail "family fixtures require native or hybrid actuator" }}{{- end }}
{{- $family := required "familyFixtures.profile must select exactly one reviewed family" (dig "profile" "" $fixture) -}}
{{- $families := list "agent-action" "controller-stop" "credential" "datastore" "identity-sa-rotate" "image" "network-edge" "node-recycle" "pod-rotate" "quarantine" "sensitive-output" "serving-kv" "serving-rate" -}}
{{- if not (has $family $families) }}{{- fail "familyFixtures.profile is not one of the 13 reviewed families" }}{{- end }}
{{- if ne (dig "cleanupPolicy" "" $fixture) "Delete" }}{{- fail "familyFixtures.cleanupPolicy must be Delete" }}{{- end }}
{{- $agentEnabled := dig "console" "attackCatalog" "agentAction" "enabled" false $v -}}
{{- if and (eq $family "agent-action") (not $agentEnabled) }}{{- fail "agent-action profile requires agentAction.enabled" }}{{- end }}
{{- if and (ne $family "agent-action") $agentEnabled }}{{- fail "agentAction.enabled is exclusive to the agent-action profile" }}{{- end }}
{{- $destinations := list -}}
{{- $lanes := list -}}
{{- $action := "" -}}
{{- $workload := "demo-api" -}}
{{- $policy := "demo-api-defense" -}}
{{- if eq $family "quarantine" }}{{ $destinations = list "p1-demo" }}{{ $lanes = list "p1" }}{{ $action = "quarantine" }}
{{- else if or (eq $family "pod-rotate") (eq $family "datastore") (eq $family "network-edge") }}{{ $destinations = list "p2-demo" }}{{ $lanes = list "p2" }}{{ if eq $family "pod-rotate" }}{{ $action = "rotate" }}{{ else if eq $family "datastore" }}{{ $action = "datastore-restore" }}{{ $workload = "rag-store" }}{{ $policy = "datastore-defense" }}{{ else }}{{ $action = "network-isolate" }}{{ end }}
{{- else if eq $family "image" }}{{ $destinations = list "p2-demo" "p3-demo" }}{{ $lanes = list "p2" "p3" }}{{ $action = "registry-rollback" }}
{{- else if eq $family "node-recycle" }}{{ $destinations = list "p3-demo" }}{{ $lanes = list "p3" }}{{ $action = "node-cordon-drain-replace" }}{{ $policy = "node-defense" }}
{{- else if or (eq $family "controller-stop") (eq $family "credential") }}{{ $destinations = list "p4-demo" }}{{ $lanes = list "p4" }}{{ if eq $family "controller-stop" }}{{ $action = "controller-stop" }}{{ else }}{{ $action = "credential-revoke" }}{{ end }}
{{- else if eq $family "serving-rate" }}{{ $destinations = list "p5-demo" }}{{ $lanes = list "p5" }}{{ $action = "throttle" }}{{ $workload = "rate-target" }}{{ $policy = "serving-rate-defense" }}
{{- else if eq $family "identity-sa-rotate" }}{{ $destinations = list "console-identity-shared" }}{{ $lanes = list "p6" }}{{ $action = "identity-rotate" }}{{ $workload = "console-id-fixture" }}{{ $policy = "console-id-fixture" }}
{{- else if eq $family "sensitive-output" }}{{ $destinations = list "p6-demo" }}{{ $lanes = list "p6" }}{{ $action = "sensitive-output-policy-activate" }}{{ $workload = "guardrail-output-fixture" }}{{ $policy = "guardrail-output-fixture" }}
{{- else if eq $family "serving-kv" }}{{ $destinations = list "p6-demo" }}{{ $lanes = list "p6" }}{{ $action = "kv-reset" }}{{ $workload = "kv-serving" }}{{ $policy = "kv-serving-defense" }}
{{- else if eq $family "agent-action" }}{{ $destinations = list "p6-demo" }}{{ $lanes = list "p6" }}{{ $action = "agent-action-deny" }}{{ $workload = "agent-sim" }}{{ $policy = "agent-defense" }}
{{- end }}
{{- range $namespace := $destinations -}}
{{- if not (has $namespace (dig "policyNamespaces" (list) $v)) }}{{- fail (printf "family fixture destination %s must be in policyNamespaces" $namespace) }}{{- end }}
{{- if not (has $namespace (dig "actuatorNamespaces" (list) $v)) }}{{- fail (printf "family fixture destination %s must be in actuatorNamespaces" $namespace) }}{{- end }}
{{- if not (has $namespace (dig "console" "attackNamespaces" (list) $v)) }}{{- fail (printf "family fixture destination %s must be in console.attackNamespaces" $namespace) }}{{- end }}
{{- end }}
{{- $attacksSA := include "phorvex-common.attacksServiceAccountName" . -}}
{{- $trusted := false -}}
{{- range (dig "trustedDetectors" (list) $v) -}}{{- range splitList "," . -}}{{- $entry := trim . -}}{{- if or (eq $entry (printf "%s/%s" $.Release.Namespace $attacksSA)) (eq $entry (printf "%s:%s" $.Release.Namespace $attacksSA)) (eq $entry (printf "system:serviceaccount:%s:%s" $.Release.Namespace $attacksSA)) }}{{- $trusted = true -}}{{- end }}{{- end }}{{- end }}
{{- if not $trusted }}{{- fail (printf "family fixture requires exact attacks creator %s/%s in trustedDetectors" .Release.Namespace $attacksSA) }}{{- end }}
{{- $images := dig "images" (dict) $fixture -}}
{{- $workloadImage := dig "workload" "" $images -}}
{{- $phorvexImage := dig "phorvex" "" $images -}}
{{- $pythonImage := dig "python" "" $images -}}
{{- $kwokImage := dig "kwok" "" $images -}}
{{- $imagePattern := "^[^[:space:]@]+@sha256:[0-9a-f]{64}$" -}}
{{- if and (has $family (list "controller-stop" "credential" "image" "network-edge" "node-recycle" "pod-rotate" "quarantine")) (not (regexMatch $imagePattern $workloadImage)) }}{{- fail "selected family requires familyFixtures.images.workload as repository@sha256" }}{{- end }}
{{- if and (eq $family "identity-sa-rotate") (ne $workloadImage "") }}{{- fail "identity-sa-rotate uses the externally owned reviewed identity fixture and must not package a workload image" }}{{- end }}
{{- if and (has $family (list "datastore" "serving-kv" "serving-rate")) (not (regexMatch $imagePattern $phorvexImage)) }}{{- fail "selected family requires familyFixtures.images.phorvex as repository@sha256" }}{{- end }}
{{- if and (has $family (list "sensitive-output" "serving-kv")) (not (regexMatch $imagePattern $pythonImage)) }}{{- fail "selected family requires immutable familyFixtures.images.python" }}{{- end }}
{{- if and (eq $family "node-recycle") (not (regexMatch $imagePattern $kwokImage)) }}{{- fail "node-recycle requires immutable familyFixtures.images.kwok" }}{{- end }}
{{- if eq $family "sensitive-output" -}}
{{- $outputNames := dig "outputPolicy" "configMapNames" (list) $v -}}
{{- if not (and (dig "outputPolicy" "enabled" false $v) (eq (dig "outputPolicy" "targetNamespace" "" $v) "p6-demo") (eq (sortAlpha $outputNames | join ",") "phorvex-output-policy-gfx-t0069,phorvex-output-policy-gfx-t0069-001,phorvex-output-policy-gfx-t0069-002")) }}{{- fail "sensitive-output requires the three exact p6-demo output policies" }}{{- end }}
{{- end }}
{{- if and (eq $family "serving-kv") (ne (dig "servingSecurity" "mode" "" $v) "legacy-plaintext") }}{{- fail "serving-kv fixture requires servingSecurity.mode=legacy-plaintext" }}{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-catalogue-family-profile
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}
    phorvex.ai/cleanup-policy: Delete
data:
  selected-family: {{ $family | quote }}
  expected-action: {{ $action | quote }}
  profiles.yaml: |
{{ .Files.Get "files/catalogue-family-profiles.yaml" | indent 4 }}
{{- range $i, $namespace := $destinations }}
{{- if ne $namespace "console-identity-shared" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}
    phorvex.ai/cleanup-policy: Delete
{{- if eq $family "agent-action" }}
    phorvex.ai/attack-catalog-agent-action: "true"
{{- end }}
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: catalogue-fixture-budget
  namespace: {{ $namespace }}
  labels:
    phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}
    phorvex.ai/cleanup-policy: Delete
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "40"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: catalogue-fixture-defaults
  namespace: {{ $namespace }}
  labels:
    phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}
    phorvex.ai/cleanup-policy: Delete
spec:
  limits:
  - type: Container
    defaultRequest: {cpu: 10m, memory: 16Mi}
    default: {cpu: 500m, memory: 256Mi}
{{- end }}
{{- end }}
{{- range $lane := $lanes }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $lane }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}
    phorvex.ai/cleanup-policy: Delete
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $lane }}-attacks
  namespace: {{ $lane }}
  labels:
    phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}
    phorvex.ai/cleanup-policy: Delete
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: catalogue-fixture-budget
  namespace: {{ $lane }}
  labels:
    phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}
    phorvex.ai/cleanup-policy: Delete
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: catalogue-fixture-defaults
  namespace: {{ $lane }}
  labels:
    phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}
    phorvex.ai/cleanup-policy: Delete
spec:
  limits:
  - type: Container
    defaultRequest: {cpu: 10m, memory: 16Mi}
    default: {cpu: 500m, memory: 256Mi}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $.Release.Name }}-{{ $lane }}-fixture-signal
  labels:
    phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}
    phorvex.ai/cleanup-policy: Delete
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "phorvex.fullname" $ }}-attacks-role
subjects:
- kind: ServiceAccount
  name: {{ $lane }}-attacks
  namespace: {{ $lane }}
{{- end }}
{{- if and (ne $family "agent-action") (ne $family "identity-sa-rotate") }}
{{- range $namespace := $destinations }}
{{- $isGeneric := has $family (list "controller-stop" "credential" "image" "network-edge" "node-recycle" "pod-rotate" "quarantine") -}}
{{- if $isGeneric }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: {{ $namespace }}
  labels: &fixtureLabels
    app.kubernetes.io/name: demo-api
    phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}
    phorvex.ai/cleanup-policy: Delete
  {{- if eq $family "image" }}
  annotations:
    phorvex.ai/trusted-image-ref: {{ $workloadImage | quote }}
  {{- end }}
spec:
  replicas: 3
  selector: {matchLabels: {app.kubernetes.io/name: demo-api}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
        data-class: internal
        phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}
      {{- if eq $family "image" }}
      annotations:
        phorvex.ai/trusted-image-ref: {{ $workloadImage | quote }}
      {{- end }}
    spec:
      serviceAccountName: demo-api
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      {{- if eq $family "controller-stop" }}
      # The strict controller-stop oracle requires the two non-target siblings
      # to remain intact. Keep this staging-only fixture off interruptible nodes
      # so unrelated Spot replacement cannot be mistaken for actuator fallout.
      nodeSelector: {eks.amazonaws.com/capacityType: ON_DEMAND}
      # The fixture is 10m CPU / 16Mi per replica. Permit the long-lived
      # ON_DEMAND system pools so strict QA does not scale a disposable node
      # merely to obtain a second failure domain.
      tolerations:
      - {key: CriticalAddonsOnly, operator: Equal, value: "true", effect: NoSchedule}
      topologySpreadConstraints:
      - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: demo-api}}}
      {{- else if eq $family "node-recycle" }}
      nodeSelector: {phorvex.ai/lane: p3}
      tolerations:
      - {key: phorvex.ai/kwok, operator: Equal, value: "true", effect: NoSchedule}
      topologySpreadConstraints:
      - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app.kubernetes.io/name: demo-api}}}
      {{- end }}
      containers:
      - name: web
        image: {{ $workloadImage | quote }}
        imagePullPolicy: IfNotPresent
        ports: [{name: http, containerPort: 8080}]
        {{- if eq $family "image" }}
        # The image family replaces this container with an untrusted image that serves the
        # app port but not the fixture's /healthz route; readiness is the served port.
        readinessProbe: {tcpSocket: {port: http}, periodSeconds: 3}
        {{- else }}
        readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 3}
        {{- end }}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: [ALL]}}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 200m, memory: 64Mi}
        {{- if eq $family "image" }}
        # The untrusted nginx images write their pid and temp paths under /tmp; the root
        # filesystem stays read-only.
        volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 16Mi}}]
        {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-api
  namespace: {{ $namespace }}
  labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: {{ $namespace }}
  labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}
spec:
  selector: {app.kubernetes.io/name: demo-api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demo-api
  namespace: {{ $namespace }}
  labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}
spec:
  minAvailable: {{ if eq $family "network-edge" }}3{{ else }}2{{ end }}
  selector: {matchLabels: {app.kubernetes.io/name: demo-api}}
{{- end }}
---
apiVersion: phorvex.ai/v1alpha1
kind: PhorvexPolicy
metadata:
  name: {{ $policy }}
  namespace: {{ $namespace }}
  labels:
    phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}
    phorvex.ai/cleanup-policy: Delete
spec:
  tenant: {{ $namespace }}
  mode: active
  selector:
    matchLabels:
      {{- if $isGeneric }}
      app.kubernetes.io/name: demo-api
      {{- else if eq $family "serving-kv" }}
      app.kubernetes.io/name: kv-serving
      {{- else if eq $family "sensitive-output" }}
      app: guardrail-fixture
      {{- else }}
      app: {{ $workload }}
      {{- end }}
  actions:
    {{- if eq $family "quarantine" }}
    enabled: [rotate, quarantine]
    {{- else if eq $family "controller-stop" }}
    enabled: [rotate]
    {{- else if eq $family "node-recycle" }}
    enabled: [node-cordon-drain-replace, rotate, quarantine]
    {{- else if eq $family "serving-kv" }}
    enabled: [rotate, kv-reset]
    {{- else }}
    enabled: [{{ $action }}]
    {{- end }}
  assetValue:
    blastRadiusFromGraph: true
    fromLabels: {data-class: {internal: "0.4", public: "0.1", restricted: "1.0"}}
    weightSecrets: "0.8"
  budget: {antiOverRotationWindow: 90s, maxGracePeriodSeconds: 30, maxMovesPerTick: 1, proactiveFloor: 15m, tickInterval: 5s}
  objective: {costWeights: {flowDisruption: "0.6", normSparsity: "0.4"}, disruptionAversion: "1", lambda: "0"}
  slo:
    costCeiling: {{ if has $family (list "pod-rotate" "controller-stop") }}"1.7"{{ else }}"1.2"{{ end }}
    minAvailableReplicas: {{ if eq $family "network-edge" }}3{{ else if has $family (list "quarantine" "pod-rotate" "controller-stop" "node-recycle") }}2{{ else }}1{{ end }}
  triggers: {eventAgeHorizon: 1h, eventDriven: true, reactiveOnly: true}
{{- end }}
{{- end }}
{{- if eq $family "datastore" }}
{{- $snapshot := "{\"records\":[{\"id\":\"benign-control\",\"content\":\"reviewed benign catalogue fixture\"}]}" -}}
{{- range $name := list "datastore-trusted-snapshot" "datastore-content" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: p2-demo
  labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}
data:
  store.json: {{ $snapshot | quote }}
  {{- if eq $name "datastore-trusted-snapshot" }}
  store.sha256: {{ sha256sum $snapshot | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: rag-store, namespace: p2-demo, labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: rag-store-read, namespace: p2-demo, labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}}
rules:
- {apiGroups: [""], resources: [configmaps], resourceNames: [datastore-content], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: rag-store-read, namespace: p2-demo, labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: rag-store-read}
subjects: [{kind: ServiceAccount, name: rag-store, namespace: p2-demo}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-store
  namespace: p2-demo
  labels: {app: rag-store, phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}
spec:
  replicas: 2
  selector: {matchLabels: {app: rag-store}}
  template:
    metadata: {labels: {app: rag-store, data-class: internal}}
    spec:
      serviceAccountName: rag-store
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: store
        image: {{ $phorvexImage | quote }}
        command: [/ragstore-fixture]
        ports: [{name: http, containerPort: 8080}]
        readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 3}
        env: [{name: POD_NAMESPACE, value: p2-demo}, {name: STORE_CONFIGMAP, value: datastore-content}, {name: STORE_KEY, value: store.json}]
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 200m, memory: 64Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: rag-store, namespace: p2-demo, labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}}
spec: {selector: {app: rag-store}, ports: [{name: http, port: 8080, targetPort: 8080}]}
{{- end }}
{{- if eq $family "network-edge" }}
---
apiVersion: v1
kind: Pod
metadata:
  name: c2-sink
  namespace: p2-demo
  labels: {app: c2-sink, phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
  containers:
  - name: sink
    image: {{ $workloadImage | quote }}
    ports: [{name: http, containerPort: 8080}]
    resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
    securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: c2-sink, namespace: p2-demo, labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}}
spec: {selector: {app: c2-sink}, ports: [{name: http, port: 8080, targetPort: http}]}
---
# Exact cleanup removes the network-isolate NetworkPolicy (UID precondition) and the
# isolation markers on the target Pod; the attacks identity only reads them otherwise.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ $attacksSA }}-network-edge-fixture, namespace: p2-demo, labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}}
rules:
- {apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [get, delete]}
- {apiGroups: [""], resources: [pods], verbs: [get, update]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ $attacksSA }}-network-edge-fixture, namespace: p2-demo, labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $attacksSA }}-network-edge-fixture}
subjects: [{kind: ServiceAccount, name: {{ $attacksSA }}, namespace: {{ .Release.Namespace }}}]
{{- end }}
{{- if eq $family "node-recycle" }}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: kwok-controller-p3, namespace: p3-demo, labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}}
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kwok-controller-p3, namespace: p3-demo, labels: {app: kwok-controller-p3, phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}}
spec:
  replicas: 1
  selector: {matchLabels: {app: kwok-controller-p3}}
  template:
    metadata: {labels: {app: kwok-controller-p3}}
    spec:
      serviceAccountName: kwok-controller-p3
      # The upstream kwok image declares no USER; pin an unprivileged UID so runAsNonRoot admits it.
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: kwok
        image: {{ $kwokImage | quote }}
        # kwok v0.8 ships no built-in lifecycle; the reviewed upstream stages make the fake
        # nodes Ready and run the Pods scheduled onto them.
        args: [--manage-all-nodes=false, --manage-nodes-with-annotation-selector=kwok.x-k8s.io/node=fake, --config=/etc/kwok/stages.yaml]
        resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
