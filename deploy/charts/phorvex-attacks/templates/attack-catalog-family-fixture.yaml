apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ $name }}, namespace: p5-demo, labels: {app: {{ $name }}, phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}}
spec:
  replicas: 1
  selector: {matchLabels: {app: {{ $name }}}}
  template:
    metadata: {labels: {app: {{ $name }}, data-class: internal}}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: {{ or (eq $name "rate-admission") (eq $name "rate-detector") }}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: {{ $name }}
        image: {{ $phorvexImage | quote }}
        command: [{{ if eq $name "rate-admission" }}/cost-admission{{ else if eq $name "rate-detector" }}/cost-load-detector{{ else }}/ragstore-fixture{{ end }}]
        {{- if eq $name "rate-admission" }}
        env:
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - name: POD_UID
          valueFrom: {fieldRef: {fieldPath: metadata.uid}}
        - {name: PHORVEX_THROTTLE_BACKEND, value: http://rate-target-backend.p5-demo.svc:8080}
        {{- else if eq $name "rate-detector" }}
        env:
        - {name: PHORVEX_THROTTLE_NAMESPACE, value: p5-demo}
        - {name: PHORVEX_THROTTLE_POLICY, value: serving-rate-defense}
        - {name: PHORVEX_THROTTLE_DETECTOR_IDENTITY, value: "system:serviceaccount:p5-demo:rate-detector"}
        - {name: PHORVEX_THROTTLE_SOURCE, value: phorvex-rate-detector-p5}
        - {name: PHORVEX_THROTTLE_DEPLOYMENT, value: rate-admission}
        - {name: PHORVEX_THROTTLE_SERVICE, value: rate-target}
        - {name: PHORVEX_THROTTLE_BACKEND, value: rate-target-backend}
        - {name: PHORVEX_THROTTLE_TARGET_APP, value: rate-target}
        - {name: PHORVEX_THROTTLE_SOURCE_SHA256, value: {{ $sourceSHA | quote }}}
        - {name: PHORVEX_THROTTLE_PROXY_IMAGE, value: {{ $phorvexImage | quote }}}
        {{- end }}
        ports: [{name: http, containerPort: 8080}]
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 200m, memory: 64Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
{{- end }}
---
apiVersion: v1
kind: Service
metadata: {name: rate-target, namespace: p5-demo, labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}}
spec: {selector: {app: rate-admission}, ports: [{name: http, port: 80, targetPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: rate-target-backend, namespace: p5-demo, labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}}
spec: {selector: {app: rate-target}, ports: [{name: http, port: 8080, targetPort: 8080}]}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: phorvex-serving-rate-budget, namespace: p5-demo, labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}}
data:
  state.json: {{ printf "{\"version\":1,\"revision\":0,\"sourceSHA256\":%q,\"proxyImage\":%q,\"abusiveAccount\":\"system:serviceaccount:p5-demo:rate-abusive\",\"legitimateAccount\":\"system:serviceaccount:p5-demo:rate-legit\",\"path\":\"/\",\"calibrating\":false,\"enabled\":false,\"baseline\":10,\"reserved\":10,\"burst\":10}" $sourceSHA $phorvexImage | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: phorvex-serving-rate-status, namespace: p5-demo, labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}}
data: {state.json: "{}"}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: phorvex-throttle-journal, namespace: p5, labels: {phorvex.ai/catalogue-fixture-profile: {{ $family | quote }}, phorvex.ai/cleanup-policy: Delete}}
data: {state.json: ""}
{{- end }}
{{- end }}
