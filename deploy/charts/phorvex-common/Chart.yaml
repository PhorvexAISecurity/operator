apiVersion: v2
name: phorvex-common
description: >-
  Templates the Phorvex service charts share (ADR-0001), so what must agree
  between the services is defined once. `phorvex-common.rbac.objects` is their
  Kubernetes access: the manager acting in process holds all of it; split, the
  sensor holds only reads, the actuator the workload writes and the dispatcher
  its own writes.
type: library
version: 0.1.0
