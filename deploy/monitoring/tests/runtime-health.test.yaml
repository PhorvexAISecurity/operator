# Dummy series only; CI renders the manual object to rules.yaml alongside this fixture.
rule_files:
- rules.yaml
evaluation_interval: 30s
tests:
- name: healthy deployments and excluded apps
  interval: 1m
  input_series:
  - series: up{namespace="phorvex-system",job="monitoring/phorvex-operator",pod="dummy-engine"}
    values: 1x90
  - series: phorvex_mathlab_store_bytes{namespace="phorvex-system",job="monitoring/phorvex-operator",pod="dummy-engine"}
    values: '0x90'
  - series: kube_deployment_spec_replicas{namespace="phorvex-system",deployment="phorvex-phorvex"}
    values: 1x20
  - series: kube_deployment_status_replicas_available{namespace="phorvex-system",deployment="phorvex-phorvex"}
    values: 1x20
  - series: kube_deployment_spec_replicas{namespace="phorvex-system",deployment="phorvex-phorvex-console"}
    values: 1x20
  - series: kube_deployment_status_replicas_available{namespace="phorvex-system",deployment="phorvex-phorvex-console"}
    values: 1x20
  - series: kube_deployment_spec_replicas{namespace="voice",deployment="voice-bot"}
    values: 3x20
  - series: kube_deployment_status_replicas_available{namespace="voice",deployment="voice-bot"}
    values: 3x20
  - series: kube_deployment_spec_replicas{namespace="mcp",deployment="mcp-server"}
    values: 1x20
  - series: kube_deployment_status_replicas_available{namespace="mcp",deployment="mcp-server"}
    values: 1x20
  - series: kube_deployment_spec_replicas{namespace="crm",deployment="crm"}
    values: 3x20
  - series: kube_deployment_status_replicas_available{namespace="crm",deployment="crm"}
    values: '0x20'
  - series: container_spec_memory_limit_bytes{namespace="phorvex-system",container="manager"}
    values: '0x20'
  - series: container_memory_working_set_bytes{namespace="phorvex-system",container="manager"}
    values: 1000000x20
  alert_rule_test:
  - eval_time: 10m
    alertname: PhorvexDeploymentReplicasUnavailable
    exp_alerts: &id001 []
- name: replica deficit
  interval: 1m
  input_series:
  - series: up{namespace="phorvex-system",job="monitoring/phorvex-operator",pod="dummy-engine"}
    values: 1x90
  - series: phorvex_mathlab_store_bytes{namespace="phorvex-system",job="monitoring/phorvex-operator",pod="dummy-engine"}
    values: '0x90'
  - series: kube_deployment_spec_replicas{namespace="phorvex-system",deployment="phorvex-phorvex"}
    values: 1x20
  - series: kube_deployment_status_replicas_available{namespace="phorvex-system",deployment="phorvex-phorvex"}
    values: '0x20'
  - series: kube_deployment_spec_replicas{namespace="phorvex-system",deployment="phorvex-phorvex-console"}
    values: 1x20
  - series: kube_deployment_status_replicas_available{namespace="phorvex-system",deployment="phorvex-phorvex-console"}
    values: '0x20'
  - series: kube_deployment_spec_replicas{namespace="voice",deployment="voice-bot"}
    values: 3x20
  - series: kube_deployment_status_replicas_available{namespace="voice",deployment="voice-bot"}
    values: '0x20'
  - series: kube_deployment_spec_replicas{namespace="mcp",deployment="mcp-server"}
    values: 1x20
  - series: kube_deployment_status_replicas_available{namespace="mcp",deployment="mcp-server"}
    values: '0x20'
  alert_rule_test:
  - eval_time: 4m
    alertname: PhorvexDeploymentReplicasUnavailable
    exp_alerts: *id001
  - eval_time: 6m
    alertname: PhorvexDeploymentReplicasUnavailable
    exp_alerts:
    - exp_labels:
        phorvex_cluster: dev
        namespace: phorvex-system
        deployment: phorvex-phorvex
        severity: warning
      exp_annotations: &id002
        summary: Expected application deployment has a replica deficit
    - exp_labels:
        phorvex_cluster: dev
        namespace: phorvex-system
        deployment: phorvex-phorvex-console
        severity: warning
      exp_annotations: *id002
    - exp_labels:
        phorvex_cluster: dev
        namespace: voice
        deployment: voice-bot
        severity: warning
      exp_annotations: *id002
    - exp_labels:
        phorvex_cluster: dev
        namespace: mcp
        deployment: mcp-server
        severity: warning
      exp_annotations: *id002
- name: replica recovery
