      exp_annotations: *id002
    - exp_labels:
        phorvex_cluster: dev
        namespace: mcp
        deployment: mcp-server
        severity: warning
      exp_annotations: *id002
  - eval_time: 8m
    alertname: PhorvexDeploymentReplicasUnavailable
    exp_alerts: *id001
