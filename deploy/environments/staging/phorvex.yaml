# Staging: the split services in the vcluster phorvex-staging on the production
# cluster, before production (ADR-0001, deploy/argocd/services/README.md).
#
# Every chart reads this file: the manager chart's keys under `phorvex`, which the
# brain, sensor and actuator charts read under the same name, so the trust and
# decision values their handshakes compare are set once.
phorvex:
  # The manager reaches each service through its chart's Service, in the same
  # namespace; each chart is released as `phorvex`.
  services:
    brain:
      endpoint: phorvex-brain:9090
    sensor:
      endpoint: phorvex-sensor:9090
    actuator:
      endpoint: phorvex-actuator:9090
