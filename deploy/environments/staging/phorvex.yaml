# Staging only: native, namespace-confined console loops beside the existing demo.
# Retain staging monitoring and prepared ingress settings; ingress stays disabled
# so these loops provision no load balancer. Access through the console tunnel.
phorvex:
  services:
    brain:
      endpoint: staging-brain:9090
    sensor:
      endpoint: staging-sensor:9090
    actuator:
      endpoint: staging-actuator:9090
    attacks:
      endpoint: staging-attacks:8090
  policyNamespaces:
  - phorvex-staging
  actuator: native
  actuatorNamespaces:
  - phorvex-staging
  globalKillSwitch: false
  admissionWebhook:
    enabled: false
  eventIdentityPolicy:
    enabled: false
    external: phorvex-system-phorvex-phorvex-se-creator-8acf73b8d0
  trustedDetectors:
  - phorvex-staging/staging-attacks
  prometheusUrl: http://kube-prom-stack-kube-prome-prometheus.monitoring.svc.cluster.local:9090
  metrics:
    podMonitor:
      enabled: true
      environment: staging
      metricRelabelings:
      - sourceLabels:
        - __name__
        regex: phorvex_cost_nan_unactionable_total
        targetLabel: __name__
        replacement: phorvex_staging_cost_nan_unactionable_total
    dashboard:
      enabled: true
    rules:
      enabled: true
  console:
    ingress:
      enabled: false
      className: alb
      host: staging-console.phorvex.ai
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
        alb.ingress.kubernetes.io/ssl-redirect: '443'
        alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-2:753556437180:certificate/6f771a0d-5c30-4897-bcba-9422024cd3b6
        alb.ingress.kubernetes.io/subnets: subnet-0e2c4f3f433045f81,subnet-08bd0af4dcc7672e2
        alb.ingress.kubernetes.io/security-groups: sg-098aac8d74e88e2fe
        alb.ingress.kubernetes.io/manage-backend-security-group-rules: 'true'
        alb.ingress.kubernetes.io/auth-type: cognito
        alb.ingress.kubernetes.io/auth-scope: openid
        alb.ingress.kubernetes.io/auth-on-unauthenticated-request: authenticate
        alb.ingress.kubernetes.io/auth-idp-cognito: '{"userPoolARN":"arn:aws:cognito-idp:us-east-2:753556437180:userpool/us-east-2_JfwlBPRbB","userPoolClientID":"5njtljkiehde7iesciehr6a562","userPoolDomain":"phorvex-console-753556437180"}'
        external-dns.alpha.kubernetes.io/hostname: staging-console.phorvex.ai
    enabled: true
    newstackLoops:
      enabled: true
    attackNamespaces:
    - phorvex-staging
    allowWorkloadMutations: false
    auditTransport:
      serverSecretName: staging-phorvex-audit-server
      clientSecretName: staging-phorvex-audit-client
      serverDNSName: staging-phorvex-audit-source.phorvex-staging.svc
      clientDNSName: staging-phorvex-console.phorvex-staging.svc
    state:
      persistence:
        storageClass: gp2-csi
        size: 1Gi
    auth:
      oidc:
        issuer: https://oidc.eks.us-east-2.amazonaws.com/id/B4E80A6F4AB1E51169435AFFDC706401
        audience: phorvex-staging-console
        jwksUrl: https://oidc.eks.us-east-2.amazonaws.com/id/B4E80A6F4AB1E51169435AFFDC706401/keys
        algorithms:
        - RS256
      e2eIdentity:
        enabled: true
      grants:
        enabled: true
        create: true
        data: |-
          {
            "version": 1,
            "subjects": [{
              "issuer": "https://oidc.eks.us-east-2.amazonaws.com/id/B4E80A6F4AB1E51169435AFFDC706401",
              "subject": "system:serviceaccount:phorvex-staging:staging-phorvex-console-e2e",
              "roles": ["operator"],
              "tenants": ["phorvex-staging"],
              "targets": ["default"],
              "note": "Disposable staging loops only"
            }]
          }
  crmRefundRevoke:
    enabled: true
    namespace: phorvex-staging
  injectorIdentity: phorvex-staging/staging-attacks
  audit:
    enabled: true
    persistence:
      storageClass: gp2-csi
      size: 1Gi
metricsScraperNamespaces:
- monitoring
