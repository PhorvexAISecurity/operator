# The brain chart's own staging values (deploy/charts/phorvex-brain), merged after phorvex.yaml.
# The release (phase 5c) writes the published brain image here, under `image`.
image:
  repository: "753556437180.dkr.ecr.us-east-2.amazonaws.com/phorvex/staging/brain"
  tag: "staging-0.10.0-git-d246cb2d74f256207f9a575fde2b81599aa3f6df"
  digest: "sha256:80d8a5d0c4b08e001d3c980d8fcc7f0caa39319f841fbd1c89924b2438234a98"
# Persist the allowlisted capture across normal staging image releases.
phorvex:
  mathLab:
    capturePolicies:
      - phorvex-staging-demo/demo-api-defense
      - phorvex-staging-demo/stage-bench-defense
    captureMaxBytes: 1073741824
mathLabStore:
  existingClaim: staging-brain-mathlab
# The existing math-lab EBS volume is zonal (us-east-2b). Keep the core Brain
# off interruptible capacity and permit the long-lived system pool in that AZ;
# otherwise a node replacement leaves the RWO PVC permanently unschedulable.
nodeSelector:
  eks.amazonaws.com/capacityType: ON_DEMAND
tolerations:
  - key: CriticalAddonsOnly
    operator: Equal
    value: "true"
    effect: NoSchedule
