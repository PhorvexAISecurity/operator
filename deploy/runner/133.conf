[Unit]
Requires=phvx-runner-capacity.service
After=phvx-runner-capacity.service

[Service]
Slice=phvxci.slice
CPUAccounting=yes
MemoryAccounting=yes
IOAccounting=yes
KillMode=mixed
Restart=no
TimeoutStopSec=5min
ExecStartPre=
ExecStartPre=+/usr/local/libexec/phvx-runner-start-guard 133
EnvironmentFile=/run/phvx-runner-capacity.env
Environment=DOCKER_CONFIG=/home/github-runner/.docker-phorvex-1
Environment=ACTIONS_RUNNER_HOOK_JOB_COMPLETED=/usr/local/libexec/phvx-runner-job-completed.sh
