# operator-refactored defends two workloads in the `litellm` namespace with: event-driven,
# reactive, rotate only. Rotate (not quarantine) because a deny-all NetworkPolicy can
# isolate more than the target on some CNIs (docs/services/actuator.md).
#
# antiOverRotationWindow is short (20s) so the benchmark can fire several attacks at the
# same workload in succession and see each one rotate, rather than the second being
# rate-limited as an over-rotation.
---
# LiteLLM proxy: 3 replicas, so keep 2 available across a rotation.
apiVersion: phorvex.ai/v1alpha1
kind: PhorvexPolicy
metadata:
  name: litellm-defense
  namespace: litellm
  labels:
    app.kubernetes.io/part-of: litellm-defense-benchmark
spec:
  tenant: litellm
  mode: active
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  actions:
    enabled: [rotate]
  assetValue:
    blastRadiusFromGraph: true
    fromLabels:
      data-class:
        internal: "0.4"
        public: "0.1"
        restricted: "1.0"
    weightSecrets: "0.8"
  budget:
    antiOverRotationWindow: 20s
    maxGracePeriodSeconds: 30
    maxMovesPerTick: 1
    proactiveFloor: 15m
    tickInterval: 5s
  objective:
    costWeights:
      flowDisruption: "0.6"
      normSparsity: "0.4"
    disruptionAversion: "1"
    lambda: "0"
  slo:
    costCeiling: "1.2"
    minAvailableReplicas: 2
  triggers:
    eventAgeHorizon: 1h
    eventDriven: true
    reactiveOnly: true
---
# vLLM: a single GPU-backed replica. Rotate is the wrong tool for it — evicting the sole
# GPU pod cannot be confirmed (the replacement cannot schedule until the old pod frees the
# one GPU), so the operator would dispatch but safely decline to leave no model server.
# Quarantine is the right actuator here: it network-isolates the compromised pod in place
# (a deny-all NetworkPolicy) without destroying the only model server.
apiVersion: phorvex.ai/v1alpha1
kind: PhorvexPolicy
metadata:
  name: vllm-defense
  namespace: vllm
  labels:
    app.kubernetes.io/part-of: litellm-defense-benchmark
spec:
  tenant: vllm
  mode: active
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  actions:
    enabled: [quarantine]
  assetValue:
    blastRadiusFromGraph: true
    fromLabels:
      data-class:
        internal: "0.4"
        public: "0.1"
        restricted: "1.0"
    weightSecrets: "0.8"
  budget:
    antiOverRotationWindow: 20s
    maxGracePeriodSeconds: 30
    maxMovesPerTick: 1
    proactiveFloor: 15m
    tickInterval: 5s
  objective:
    costWeights:
      flowDisruption: "0.6"
      normSparsity: "0.4"
    disruptionAversion: "1"
    lambda: "0"
  slo:
    costCeiling: "5.0"
    minAvailableReplicas: 0
  triggers:
    eventAgeHorizon: 1h
    eventDriven: true
    reactiveOnly: true
