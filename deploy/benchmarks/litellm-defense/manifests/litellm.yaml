# The protected workloads, each in its OWN namespace so the operator defends each as its
# own tenant (a cluster-scoped SecurityEvent routes to a policy by its target's namespace):
#   - namespace litellm : the LiteLLM proxy (3 replicas) + demo-load traffic
#   - namespace vllm    : the GPU-backed model server (1 replica)
#
# Both litellm and vllm are fronted by an nginx sidecar that counts requests in stub_status;
# the exporter turns that into http_requests_total per pod — the metric the sensor reads so
# the brain can price an action. Without that load, an action is refused (missing-load).
#
# Images are pinned to tags install.sh does not rewrite. Adjust MODEL / GPU in install.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: litellm
  labels:
    app.kubernetes.io/part-of: litellm-defense-benchmark
---
apiVersion: v1
kind: Namespace
metadata:
  name: vllm
  labels:
    app.kubernetes.io/part-of: litellm-defense-benchmark
---
# vLLM: the GPU model server, in its own namespace/tenant. Single replica (one GPU set),
# fronted by an nginx sidecar so it carries a measured request rate and the brain can price
# an action. Labelled as a target; its policy (manifests/policy.yaml) defends it with
# quarantine — network-isolating the compromised pod in place rather than destroying the
# only model server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm
  labels: {app.kubernetes.io/name: vllm, app.kubernetes.io/part-of: litellm-defense-benchmark}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: vllm}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/part-of: litellm-defense-benchmark
        data-class: internal
        r6th.io/rotation-target: "true"
    spec:
      enableServiceLinks: false
      runtimeClassName: nvidia
      containers:
      - name: vllm
        image: __VLLM_IMAGE__
        # Tensor-parallel across the pod's GPUs (TP=1 on a single GPU).
        args: ["--model", "__MODEL__", "--tensor-parallel-size", "__TP__", "--dtype", "__DTYPE__", "--max-model-len", "__MAX_LEN__", "--gpu-memory-utilization", "__GPU_MEM_UTIL__", "--port", "8000"]
        ports: [{name: api, containerPort: 8000}]
        env:
        - {name: HF_HOME, value: /tmp/hf}
        # Optional; needed only for gated models. install.sh creates the (possibly empty) secret.
        - {name: HUGGING_FACE_HUB_TOKEN, valueFrom: {secretKeyRef: {name: hf-token, key: token, optional: true}}}
        readinessProbe:
          httpGet: {path: /health, port: api}
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 90
        resources:
          # No memory limit: loading a large model needs more host RAM than a tight cap allows.
          limits: {nvidia.com/gpu: __GPUS__}
          requests: {cpu: "2", memory: 8Gi}
        volumeMounts:
        - {name: cache, mountPath: /tmp/hf}
        - {name: shm, mountPath: /dev/shm}   # NCCL needs shared memory for multi-GPU TP
      - name: web
        image: public.ecr.aws/nginx/nginx-unprivileged:1.27-alpine
        ports: [{name: http, containerPort: 8080}]
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 10
        resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
        volumeMounts:
        - {name: nginx-conf, mountPath: /etc/nginx/conf.d, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      - name: exporter
        image: public.ecr.aws/nginx/nginx-prometheus-exporter:1.4.0
        args: ["--nginx.scrape-uri=http://127.0.0.1:8081/stub_status"]
        ports: [{name: metrics, containerPort: 9113}]
        resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {memory: 32Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
      volumes:
      - {name: cache, emptyDir: {}}
      - {name: shm, emptyDir: {medium: Memory, sizeLimit: 8Gi}}
      - {name: nginx-conf, configMap: {name: vllm-nginx}}
      - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: vllm, namespace: vllm}
spec:
  selector: {app.kubernetes.io/name: vllm}
  ports: [{name: http, port: 8000, targetPort: http}]   # -> nginx :8080 -> vLLM :8000
---
apiVersion: v1
kind: ConfigMap
metadata: {name: vllm-nginx, namespace: vllm}
data:
  default.conf: |
    server {
      listen 8080;
      location = /healthz { return 200 "ok\n"; }
      location / { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 300s; }
    }
    server {
      listen 127.0.0.1:8081;
      location = /stub_status { stub_status; }
    }
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm
  namespace: vllm
  labels: {app.kubernetes.io/name: vllm, app.kubernetes.io/part-of: litellm-defense-benchmark}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: vllm}
  podMetricsEndpoints:
  - port: metrics
    interval: 15s
    metricRelabelings:
    - action: keep
      sourceLabels: [__name__]
      regex: nginx_http_requests_total|nginx_up
    - action: replace
      sourceLabels: [__name__]
      regex: nginx_http_requests_total
      targetLabel: __name__
      replacement: http_requests_total
---
apiVersion: v1
kind: ConfigMap
metadata: {name: litellm-config, namespace: litellm}
data:
  config.yaml: |
    model_list:
    - model_name: demo
      litellm_params:
        model: openai/__MODEL__
        api_base: http://vllm.vllm.svc.cluster.local:8000/v1
        api_key: none
    general_settings:
      # Open for the benchmark; the request counter is what the brain reads, not the content.
      disable_master_key_check: true
---
# nginx fronts LiteLLM in the same pod and counts requests in stub_status, so each
# rotation-target pod has a deterministic request rate regardless of LiteLLM's own
# (version-dependent, often absent) metrics — the proven demo-api pattern. The exporter
# turns that count into http_requests_total, the metric the sensor reads per pod.
apiVersion: v1
kind: ConfigMap
metadata: {name: litellm-nginx, namespace: litellm}
data:
  default.conf: |
    server {
      listen 8080;
      location = /healthz { return 200 "ok\n"; }
      location / { proxy_pass http://127.0.0.1:4000; proxy_read_timeout 120s; }
    }
    server {
      listen 127.0.0.1:8081;
      location = /stub_status { stub_status; }
    }
---
# LiteLLM proxy (fronted by nginx): the PROTECTED, rotation-target workload.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels: {app.kubernetes.io/name: litellm, app.kubernetes.io/part-of: litellm-defense-benchmark}
spec:
  replicas: 3
  selector:
    matchLabels: {app.kubernetes.io/name: litellm}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/part-of: litellm-defense-benchmark
        data-class: internal
        r6th.io/rotation-target: "true"
    spec:
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: web
        image: public.ecr.aws/nginx/nginx-unprivileged:1.27-alpine
        ports: [{name: http, containerPort: 8080}]
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 10
        resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
        volumeMounts:
        - {name: nginx-conf, mountPath: /etc/nginx/conf.d, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      - name: litellm
        image: ghcr.io/berriai/litellm:main-v1.53.1
        args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
        readinessProbe:
          httpGet: {path: /health/liveliness, port: 4000}
          periodSeconds: 10
        resources:
          requests: {cpu: 50m, memory: 256Mi}
          limits: {memory: 512Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: {drop: ["ALL"]}}
        volumeMounts: [{name: config, mountPath: /etc/litellm, readOnly: true}]
      - name: exporter
        image: public.ecr.aws/nginx/nginx-prometheus-exporter:1.4.0
        args: ["--nginx.scrape-uri=http://127.0.0.1:8081/stub_status"]
        ports: [{name: metrics, containerPort: 9113}]
        resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {memory: 32Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
      volumes:
      - {name: config, configMap: {name: litellm-config}}
      - {name: nginx-conf, configMap: {name: litellm-nginx}}
      - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: litellm, namespace: litellm}
spec:
  selector: {app.kubernetes.io/name: litellm}
  ports: [{name: http, port: 80, targetPort: http}]   # -> nginx :8080 -> litellm :4000
---
# Steady chat traffic through the Service, so every LiteLLM pod (and vLLM behind it) has a
# measured request rate; without a load the brain prices an action at its conservative
# bound and the SLO gate refuses it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-load
  namespace: litellm
  labels: {app.kubernetes.io/name: demo-load, app.kubernetes.io/part-of: litellm-defense-benchmark}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: demo-load}
  template:
    metadata:
      labels: {app.kubernetes.io/name: demo-load, app.kubernetes.io/part-of: litellm-defense-benchmark}
    spec:
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: load
        image: curlimages/curl:8.11.0
        command: ["sh", "-c"]
        args:
        - |
          while true; do
            curl -s -m 8 -o /dev/null -X POST http://litellm/v1/chat/completions \
              -H 'content-type: application/json' \
              -d '{"model":"demo","messages":[{"role":"user","content":"ping"}],"max_tokens":1}' || true
            sleep 0.5
          done
        resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
---
# Scrape the LiteLLM nginx exporter and expose its request counter as http_requests_total,
# the metric the sensor reads per pod.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: litellm
  namespace: litellm
  labels: {app.kubernetes.io/name: litellm, app.kubernetes.io/part-of: litellm-defense-benchmark}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: litellm}
  podMetricsEndpoints:
  - port: metrics
    interval: 15s
    metricRelabelings:
    - action: keep
      sourceLabels: [__name__]
      regex: nginx_http_requests_total|nginx_up
    - action: replace
      sourceLabels: [__name__]
      regex: nginx_http_requests_total
      targetLabel: __name__
      replacement: http_requests_total
