# ─────────────────────────────────────────────────────────────────────────────
# EKS overlay — the desired state ArgoCD reconciles for the live cluster.
#
# This file was written to reproduce the RUNNING deployment byte-for-byte at the moment
# ArgoCD adopted it, so the first sync is a no-op rather than a silent reconfiguration.
# Several settings below (epss, actuator, operatorNamespace, the Phoenix tag) existed only
# as hand-patches on the live Deployment and were not expressible in the chart; they are
# desired state now, which is the point.
#
# The three image tags are MACHINE-EDITED. `.github/workflows/ci.yml` rewrites them on
# every merge to main and pushes the commit — that commit is the deployment. Keep the
# `tag:` keys on their own line and quoted, or the sed in the release job will miss them.
# ─────────────────────────────────────────────────────────────────────────────
global:
  registry: 753556437180.dkr.ecr.us-east-2.amazonaws.com

# ── Phoenix is deliberately NOT managed by ArgoCD ────────────────────────────
# Phoenix is unmodified third-party software, already installed in this cluster, and the
# copy vendored at deploy/helm/phorvex-stack/charts/phoenix-0.1.4.tgz is OLDER than what is
# running: its CRDs were generated with controller-gen v0.16.0 while the live
# SecurityEvent / AdaptiveMovingTargetDefense CRDs are v0.17.2. A `kubectl diff` of the
# rendered chart against the cluster showed the sync would DELETE 18 schema fields —
# spec.baseline, spec.anomalyScore and spec.evidence among them — silently invalidating any
# CR that uses them.
#
# CD for this repo means CD for Phorvex, the thing this repo builds. Adopting a third-party
# dependency through a stale vendored chart is how a deploy pipeline destroys state it was
# never asked to own. Upgrade Phoenix deliberately: refresh the vendored chart from
# upstream, diff it against the cluster, then flip this to true.
phoenix:
  enabled: false

phorvex:
  enabled: true
  installCRD: true
  phorvex:
    image:
      # The phorvex subchart has no global-registry helper (unlike the dashboard), so the
      # registry has to be spelled out in the repository here.
      repository: 753556437180.dkr.ecr.us-east-2.amazonaws.com/phorvex
      tag: "0.4.149"    # ci:phorvex-tag
      pullPolicy: IfNotPresent
    baseInterval: 10s
    leaderElect: true
    globalKillSwitch: false
    # Points at the kube-prometheus-stack in `monitoring`, NOT the old gpu-telemetry
    # Prometheus. That one scraped exactly one target (dcgm-exporter) and held 23 metric
    # names, so every cAdvisor and HTTP series ingest/prometheus.go asks for came back
    # empty and Telemetry.Present stayed false for non-GPU pods. Physics measured that
    # directly: residual was 0 on all 118 records of the last end-to-end run, across all
    # four namespaces — the whole flow/queue/fanout half of littleslaw.go was dead.
    #
    # The new stack is a strict superset: it carries the same dcgm job, adds kubelet
    # cAdvisor (BytesIn/BytesOut), a standalone cAdvisor for container_network_tcp_usage_total
    # (ConnCount — the kubelet does not expose it), kube-state-metrics, node-exporter, and
    # vLLM's native histograms. Recording rules in the `phorvex-physics-bridge`
    # PrometheusRule map real series onto the names DefaultPromQueries() hardcodes,
    # because cmd/main.go passes a nil query map and there is no override hook.
    prometheusUrl: http://kube-prom-stack-kube-prome-prometheus.monitoring.svc.cluster.local:9090
    gpuEnvelopeMax: 0.2925
    operatorNamespace: phorvex-system
    # hybrid drives Phoenix CRs and the direct path. This was an env var patched onto the
    # live Deployment; dropping it on adoption would have changed which actuator runs, and
    # the E2E checks A01–A04 assert on exactly that.
    actuator: hybrid
    e2eDetector:
      enabled: true
      targetNamespace: voice
    # PHVX-9b requires every NaN-cost veto to be visible. The live EKS cluster
    # already runs kube-prometheus-stack, so render the dedicated rule here.
    costNaNAlert:
      enabled: true

    # ── the live decision audit ──────────────────────────────────────────────
    # The console streams /api/live from a FILE. Without this the in-cluster console had
    # nothing live to stream and fell back to the snapshot baked into its own image — which
    # is why console.phorvex.ai was serving decisions from a kind cluster
    # (node: amtd-test-control-plane) dated two months earlier, labelled "Live Theatre".
    audit:
      enabled: true
      path: /audit/live.jsonl
      maxBytes: 268435456
      volumeGuard:
        enabled: true
      persistence:
        enabled: true
        storageClass: gp2-csi
        size: 5Gi

    # ── console, identity-isolated ────────────────────────────────────────────
    # Runs in its own Pod and ServiceAccount. It reads the manager-owned audit file only
    # through the mutually authenticated transport below. Before the first rollout,
    # provision these exact identities with deploy/eks/provision-audit-mtls.sh.
    console:
      enabled: true
      allowWorkloadMutations: true
      auditTransport:
        port: 8445
        serverSecretName: phorvex-audit-server
        clientSecretName: phorvex-audit-client
        serverDNSName: phorvex-stack-phorvex-audit-source.phorvex-system.svc
        clientDNSName: phorvex-stack-phorvex-console.phorvex-system.svc
      image:
        repository: 753556437180.dkr.ecr.us-east-2.amazonaws.com/phorvex-console
        tag: "0.4.151" # ci:console-tag
        pullPolicy: IfNotPresent
      port: 8090
      # Milad authorized a 30-day retention window on 2026-09-22.
      # Compress retained records; keep the existing finite ceiling and filesystem reserve.
      state:
        historyRetentionDays: 30
        historyArchiveMaxBytes: "6442450944"
        historyMinFreeBytes: "536870912"
        persistence:
          size: 10Gi
      # ── console identity and authorization (M-136) ────────────────────────
      # The ALB below already forces Cognito login, but until this fix the POD accepted whatever
      # the request asserted: a self-declared `X-Phorvex-Lens: operator` header reached the
      # mutation endpoints that shell out to kubectl. The console now verifies the ALB's own
      # ES256 signature on x-amzn-oidc-data and authorizes the verified subject from an explicit
      # grant table.
      #
      # These three values are read back from the LIVE ingress annotations further down this
      # file — the same load balancer, user pool and app client. They are configuration
      # identifiers, not secrets. They are also specific to THIS cluster: another environment
      # must configure its own, never reuse these.
      auth:
        alb:
          signerArn: arn:aws:elasticloadbalancing:us-east-2:753556437180:loadbalancer/app/k8s-phorvexs-phorvexc-a8e81988e6/46c1992f6311801f
          additionalSignerArns:
            - arn:aws:elasticloadbalancing:us-east-2:753556437180:loadbalancer/app/phorvex-prd-console/41c2083aa2e1ebba
          issuer: https://cognito-idp.us-east-2.amazonaws.com/us-east-2_JfwlBPRbB
          clientId: 2ms9uge9hm4uap1h0ida3it9on
          region: us-east-2
        # The public console origin, for the same-origin/CSRF boundary on browser mutations.
        # ── E2E pipeline machine identity (docs/CONSOLE-AUTH.md, DevOps handoff) ──
        # Bearer IdP = this cluster's own OIDC issuer (public JWKS, RS256). CI mints a
        # projected token for the console-e2e ServiceAccount below with this audience and
        # sends it as `Authorization: Bearer` through a loopback tunnel on the jump host.
        oidc:
          issuer: https://oidc.eks.us-east-2.amazonaws.com/id/B4E80A6F4AB1E51169435AFFDC706401
          audience: phorvex-console
          jwksUrl: https://oidc.eks.us-east-2.amazonaws.com/id/B4E80A6F4AB1E51169435AFFDC706401/keys
        e2eIdentity:
          enabled: true
        trustedOrigins:
          - https://console.phorvex.ai
          - https://console-prd.phorvex.ai
        # Approved 2026-09-16: the verified Cognito identity below may operate across
        # namespaces on this cluster only. "default" also covers the in-cluster alias.
        # Changing this mounted policy requires a console restart; grants load at startup.
        grants:
          enabled: true
          create: true
          data: |
            {
              "version": 1,
              "subjects": [
                {
                  "issuer": "https://cognito-idp.us-east-2.amazonaws.com/us-east-2_JfwlBPRbB",
                  "subject": "71fb8550-3041-702a-5735-a33baf8836c8",
                  "roles": ["operator"],
                  "tenants": ["*"],
                  "targets": ["default"],
                  "note": "Operator access approved by the deployment owner on 2026-09-16"
                },
                {
                  "issuer": "https://oidc.eks.us-east-2.amazonaws.com/id/B4E80A6F4AB1E51169435AFFDC706401",
                  "subject": "system:serviceaccount:phorvex-system:phorvex-phorvex-console-e2e",
                  "roles": ["operator"],
                  "tenants": ["voice", "nats", "vllm"],
                  "targets": ["default"],
                  "note": "End-to-End pipeline (CI). Operator only on the namespaces End-to-End/config.json fires at; token minted per run, never stored."
                }
              ]
            }
    # ── Namespaced actuation RBAC (startup authorization preflight) ───────────────
    # The operator refuses to start unless it holds, in EVERY namespace that carries a
    # PhorvexPolicy, the verbs its enabled actions need (pods delete/update/patch,
    # NetworkPolicies, Service selector restitching, EndpointSlice list). The chart grants
    # those only through per-namespace Role/RoleBindings rendered from this list — nothing
    # cluster-wide. Every namespace here has a live policy; a policy in a namespace that is
    # NOT listed makes the operator fail closed at startup (v0.4.122 outage, 2026-09-17).
    # ── Serving-control transport (kv-reset, kv-migrate-invalidate, guardrail-rotate,
    # adapter-rotate, request-drain, warm-swap, model-shard-replace) ──────────────────
    # Default `secure-required` needs an exact TLS binding (policy UID + workload SA +
    # bearer/CA Secret) per serving workload; with none configured EVERY serving-control
    # actuator is "unsupported" and a KV attack can only be answered by rotate. This dev
    # cluster's vLLM control endpoints are plain HTTP inside the cluster, so the explicit
    # migration mode is the truthful setting. Visibly insecure by contract: move back to
    # secure-required + bindings once the serving pods expose TLS admin endpoints.
    servingSecurity:
      mode: legacy-plaintext
    # ── Detector allowlist (M-94) ─────────────────────────────────────────────────
    # Chart default plus the console: attacks fired from the console UI create
    # SecurityEvents as the console ServiceAccount, and an unlisted creator carries no
    # belief evidence (the brain ignores it). Listing the console makes the dashboard's
    # attack controls count as real signal. The e2e-detector is appended by the chart.
    trustedDetectors:
      - vllm/detector-kv-canary
      - vllm/detector-adapter-inv
      - phorvex-system/operator-controller-manager
      - phorvex-system/phorvex-phorvex-console
    actuatorNamespaces:
      - voice
      - nats
      - vllm
      - litellm
      - crm
      - mcp
      - document-store
      - ci-reports
    epss:
      enabled: true
      configMapName: phorvex-epss
      mountPath: /etc/phorvex
      fileName: epss-cache.json
      refreshInterval: 30s
      # Was a hand-applied ConfigMap that existed in no repository. The operator MOUNTS it,
      # so losing it means the pod never starts — recovered from the live cluster and put
      # under GitOps here.
      create: true
      # Run the complete pipeline daily in dry-run mode. Applying remains gated until
      # the private ECR images have a dedicated read-only IRSA role and the resulting
      # dispersion/cap impact has been reviewed under PHORVEXSEC-115.
      feed:
        enabled: true
        schedule: "17 3 * * *"
        suspend: false
        apply: false
        allowPartial: false
        serviceAccount:
          annotations: {}
          # eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<ecr-read-role>
        extraEnv:
          - name: AWS_REGION
            value: us-east-2
        tolerations:
          - key: CriticalAddonsOnly
            operator: Equal
            value: "true"
            effect: NoSchedule
      data: |
        {
          "docker.io/vllm/vllm-openai@sha256:4f4037303e8c7b69439db1077bb849a0823517c0f785b894dc8e96d58ef3a0c2": {
            "epss": 0.00676,
            "cvss": 7.5
          },
          "ghcr.io/berriai/litellm@sha256:afdc3cc37493d4f86d485ad7ac4445e7154c568a8d47c01bad15c9cf062c66b5": {
            "epss": 0.99999,
            "cvss": 7.5
          },
          "public.ecr.aws/nginx/nginx@sha256:2e498e99757ae225fe9f1fb34144bc64f7abb8e49d2a35c84508b209f1319aa8": {
            "epss": 0.52838,
            "cvss": 7.7
          },
          "753556437180.dkr.ecr.us-east-2.amazonaws.com/mock-rag-chatbot@sha256:99e22d25c345eaf016ec35fb10095f69110cf45b9a23ba4274c36e0dbdd26b17": {
            "epss": 0.01386,
            "cvss": 7.5
          }
        }
    resources:
      limits: { cpu: 500m, memory: 256Mi }
      requests: { cpu: 10m, memory: 64Mi }
    # Keep the shared RWO audit writer/console on the system pool. Tolerating
    # CriticalAddonsOnly alone does not prevent placement onto database nodes.
    nodeSelector:
      node-type: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Equal
        value: "true"
        effect: NoSchedule

dashboard:
  enabled: true
  # The console runs inside the operator's pod so it can read the audit file the operator
  # writes. This chart then contributes only the Service and Ingress; the container itself
  # is rendered by the subchart from phorvex.console above.
  sidecar: true
  image:
    # NOT machine-edited, and deliberately carries no `# ci:` marker — the tag CI rewrites
    # is phorvex.console.image.tag above. Two markers with the same name would make the
    # release step ambiguous, and it fails rather than guess. This block is only read if
    # `sidecar` is turned back off.
    repository: phorvex/phorvex-console   # basename + global.registry => <ecr>/phorvex-console
    tag: "0.4.5"
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8090
  service:
    # ClusterIP, NOT LoadBalancer. A LoadBalancer here provisions a SECOND internet-facing ELB
    # (acea4b96…elb.amazonaws.com) that reaches the console with NO authentication — an open
    # back door straight past the Cognito gate on the console.phorvex.ai ALB ingress. With that
    # ELB in place the auth is theatre: anyone who resolves the service hostname bypasses login.
    # (Verified live: the Cognito redirect only fires on the ALB host; the ELB serves the console
    # unauthenticated.)
    #
    # ClusterIP closes it. The ALB ingress is unaffected — it uses target-type=ip (confirmed in
    # the annotations below), so the controller registers pod IPs from this service's
    # EndpointSlices, which a ClusterIP service provides exactly as a LoadBalancer one did.
    # console.phorvex.ai keeps working; only the unauthenticated ELB path is removed.
    type: ClusterIP
    port: 80
  ingress:
    # console.phorvex.ai was a hand-applied Ingress owned by nobody: not in this chart, not
    # in any repository. Deleting it would have taken the public console offline with no way
    # to recreate it except from memory. These annotations were read back from the live
    # object so ArgoCD ADOPTS the existing ALB instead of provisioning a new one — a
    # mismatch here would make the controller replace the load balancer, changing its
    # hostname and breaking DNS until external-dns caught up.
    enabled: true
    className: alb
    host: console.phorvex.ai
    tls: false
    annotations:
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-2:753556437180:certificate/6f771a0d-5c30-4897-bcba-9422024cd3b6
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/security-groups: sg-098aac8d74e88e2fe
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/subnets: subnet-0e2c4f3f433045f81,subnet-08bd0af4dcc7672e2
      alb.ingress.kubernetes.io/target-type: ip
      external-dns.alpha.kubernetes.io/hostname: console.phorvex.ai
      # ── Cognito authentication (P-VCLUSTER auth gate) ──────────────────────
      # The ALB itself enforces login BEFORE any request reaches the console pod, so this is
      # the auth boundary that makes it safe to expose live cluster-control (policy edit).
      # An unauthenticated request is redirected to the Cognito hosted UI; only a logged-in
      # session reaches the app. No console code change is needed for the gate.
      #
      # Resources created out-of-band (aws cognito-idp, admin-create-user-only so there is no
      # public self-signup): user pool us-east-2_JfwlBPRbB, this app client, hosted domain
      # phorvex-console-753556437180.
      #
      # PREREQUISITE, verify before merge: the aws-load-balancer-controller's IAM role needs
      #   cognito-idp:DescribeUserPoolClient  (it reads the client secret to drive the flow).
      # Without it the ALB cannot configure the auth action and the listener update fails.
      #
      # SIDE EFFECT: this authenticates the WHOLE host, /api included. The End-to-End pipeline
      # drives console.phorvex.ai/api/* and will break until it is pointed at the in-cluster
      # console Service (bypassing the ALB) instead of the public host.
      alb.ingress.kubernetes.io/auth-type: cognito
      alb.ingress.kubernetes.io/auth-scope: openid
      alb.ingress.kubernetes.io/auth-on-unauthenticated-request: authenticate
      alb.ingress.kubernetes.io/auth-idp-cognito: '{"userPoolARN":"arn:aws:cognito-idp:us-east-2:753556437180:userpool/us-east-2_JfwlBPRbB","userPoolClientID":"2ms9uge9hm4uap1h0ida3it9on","userPoolDomain":"phorvex-console-753556437180"}'
