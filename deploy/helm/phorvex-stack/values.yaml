# ─────────────────────────────────────────────────────────────────────────────
# Phorvex stack values.
#
# Set `global.registry` to your ECR registry (e.g.
# 123456789012.dkr.ecr.us-east-1.amazonaws.com) and the per-image tags. The deploy
# script (deploy/eks/03-deploy.sh) passes --set global.registry=... for you.
# ─────────────────────────────────────────────────────────────────────────────
global:
  # ECR (or any) registry host that holds the three built images. Empty => the
  # subchart/dashboard defaults below are used verbatim (handy for local kind where
  # images are side-loaded).
  registry: ""

# ── Phoenix (the AMTD executor) ──────────────────────────────────────────────
# Phoenix is UNMODIFIED upstream; you may keep its public ghcr image or push the
# extended build to your registry. If global.registry is set, point amtd.image
# .repository at it explicitly here.
phoenix:
  enabled: true
  amtd:
    image:
      repository: ghcr.io/r6security/phoenix/amtd-operator
      tag: "v0.2.3"
      pullPolicy: IfNotPresent

# ── Phorvex (the brain) ──────────────────────────────────────────────────────
# Subchart name is "phorvex"; its own values live one level deeper under .phorvex.
phorvex:
  enabled: true
  installCRD: true
  phorvex:
    image:
      # OVERRIDDEN by the deploy script to <registry>/phorvex when global.registry set.
      repository: phorvex/phorvex
      tag: "0.1.0"
      pullPolicy: IfNotPresent
    baseInterval: 10s
    leaderElect: true            # HA-safe default for a real cluster
    globalKillSwitch: false      # start actuating; flip on for a dry-run install
    prometheusUrl: ""            # e.g. http://prometheus-server.monitoring.svc:80
    resources:
      limits: { cpu: 500m, memory: 256Mi }
      requests: { cpu: 10m, memory: 64Mi }

# ── Dashboard / console (read-only) ──────────────────────────────────────────
dashboard:
  enabled: true
  # When true the console runs as a container inside the operator's pod (rendered by the
  # phorvex subchart under phorvex.console), and this chart contributes only the Service
  # and Ingress in front of it. See phorvex/charts/phorvex/values.yaml for why.
  sidecar: false
  image:
    repository: phorvex/phorvex-console   # OVERRIDDEN to <registry>/phorvex-console
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8090
  resources:
    limits: { cpu: 500m, memory: 256Mi }
    requests: { cpu: 10m, memory: 64Mi }
  service:
    type: ClusterIP            # set LoadBalancer for a quick external IP on EKS
    port: 80
  ingress:
    enabled: false
    className: alb            # EKS ALB ingress controller; or nginx
    host: ""                  # e.g. console.phorvex.example.com
    annotations: {}
    tls: false

# ── limited-v1 console auth tests: scoped bearer refresher ─────────────────────────────
# Off by default. When enabled it keeps phorvex.console.catalogueV1.scopedToken's Secret
# holding a valid short-lived bearer for `identityServiceAccount`. The Secret itself is
# created out of band (never from git or values) because RBAC cannot restrict `create` by
# name; this CronJob may only patch that one Secret.
catalogueV1TokenRefresher:
  enabled: false
  name: phorvex-catalogue-v1-token-refresher
  identityServiceAccount: phorvex-phorvex-console-e2e
  audience: phorvex-console
  secretName: ""
  key: token
  lifetimeSeconds: 86400
  schedule: "17 */6 * * *"
  # Official python image pinned by digest; the refresher uses only the standard library.
  image: python:3.12-alpine@sha256:4c47124a8391cb7a9f571164147d154777cf012a4ece5f86097130d7a4478111

# Optional source bytes for the existing CPU Pod-bound token response profile.
# Supplying this ConfigMap does not enable the console case or its authority.
catalogueProfiles:
  # Optional immutable source for the existing Mongo synthetic exposure case.
  # Source bytes alone do not enable the console or any fixture authority.
  mongoExposure:
    enabled: false
    configMapName: ""
    profileBase64: ""
  # One reviewed immutable source object for the existing static vLLM
  # confidentiality comparison. Supplying bytes does not enable the case.
  guardrailStatic:
    enabled: false
    configMapName: ""
    profileBase64: ""
  # Optional immutable exact-byte source for the existing injected guardrail
  # effect action. The child console authority remains separately default-off.
  guardrailEffect:
    enabled: false
    configMapName: ""
    profileBase64: ""
  # Versioned application-output confidentiality profile under the existing
  # guardrail catalogue parent. Bytes alone grant no case authority.
  guardrailOutput:
    enabled: false
    configMapName: ""
    profileBase64: ""
  drainLive:
    enabled: false
    configMapName: ""
    profileBase64: ""
  # Immutable, digest-named source for the reviewed vLLM caller-lease case.
  # Supplying profile bytes does not enable the native action or console case.
  endpointLease:
    enabled: false
    configMapName: ""
    profileBase64: ""
  podBoundTokenCPU:
    enabled: false
    configMapName: ""
    profileBase64: ""
    manifestBase64: ""
