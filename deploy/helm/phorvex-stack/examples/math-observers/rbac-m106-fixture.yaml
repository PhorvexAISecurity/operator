# Minimum fixture-only authority. This does not grant access to Secrets or shared config.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: phorvex-m106-scoped-detector-v1
  labels:
    app.kubernetes.io/part-of: phorvex-math-verification
    phorvex.ai/test-family: m106
rules:
  - apiGroups: [amtd.r6security.com]
    resources: [securityevents]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: phorvex-m106-scoped-detector-v1
  labels:
    app.kubernetes.io/part-of: phorvex-math-verification
    phorvex.ai/test-family: m106
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: phorvex-m106-scoped-detector-v1
subjects:
  - kind: ServiceAccount
    name: m106-scoped-detector
    namespace: phorvex-verify-m106-scoped-outcome-v4
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: phorvex-m106-scoped-outcome-v4-native-rotate
  namespace: phorvex-verify-m106-scoped-outcome-v4
  labels:
    app.kubernetes.io/part-of: phorvex-math-verification
    phorvex.ai/test-family: m106
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: phorvex-m106-scoped-outcome-v4-native-rotate
  namespace: phorvex-verify-m106-scoped-outcome-v4
  labels:
    app.kubernetes.io/part-of: phorvex-math-verification
    phorvex.ai/test-family: m106
roleRef:
