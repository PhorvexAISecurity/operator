{{- $source := .Values.catalogueProfiles.mongoExposure -}}
{{- $child := get .Values.phorvex "phorvex" | default dict -}}
{{- $console := get $child "console" | default dict -}}
{{- $mongo := get $console "mongoExposure" | default dict -}}
{{- if $source.enabled -}}
{{- $name := required "catalogueProfiles.mongoExposure.configMapName is required" $source.configMapName -}}
{{- if not (kindIs "string" $name) -}}{{- fail "catalogueProfiles.mongoExposure.configMapName must be a string" -}}{{- end -}}
{{- if or (gt (len $name) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $name)) -}}
{{- fail "catalogueProfiles.mongoExposure.configMapName must be a DNS subdomain name" -}}
{{- end -}}
{{- range (splitList "." $name) -}}{{- if gt (len .) 63 -}}{{- fail "catalogueProfiles.mongoExposure.configMapName DNS label exceeds 63 characters" -}}{{- end -}}{{- end -}}
{{- $profile := required "catalogueProfiles.mongoExposure.profileBase64 is required" $source.profileBase64 -}}
{{- if not (kindIs "string" $profile) -}}{{- fail "catalogueProfiles.mongoExposure.profileBase64 must be a string" -}}{{- end -}}
{{- $profileBytes := b64dec $profile -}}
{{- if or (eq $profileBytes "") (gt (len $profileBytes) 262144) (ne (b64enc $profileBytes) $profile) -}}
{{- fail "catalogueProfiles.mongoExposure.profileBase64 must be canonical bounded nonempty base64" -}}
{{- end -}}
{{- $digest := sha256sum $profileBytes -}}
{{- if ne $name (printf "phorvex-catalogue-mongo-%s" (trunc 12 $digest)) -}}
{{- fail "catalogueProfiles.mongoExposure.configMapName must match decoded profile SHA prefix" -}}
{{- end -}}
{{- if (get $mongo "enabled") -}}
{{- if ne (get $mongo "configMapName") $name -}}{{- fail "console.mongoExposure.configMapName must match catalogueProfiles.mongoExposure.configMapName" -}}{{- end -}}
{{- if ne (get $mongo "profileSHA256") $digest -}}{{- fail "console.mongoExposure.profileSHA256 must match decoded catalogue profile" -}}{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name | quote }}
  namespace: {{ .Release.Namespace }}
immutable: true
binaryData:
  config.mongo-exposure-baseline.yaml: {{ $profile | quote }}
{{- end -}}
