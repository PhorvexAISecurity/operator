{{- if .Values.litellmGatewayMetrics.enabled }}
{{- if or (ne .Release.Namespace "phorvex-system") (ne .Release.Name "phorvex") }}{{ fail "litellmGatewayMetrics requires phorvex-system release namespace" }}{{- end }}
{{- $console := .Values.phorvex.phorvex.console.litellmLive }}
{{- $source := .Files.Get "files/litellm-m1b/gateway-metrics-source-configmap.json" | fromJson }}
{{- $profile := .Files.Get "files/litellm-m1b/phorvex-litellm-live-profile-64098e6f1280.json" | fromJson }}
{{- $sha := sha256sum (get $source.data "gateway.py") }}
{{- $profileSHA := sha256sum (get $profile.data "profile.json") }}
{{- $value := get $profile.data "profile.json" | fromJson }}
{{- if or (ne $sha "f550b9890b20da4b02b68fac5c102a99a0313e6f419dc41dd0c409b2bdd165c1") (ne $source.metadata.name (printf "phorvex-litellm-admission-gateway-%s" (trunc 12 $sha))) }}{{ fail "M1b immutable source bytes/name differ" }}{{- end }}
{{- if or (ne $value.sourceSHA256 $sha) (ne $value.gatewayImage "753556437180.dkr.ecr.us-east-2.amazonaws.com/phorvex@sha256:cb16b9b573dea616b184263915f7cb259f39e012650d8ad398456e0e6c91a108") (ne $profile.metadata.name (printf "phorvex-litellm-live-profile-%s" (trunc 12 $profileSHA))) }}{{ fail "M1b immutable profile source/runtime/name differ" }}{{- end }}
{{- if or (not $console.enabled) (ne $console.configMapName $profile.metadata.name) (ne $console.profileSHA256 $profileSHA) (ne $console.sourceConfigMapName $source.metadata.name) }}{{ fail "M1b active Console profile/source closure differs" }}{{- end }}
{{- range $path, $_ := .Files.Glob "files/litellm-m1b/*.json" }}
---
{{ $.Files.Get $path | fromJson | toYaml }}
{{- end }}
---
# Both reviewed sources remain readable through convergence and rollback.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: phorvex-console-litellm-metrics-source
  namespace: litellm
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames:
  - phorvex-litellm-admission-gateway-4bf046ce690c
  - phorvex-litellm-admission-gateway-f550b9890b20
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: phorvex-console-litellm-metrics-source
  namespace: litellm
subjects:
- kind: ServiceAccount
  name: phorvex-phorvex-console
  namespace: phorvex-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: phorvex-console-litellm-metrics-source
{{- end }}
