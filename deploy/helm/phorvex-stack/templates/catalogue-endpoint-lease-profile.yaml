{{- $source := .Values.catalogueProfiles.endpointLease -}}
{{- $child := get .Values.phorvex "phorvex" | default dict -}}
{{- $console := get $child "console" | default dict -}}
{{- $runtime := get $console "endpointLease" | default dict -}}
{{- if $source.enabled -}}
{{- $name := required "catalogueProfiles.endpointLease.configMapName is required" $source.configMapName -}}
{{- $encoded := required "catalogueProfiles.endpointLease.profileBase64 is required" $source.profileBase64 -}}
{{- if not (kindIs "string" $encoded) -}}{{- fail "catalogueProfiles.endpointLease.profileBase64 must be a string" -}}{{- end -}}
{{- $raw := b64dec $encoded -}}
{{- if or (eq $raw "") (gt (len $raw) 8192) (ne (b64enc $raw) $encoded) -}}{{- fail "catalogueProfiles.endpointLease.profileBase64 must be canonical bounded base64" -}}{{- end -}}
{{- $digest := sha256sum $raw -}}
{{- if ne $name (printf "phorvex-catalogue-endpoint-lease-%s" (trunc 12 $digest)) -}}{{- fail "catalogueProfiles.endpointLease name must match decoded profile SHA" -}}{{- end -}}
{{- if (get $runtime "enabled") -}}
{{- if ne (get $runtime "configMapName") $name -}}{{- fail "console.endpointLease.configMapName must match source" -}}{{- end -}}
{{- if ne (get $runtime "profileSHA256") $digest -}}{{- fail "console.endpointLease.profileSHA256 must match source" -}}{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name | quote }}
  namespace: {{ .Release.Namespace }}
immutable: true
binaryData:
  profile.json: {{ $encoded | quote }}
{{- end -}}
