{{- $source := .Values.catalogueProfiles.guardrailOutput -}}
{{- $child := get .Values.phorvex "phorvex" | default dict -}}
{{- $console := get $child "console" | default dict -}}
{{- $output := get $console "guardrailOutput" | default dict -}}
{{- if $source.enabled -}}
{{- $name := required "catalogueProfiles.guardrailOutput.configMapName is required" $source.configMapName -}}
{{- if or (gt (len $name) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $name)) -}}
{{- fail "catalogueProfiles.guardrailOutput.configMapName must be a DNS subdomain" -}}
{{- end -}}
{{- range (splitList "." $name) -}}{{- if gt (len .) 63 -}}{{- fail "catalogueProfiles.guardrailOutput.configMapName DNS label exceeds 63 characters" -}}{{- end -}}{{- end -}}
{{- $profile := required "catalogueProfiles.guardrailOutput.profileBase64 is required" $source.profileBase64 -}}
{{- if not (kindIs "string" $profile) -}}{{- fail "catalogueProfiles.guardrailOutput.profileBase64 must be a string" -}}{{- end -}}
{{- $bytes := b64dec $profile -}}
{{- if or (eq $bytes "") (gt (len $bytes) 65536) (ne (b64enc $bytes) $profile) -}}
{{- fail "catalogueProfiles.guardrailOutput.profileBase64 must be canonical bounded nonempty base64" -}}
{{- end -}}
{{- $digest := sha256sum $bytes -}}
{{- if ne $name (printf "phorvex-catalogue-guardrail-output-%s" (trunc 12 $digest)) -}}
{{- fail "catalogueProfiles.guardrailOutput.configMapName must match decoded profile SHA prefix" -}}
{{- end -}}
{{- if (get $output "enabled") -}}
{{- if ne (get $output "configMapName") $name -}}{{- fail "console.guardrailOutput.configMapName must match catalogueProfiles.guardrailOutput.configMapName" -}}{{- end -}}
{{- if ne (get $output "profileSHA256") $digest -}}{{- fail "console.guardrailOutput.profileSHA256 must match decoded catalogue profile" -}}{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name | quote }}
  namespace: {{ .Release.Namespace }}
immutable: true
binaryData:
  config.guardrail-output-response.yaml: {{ $profile | quote }}
{{- end -}}
